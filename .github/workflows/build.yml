name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-bundle:
    name: Build Windows Bundle
    # Same Windows-fallback guard as windows-build.yml: never let
    # `windows-2025` be a silent fallback on the private dev repo. On
    # the OSS public repo Windows runners are unmetered; on the dev
    # repo the operator must wire WINDOWS_BUILD_RUNNER to a self-
    # hosted Windows runner explicitly. Otherwise the manual
    # workflow_dispatch becomes a no-op.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.repository == 'kombifyio/SpeechKit' || vars.WINDOWS_BUILD_RUNNER != '')
    runs-on: ${{ vars.WINDOWS_BUILD_RUNNER || 'windows-2025' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.3'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Setup MinGW
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build canonical Windows bundle
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInstaller

      - name: Build canonical Windows bundle and installer
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify build did not dirty tracked files
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code

      - name: Upload Windows bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: speechkit-windows-bundle
          path: dist/windows/SpeechKit
          retention-days: 1

      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: speechkit-windows-installer
          path: dist/windows/SpeechKit-Setup.exe
          retention-days: 1
