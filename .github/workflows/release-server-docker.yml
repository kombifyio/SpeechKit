name: release-server-docker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.40.5)'
        required: true
      production_nonce:
        description: 'Private production transfer nonce'
        required: false
        type: string
      recipient_key:
        description: 'Ephemeral public key for the production capability'
        required: false
        type: string
      expected_image:
        description: 'Expected production image config digest'
        required: false
        type: string
      source_sha:
        description: 'Private source revision'
        required: false
        type: string
      parent_run:
        description: 'Private parent workflow run'
        required: false
        type: string
      force_publish:
        description: 'Publish even when the tag gate would normally skip'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-server-docker-${{ github.ref }}-${{ inputs.production_nonce || 'public' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve Docker Release Plan
    if: github.repository == 'kombifyio/SpeechKit' && (github.event_name != 'workflow_dispatch' || inputs.production_nonce == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      semver: ${{ steps.plan.outputs.semver }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
      should_publish: ${{ steps.plan.outputs.should_publish }}

    steps:
      - name: Resolve tag gate
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            checkout_ref="refs/tags/$tag"
            force_publish="${{ inputs.force_publish }}"
          else
            tag="${GITHUB_REF_NAME}"
            checkout_ref="${GITHUB_REF}"
            force_publish=false
          fi

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::$tag is not a vMAJOR.MINOR.PATCH tag."
            exit 1
          fi

          semver="${tag#v}"
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          should_publish=false
          if [ "$force_publish" = "true" ] || [ "$major" -gt 0 ] || [ "$minor" -ge 26 ]; then
            should_publish=true
          fi

          {
            echo "tag=$tag"
            echo "semver=$semver"
            echo "checkout_ref=$checkout_ref"
            echo "should_publish=$should_publish"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build & Publish speechkit-server
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io
      IMAGE: ${{ github.repository_owner == 'kombifyio' && 'kombifyio/speechkit-server' || 'kombify/speechkit-server' }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build & push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: deploy/docker/Dockerfile.server
          target: speechkit-server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.plan.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=SpeechKit Server
            org.opencontainers.image.description=SpeechKit Framework self-host server.
            org.opencontainers.image.version=${{ needs.plan.outputs.semver }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=speechkit-server
          cache-to: type=gha,mode=max,scope=speechkit-server

      - name: Attest provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record public image digest
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          anonymous_status="$(curl -sS -o /dev/null -w '%{http_code}' "https://ghcr.io/token?scope=repository%3Akombifyio%2Fspeechkit-server%3Apull&service=ghcr.io" || echo 000)"
          anonymous=false
          if [[ "$anonymous_status" == 200 ]]; then anonymous=true; fi
          jq -n --arg tag "$TAG" --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" --argjson anonymous_pull "$anonymous" '{v:1,kind:"speechkit-public-image",tag:$tag,digest:$digest,revision:$revision,anonymous_pull:$anonymous_pull}' > "$RUNNER_TEMP/public-image-receipt.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-image-receipt-${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/public-image-receipt.json
          if-no-files-found: error
          retention-days: 30

  publish-production-transfer:
    name: Authorize and verify exact production image
    if: github.repository == 'kombifyio/SpeechKit' && github.event_name == 'workflow_dispatch' && inputs.production_nonce != '' && github.ref == 'refs/heads/main' && github.actor == 'kombify-release-publisher3[bot]' && github.actor_id == '275293319'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NONCE: ${{ inputs.production_nonce }}
      RECIPIENT_KEY: ${{ inputs.recipient_key }}
      IMAGE_ID: ${{ inputs.expected_image }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PARENT_RUN: ${{ inputs.parent_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check existing image or encrypt this job capability
        id: prepare
        run: node scripts/ci/production-relay.mjs prepare
      - name: Offer encrypted job capability
        if: steps.prepare.outputs.state == 'waiting'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-capability-${{ inputs.production_nonce }}
          path: ${{ runner.temp }}/production-capability.json
          if-no-files-found: error
          retention-days: 1
      - name: Verify both exact registry tags
        if: steps.prepare.outputs.state == 'waiting'
        run: node scripts/ci/production-relay.mjs wait
      - name: Publish verified registry receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-image-receipt-${{ inputs.production_nonce }}
          path: ${{ runner.temp }}/production-image-receipt.json
          if-no-files-found: error
          retention-days: 1
