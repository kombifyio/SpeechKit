name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  public-surface:
    name: Public Surface
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.26.4'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Verify changelog and version
        run: |
          node scripts/release/lint-version-sync.mjs
          node scripts/release/lint-changelog.mjs --unreleased

      - name: Test public Go packages
        run: |
          go test ./pkg/... ./cmd/speechkit-cli/... ./cmd/speechkit-mcp/... ./examples/...
          GOOS=linux CGO_ENABLED=0 go test ./cmd/speechkit-server/...
          GOOS=linux CGO_ENABLED=0 go build ./cmd/speechkit-server ./cmd/speechkit-mcp ./cmd/speechkit-cli

      - name: Verify no private source trees are exported
        shell: bash
        run: |
          set -euo pipefail
          for path in tools testdata frontend installer Website .agents .beads android; do
            if [ -e "$path" ]; then
              echo "::error title=Private tree exported::$path must not be present in the public repository"
              exit 1
            fi
          done
          for path in cmd/speechkit cmd/sk-e2e cmd/sk-localprobe cmd/sk-browser-smoke cmd/speechkit-wakeword cmd/speechkit-openwakeword; do
            if [ -e "$path" ]; then
              echo "::error title=Desktop or release-only command exported::$path is not part of the public framework source surface"
              exit 1
            fi
          done
          for path in internal/desktop internal/frontendassets internal/hotkey internal/output internal/tray internal/winapi internal/testutil internal/voiceeval; do
            if [ -e "$path" ]; then
              echo "::error title=Private implementation package exported::$path is not needed for the public server, SDK, CLI, or MCP tools"
              exit 1
            fi
          done
