name: server-linux

on:
  push:
    branches: [main]
    paths:
      - "cmd/speechkit-server/**"
      - "internal/server/**"
      - "internal/config/**"
      - "deploy/docker/**"
      - "deploy/config/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/server-linux.yml"
  pull_request:
    paths:
      - "cmd/speechkit-server/**"
      - "internal/server/**"
      - "internal/config/**"
      - "deploy/docker/**"
      - "deploy/config/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/server-linux.yml"
  workflow_dispatch: {}

concurrency:
  group: server-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build-and-vet
    timeout-minutes: 15
    # On the private dev repo (KombiverseLabs/kombify-SpeechKit) this
    # falls through to vars.CI_RUNNER, which is wired to a self-hosted
    # Linux runner so push CI doesn't burn private-repo Actions
    # minutes. On the OSS repo (kombifyio/SpeechKit) the variable is
    # unset and we land on ubuntu-latest, which is unmetered for
    # public repos. Either way the Linux toolchain step below works
    # the same.
    runs-on: ${{ github.repository == 'kombifyio/SpeechKit' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    env:
      CGO_ENABLED: "1"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install native toolchain for cgo
        # oto/v3 links against ALSA on Linux (via pkg-config) and the Silero
        # VAD ONNX runtime will be pulled in once M4 lands. ffmpeg is
        # required by the audio-ingress WebM/Opus + OGG/Opus paths (T4) so
        # the corresponding tests run in CI rather than skip. The runtime
        # Dockerfile installs the same set, keeping CI honest about
        # production parity.
        #
        # Retries the apt invocations to survive `/var/lib/dpkg/lock-
        # frontend` contention when this workflow shares a self-hosted
        # runner with ci.yml's Go Analysis job. Same pattern is used
        # there.
        run: |
          set -eu
          tries=0
          until sudo apt-get update; do
            tries=$((tries + 1))
            if [ "$tries" -ge 12 ]; then
              echo "apt-get update kept failing after $tries tries; giving up" >&2
              exit 1
            fi
            echo "apt locked, retry $tries in 5s…"
            sleep 5
          done
          tries=0
          until sudo apt-get install -y --no-install-recommends \
              gcc libc6-dev libasound2-dev pkg-config ffmpeg; do
            tries=$((tries + 1))
            if [ "$tries" -ge 12 ]; then
              echo "apt-get install kept failing after $tries tries; giving up" >&2
              exit 1
            fi
            echo "apt locked, retry $tries in 5s…"
            sleep 5
          done

      - name: go mod verify
        run: go mod verify

      - name: go vet (SpeechKit Server packages)
        run: |
          go vet ./cmd/speechkit-server/...
          go vet ./internal/server/...
          go vet ./internal/config/...

      - name: go build (server)
        run: |
          go build -o /tmp/speechkit-server ./cmd/speechkit-server
          /tmp/speechkit-server --version

      - name: go test (SpeechKit Server)
        run: |
          go test -race ./internal/server/...

  docker:
    name: docker-build-and-smoke
    # Same runner-selection rationale as the build job above.
    runs-on: ${{ github.repository == 'kombifyio/SpeechKit' && 'ubuntu-latest' || 'blacksmith-4vcpu-ubuntu-2204' }}
    needs: build
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build speechkit-server image
        run: |
          DOCKER_BUILDKIT=0 docker build \
            --file deploy/docker/Dockerfile.server \
            --target speechkit-server \
            --build-arg "VERSION=${{ github.sha }}" \
            --tag speechkit-server:ci \
            .

      - name: Smoke test speechkit-server image
        run: docker run --rm speechkit-server:ci --version

      - name: Compose smoke test
        env:
          SPEECHKIT_SERVER_IMAGE: speechkit-server:ci
        run: |
          docker compose -f deploy/docker/docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from test-client

      - name: Tear down compose smoke stack
        if: always()
        run: docker compose -f deploy/docker/docker-compose.test.yml down -v
