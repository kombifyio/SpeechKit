# Browser-facing SpeechKit Server reference stack.
#
# Usage:
#   export SPEECHKIT_SERVER_TOKEN="$(openssl rand -hex 32)"
#   export SPEECHKIT_PUBLIC_URL="http://localhost:8080"
#   export GOOGLE_AI_API_KEY="..." # required for Gemini Live Voice Agent
#   docker compose -f docker-compose.example.yml up -d
#
services:
  speechkit-server:
    image: ghcr.io/kombifyio/speechkit-server:latest
    environment:
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:?set SPEECHKIT_SERVER_TOKEN}
      SPEECHKIT_PUBLIC_URL: ${SPEECHKIT_PUBLIC_URL:-http://localhost:8080}
      HF_TOKEN: ${HF_TOKEN:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./config.browser.example.toml:/etc/speechkit/config.toml:ro
      - speechkit-data:/var/lib/speechkit/data
      - speechkit-models:/var/lib/speechkit/models
    ports:
      - "127.0.0.1:${SPEECHKIT_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  speechkit-data:
  speechkit-models:
