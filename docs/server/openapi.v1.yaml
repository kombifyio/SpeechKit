# ── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Static deployment-wide token from `$SPEECHKIT_SERVER_TOKEN`. The
        identity attached to the request context is `service@default/internal`.
        Suitable for internal service-to-service callers, product backends, or
        automation services on a private network.
    edgeHmac:
      type: apiKey
      in: header
      name: X-Edge-Auth-Hmac
      description: |
        HMAC-SHA256 of `userID + "\n" + orgID + "\n" + plan + "\n" + role` using
        `$EDGE_AUTH_SECRET`. Must be sent alongside `X-Edge-User-Id`,
        `X-Edge-Org-Id`, `X-Edge-Plan`, and optional `X-Edge-Role`. Used
        when fronted by a Cloudflare Worker / reverse proxy that has
        already validated a user JWT.

        Optional replay protection: when the edge also sends `X-Edge-Auth-Ts`
        (Unix seconds), the timestamp is appended to the signed string as a
        fifth field (`... + "\n" + ts`) and the server rejects requests whose
        timestamp is more than 5 minutes from server time. The header is
        optional and backward compatible — an edge that omits it uses the
        legacy four-field signature.

  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PersonaID:
      name: id
      in: path
      required: true
      schema: { type: string }
    RoleID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SequenceID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Readiness:
      description: Component health snapshot.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [ok, starting, degraded, unavailable]
              strict_status:
                type: string
                enum: [ok, starting, degraded, unavailable]
              components:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [ok, starting, degraded, unavailable]
                    detail: { type: string }
                    updated_at: { type: string, format: date-time }
                    blocking: { type: boolean }
                    kind: { type: string }
                    modes:
                      type: array
                      items: { type: string }
                    provider: { type: string }
              uptime_seconds: { type: integer }
              version: { type: string }
    BadRequest:
      description: The request body could not be decoded or failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: HTTP method is not allowed on this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminRequired:
      description: Caller's identity does not have role=admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeds the configured maximum upload size.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type is not one this endpoint accepts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded. Honour the `Retry-After` header.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderUnavailable:
      description: |
        No upstream provider was able to satisfy the request. Typical for
        STT/Genkit/TTS outages, or when the deployment has no provider
        keys configured for the requested mode.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PersistFailed:
      description: |
        The durable storage layer rejected the write. The in-memory state
        is unchanged so the next read returns the previous value.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            remediation:
              type: string
              description: >-
                Short machine-friendly hint on how to unblock the denied
                capability (additive, optional).
            request_id:
              type: string
              description: >-
                Gateway/server correlation id for support and tracing
                (additive, optional).

    EnvStatus:
      type: object
      required: [env, configured]
      properties:
        env:
          type: string
          description: Environment variable name read by this process.
        configured:
          type: boolean
          description: True when the named environment variable has a non-empty value.

    DeploymentStatus:
      type: object
      required: [version, status, uptime_seconds, headless, auth, providers, store, modes]
      properties:
        version: { type: string }
        status:
          type: string
          enum: [ok, starting, degraded, unavailable]
        uptime_seconds: { type: integer }
        components:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        headless:
          type: object
          required: [settings_path, settings_write, onboarding_ui]
          properties:
            settings_path: { type: string }
            settings_write:
              type: boolean
              description: Whether settings writes are enabled for this process.
            onboarding_ui:
              type: boolean
              description: Whether the setup/onboarding UI is enabled.
        auth:
          type: object
          required:
            - mode
            - bearer_token_env
            - bearer_token_set
            - edge_auth_secret_env
            - edge_auth_secret_set
          properties:
            mode:
              type: string
              enum: [none, bearer, edge_hmac, bearer_or_edge]
            bearer_token_env: { type: string }
            bearer_token_set:
              type: boolean
              description: True when the active bearer token env has a non-empty value.
            bearer_role: { type: string }
            edge_auth_secret_env: { type: string }
            edge_auth_secret_set:
              type: boolean
              description: True when the active edge-HMAC secret env has a non-empty value.
            admin_username: { type: string }
            admin_password_set:
              type: boolean
              description: True when an admin password hash is configured.
        providers:
          type: object
          properties:
            google:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
                stt_key: { $ref: '#/components/schemas/EnvStatus' }
            openai:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
            groq:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
            huggingface:
              type: object
              properties:
                token: { $ref: '#/components/schemas/EnvStatus' }
            openrouter:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
        store:
          type: object
          properties:
            backend: { type: string }
        modes:
          type: array
          items: { type: string }

    ProviderProfile:
      type: object
      properties:
        id: { type: string }
        mode: { type: string }
        name: { type: string }
        providerKind: { type: string }
        executionMode: { type: string }
        provider: { type: string }
        modelId: { type: string }
        lifecycle: { type: string }
        source: { type: string }
        description: { type: string }
        license: { type: string }
        capabilities:
          type: array
          items: { type: string }
        adapterKind: { type: string }
        inferenceAllowed: { type: boolean }
        default: { type: boolean }
        recommended: { type: boolean }
        experimental: { type: boolean }

    ProviderDefault:
      type: object
      properties:
        provider: { type: string }
        displayName: { type: string }
        mode: { type: string }
        profileId: { type: string }
        modelId: { type: string }
        providerKind: { type: string }
        executionMode: { type: string }
        support:
          type: string
          enum: [unsupported, planned, cascaded, routed, native]
        capabilities:
          type: array
          items: { type: string }
        nativeOptions:
          type: array
          items: { type: string }
        authRequirement: { type: string }
        credentialRequired: { type: boolean }
        credentialTarget: { type: string }
        transport: { type: string }
        evidenceUrl: { type: string }
        default: { type: boolean }
        recommended: { type: boolean }
        experimental: { type: boolean }
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              modelId: { type: string }
              description: { type: string }
              recommended: { type: boolean }

    ProviderFeatureSupport:
      type: object
      properties:
        feature:
          type: string
          enum:
            - dictation
            - dictation_streaming
            - long_transcription
            - speaker_diarization
            - speaker_identification
            - assist
            - realtime_voice
            - tts
        support:
          type: string
          enum: [unsupported, planned, cascaded, routed, native]
        mode: { type: string }
        profileId: { type: string }
        modelId: { type: string }
        nativeOptions:
          type: array
          items: { type: string }
        evidenceUrl: { type: string }

    ProviderMatrixRow:
      type: object
      properties:
        provider: { type: string }
        displayName: { type: string }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ProviderDefault' }
        features:
          type: array
          items: { $ref: '#/components/schemas/ProviderFeatureSupport' }

    ServerSettingsSnapshot:
      type: object
      properties:
        version: { type: string }
        status: { type: string }
        onboarding:
          type: object
          properties:
            enabled: { type: boolean }
            complete: { type: boolean }
            required: { type: boolean }
            current_deploy_version: { type: string }
            completed_version: { type: string }
        auth:
          type: object
          properties:
            mode: { type: string }
            bearer_token_env: { type: string }
            bearer_token_set: { type: boolean }
            admin_auth_enabled: { type: boolean }
            admin_username: { type: string }
            admin_password_set: { type: boolean }
        editable:
          type: object
          properties:
            desired: { $ref: '#/components/schemas/ServerSettingsPatch' }

    ServerSettingsPatch:
      type: object
      properties:
        onboarding_complete: { type: boolean }
        server_auth:
          type: object
          properties:
            mode:
              type: string
              enum: [managed_bearer, self_managed]
            bearer_token_env: { type: string }
            generate_token: { type: boolean }
        admin_auth:
          type: object
          properties:
            enabled:
              type: boolean
              description: Enables standalone `/setup` username/password login.
            username: { type: string }
            password:
              type: string
              format: password
              description: Write-only. Stored as a bcrypt hash.
            password_hash:
              type: string
              description: Optional precomputed bcrypt hash for automation.

    ServerSettingsSaveResponse:
      type: object
      properties:
        status:
          type: string
          enum: [saved]
        restart_required: { type: boolean }
        desired: { $ref: '#/components/schemas/ServerSettingsPatch' }
        generated_token:
          type: object
          properties:
            token:
              type: string
              description: One-time server bearer token. Store it in the configured environment.
            env: { type: string }
            auth_mode: { type: string }
            header_name: { type: string }
        experimental: { type: boolean }

    ModeContract:
      type: object
      properties:
        mode: { type: string }
        intelligence: { type: string }
        input: { type: string }
        output: { type: string }
        allowed:
          type: array
          items: { type: string }
        forbidden:
          type: array
          items: { type: string }

    ProviderReadiness:
      type: object
      description: |
        Server-side readiness for a catalog profile. `active` means selected
        by server configuration; `default` is static catalog metadata.
        `ready` is independent of `active` and only reflects whether the
        profile could run if selected.
      properties:
        schemaVersion: { type: string }
        profileId: { type: string }
        mode: { type: string }
        providerKind: { type: string }
        executionMode: { type: string }
        modelId: { type: string }
        source: { type: string }
        active: { type: boolean }
        default: { type: boolean }
        configured: { type: boolean }
        credentialsReady: { type: boolean }
        runtimeReady: { type: boolean }
        capabilityReady: { type: boolean }
        ready: { type: boolean }
        missing:
          type: array
          items:
            type: string
            enum: [mode_disabled, provider_disabled, credentials, runtime]

    ConfigSummary:
      type: object
      properties:
        version: { type: string }
        public_url: { type: string }
        modes:
          type: array
          items: { type: string }
        auth_mode: { type: string }
        bearer_role: { type: string }
        max_upload_mb: { type: integer }
        read_header_timeout_sec: { type: integer }
        read_timeout_sec: { type: integer }
        idle_timeout_sec: { type: integer }
        max_header_bytes: { type: integer }
        max_decoded_audio_seconds: { type: integer }
        features:
          type: object
          additionalProperties: { type: boolean }
        ready_status: { type: string }

    DictionaryEntry:
      type: object
      properties:
        id: { type: integer }
        spoken: { type: string }
        canonical: { type: string }
        language: { type: string }
        source: { type: string }
        enabled: { type: boolean }
        usageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomizationMatch:
      type: object
      properties:
        type: { type: string, enum: [literal, phrase, regex, spoken_alias] }
        pattern: { type: string }
        case_sensitive: { type: boolean }
        word_boundary: { type: boolean }

    CustomizationOutput:
      type: object
      properties:
        text: { type: string }
        intent: { type: string }
        template: { type: string }
        payload:
          type: object
          additionalProperties: true

    Word:
      type: object
      properties:
        id: { type: string }
        term: { type: string }
        sounds_like:
          type: array
          items: { type: string }
        language: { type: string }
        weight: { type: number }
        tags:
          type: array
          items: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        enabled: { type: boolean }
        usage_count: { type: integer }

    CustomizationScopeRef:
      type: object
      description: Optional customization applicability scope. Explicit user, org, workspace, and session scopes require key.
      properties:
        kind: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        key: { type: string }

    Replacement:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [substitution, synonym, snippet, command, template] }
        match: { $ref: '#/components/schemas/CustomizationMatch' }
        output: { $ref: '#/components/schemas/CustomizationOutput' }
        language: { type: string }
        modes:
          type: array
          items: { type: string, enum: [dictation, assist, voice_agent] }
        stage: { type: string, enum: [pre_recognition_cleanup, post_stt, post_llm, output] }
        priority: { type: integer }
        tags:
          type: array
          items: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        enabled: { type: boolean }
        usage_count: { type: integer }

    Lexicon:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        language: { type: string }
        word_ids:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        enabled: { type: boolean }

    Ruleset:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        language: { type: string }
        replacement_ids:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        enabled: { type: boolean }

    WordsResponse:
      type: object
      properties:
        words:
          type: array
          items: { $ref: '#/components/schemas/Word' }

    WordsReplaceRequest:
      type: object
      properties:
        language: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        words:
          type: array
          items: { $ref: '#/components/schemas/Word' }

    VocabularyResponse:
      type: object
      properties:
        words:
          type: array
          items: { $ref: '#/components/schemas/Word' }
        replacements:
          type: array
          items: { $ref: '#/components/schemas/Replacement' }

    VocabularyReplaceRequest:
      type: object
      properties:
        language: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        words:
          type: array
          items: { $ref: '#/components/schemas/Word' }
        replacements:
          type: array
          items: { $ref: '#/components/schemas/Replacement' }

    ReplacementsResponse:
      type: object
      properties:
        replacements:
          type: array
          items: { $ref: '#/components/schemas/Replacement' }

    ReplacementsReplaceRequest:
      type: object
      properties:
        language: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        replacements:
          type: array
          items: { $ref: '#/components/schemas/Replacement' }

    LexiconsResponse:
      type: object
      properties:
        lexicons:
          type: array
          items: { $ref: '#/components/schemas/Lexicon' }

    LexiconsReplaceRequest:
      type: object
      properties:
        language: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        lexicons:
          type: array
          items: { $ref: '#/components/schemas/Lexicon' }

    RulesetsResponse:
      type: object
      properties:
        rulesets:
          type: array
          items: { $ref: '#/components/schemas/Ruleset' }

    RulesetsReplaceRequest:
      type: object
      properties:
        language: { type: string }
        scope: { $ref: '#/components/schemas/CustomizationScopeRef' }
        source: { type: string }
        rulesets:
          type: array
          items: { $ref: '#/components/schemas/Ruleset' }

    CustomizationTemplate:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        source: { type: string }
        languages:
          type: array
          items: { type: string }
        modes:
          type: array
          items: { type: string, enum: [dictation, assist, voice_agent] }
        builtIn: { type: boolean }
        defaultActive: { type: boolean }
        wordCount: { type: integer }
        replacementCount: { type: integer }

    CustomizationTemplatesResponse:
      type: object
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/CustomizationTemplate' }
        activeTemplateIds:
          type: array
          items: { type: string }

    CustomizationPack:
      type: object
      properties:
        schema_version: { type: string, enum: [speechkit.customization.pack.v1] }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        words:
          type: array
          items: { $ref: '#/components/schemas/Word' }
        replacements:
          type: array
          items: { $ref: '#/components/schemas/Replacement' }
        lexicons:
          type: array
          items: { $ref: '#/components/schemas/Lexicon' }
        rulesets:
          type: array
          items: { $ref: '#/components/schemas/Ruleset' }

    Transcript:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        language: { type: string }
        provider: { type: string }
        model: { type: string }
        durationMs: { type: integer }
        latencyMs: { type: integer }
        audioPath: { type: string }
        audio: { $ref: '#/components/schemas/AudioAsset' }
        createdAt: { type: string, format: date-time }
        ownerUserId: { type: string }
        ownerOrgId: { type: string }
        ownerSource: { type: string }

    AudioAsset:
      type: object
      properties:
        storageKind: { type: string, enum: [local-file] }
        path: { type: string }
        mimeType:
          type: string
          description: MIME type preserved from the source upload when available.
        sizeBytes: { type: integer }
        durationMs: { type: integer }

    VoiceAgentTranscript:
      type: object
      properties:
        id: { type: integer }
        transcript: { type: string }
        turns:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              text: { type: string }
              createdAt: { type: string, format: date-time }
        language: { type: string }
        created_at: { type: string, format: date-time }

    VoiceAgentSummaryResponse:
      type: object
      properties:
        id: { type: integer }
        summary:
          type: object
          additionalProperties: true
        language: { type: string }
        created_at: { type: string, format: date-time }

    TTSSynthesizeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        locale: { type: string }
        voice: { type: string }
        speed: { type: number }
        format: { type: string, enum: [mp3, wav, opus, pcm] }

    TTSSynthesizeResponse:
      type: object
      properties:
        audio_base64: { type: string }
        format: { type: string }
        sample_rate: { type: integer }
        duration_ms: { type: integer }
        provider: { type: string }
        voice: { type: string }

    Voice:
      type: object
      description: Configured TTS voice entry. This is a server configuration snapshot, not live provider voice discovery.
      properties:
        provider: { type: string }
        id: { type: string }
        locale: { type: string }
        default: { type: boolean }
        discovery: { type: string, enum: [configured] }

    DictateJSONRequest:
      type: object
      required: [audio_base64]
      properties:
        audio_base64: { type: string }
        format:
          type: string
          enum: [wav, mp3, pcm16]
        language: { type: string }
        model: { type: string }
        prompt: { type: string }
        provider_profile_id:
          type: string
          description: |
            Optional explicit STT provider-profile pin for this request
            (ops parity with the streaming `start` frame), e.g.
            `stt.deepgram.nova-3` or `stt.assemblyai.universal`. Must name a
            profile from `GET /v1/catalog/profiles?mode=dictation`; unknown
            values are rejected with 400 `invalid_provider_profile`. When
            omitted, the server resolves the provider from the edge-injected
            user preference headers and its configured model selection.
        conversation_context:
          type: array
          items: { type: string }
          description: |
            Preceding dialogue turns (oldest first, no speaker labels) for
            providers whose speech models condition on conversational
            context — e.g. AssemblyAI Universal-3.5 Pro sync accepts up to
            100 turns / 4096 characters. Providers without native support
            ignore it.
        speaker:
          $ref: '#/components/schemas/SpeakerOptions'
        speaker_options:
          $ref: '#/components/schemas/SpeakerOptions'

    DictateResponse:
      type: object
      required: [text, duration_ms, latency_ms]
      properties:
        text: { type: string, minLength: 1 }
        language: { type: string }
        duration_ms: { type: integer }
        latency_ms: { type: integer }
        provider: { type: string }
        model: { type: string }
        confidence:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceMeta'
        speakers:
          $ref: '#/components/schemas/DiarizationResult'
        customization_actions:
          type: array
          items:
            $ref: '#/components/schemas/CustomizationAction'

    CustomizationAction:
      type: object
      description: Structured action emitted by Words and Replacements command rules. Known desktop clients may execute supported intents; unknown intents are metadata only.
      properties:
        replacement_id: { type: string }
        kind: { type: string }
        intent: { type: string }
        text: { type: string }
        template: { type: string }
        payload:
          type: object
          additionalProperties: true
        matched_text: { type: string }
        count: { type: integer }

    AssistJSONRequest:
      type: object
      properties:
        text: { type: string }
        audio_base64: { type: string }
        format:
          type: string
          enum: [wav, mp3, pcm16]
        locale: { type: string }
        selection: { type: string }
        context: { type: string }
        app:
          type: string
          description: Foreground application name on the client (e.g. "chrome"). Folded into the Assist LLM context.
        window_title:
          type: string
          description: Foreground window title on the client. Folded into the Assist LLM context. May be sensitive — send only what you intend to share.
        tts: { type: boolean }
        tts_format:
          type: string
          enum: [mp3, wav, opus]
        tts_voice: { type: string }
        tts_speed:
          type: number
          format: double
        speaker:
          $ref: '#/components/schemas/SpeakerOptions'
        speaker_options:
          $ref: '#/components/schemas/SpeakerOptions'

    AssistResponse:
      type: object
      required: [text, action, latency_ms]
      properties:
        text: { type: string, minLength: 1 }
        speak_text: { type: string }
        action:
          type: string
          enum: [respond, execute, silent, shortcut]
        locale: { type: string }
        shortcut: { type: string }
        surface: { type: string }
        kind: { type: string }
        message_id:
          type: string
          description: Stable semantic ID for localized SpeechKit-owned result prose. Omitted for provider- or user-authored text.
          enum:
            - companion.home_assistant.not_configured
            - companion.home_assistant.command.empty
            - companion.home_assistant.command.not_matched
            - companion.home_assistant.command.rejected
            - companion.home_assistant.unavailable
        reason_code:
          type: string
          description: Stable language-neutral reason for the localized result.
          enum:
            - not_configured
            - empty_command
            - unavailable
            - request_encode_failed
            - request_build_failed
            - unreachable
            - authentication_failed
            - unexpected_status
            - invalid_response
            - empty_response
            - not_matched
            - rejected
        transcript: { type: string }
        audio_base64: { type: string }
        audio_format: { type: string }
        latency_ms: { type: integer }
        source:
          $ref: '#/components/schemas/SourceMeta'
        speakers:
          $ref: '#/components/schemas/DiarizationResult'
        customization_actions:
          type: array
          items:
            $ref: '#/components/schemas/CustomizationAction'

    SpeakerOptions:
      type: object
      description: Optional speaker diarization/identification request. Omit it for text-only transcription.
      properties:
        enabled: { type: boolean }
        diarization: { type: boolean }
        identification: { type: boolean }
        attribution: { type: boolean }
        providerProfileId: { type: string }
        model: { type: string }
        diarizationModel: { type: string }
        language: { type: string }
        speakersExpected: { type: integer }
        minSpeakersExpected: { type: integer }
        maxSpeakersExpected: { type: integer }
        speakerType:
          type: string
          enum: [name, role]
        knownValues:
          type: array
          items: { type: string }
        knownSpeakers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              displayName: { type: string }
              role: { type: string }
              description: { type: string }
        preferStreaming:
          type: boolean
          description: >-
            Reserved. Real-time streaming diarization is not implemented yet; all
            providers run batch today, so this flag has no effect.
        allowProviderMapping: { type: boolean }

    DiarizationResult:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        level:
          type: string
          description: >-
            Speaker resolution depth actually produced. `biometric` is reserved
            for future voiceprint enrollment and is not produced by any provider
            today; current providers reach at most `provider_identification`.
          enum: [none, diarization, attribution, provider_identification, biometric]
        text: { type: string }
        language: { type: string }
        speakers:
          type: array
          items:
            $ref: '#/components/schemas/Speaker'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerSegment'
        words:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerWord'

    SpeakerFrame:
      type: object
      description: Realtime speaker attribution frame emitted by Voice Agent streaming speaker add-ons.
      properties:
        provider: { type: string }
        model: { type: string }
        sequence: { type: integer }
        text: { type: string }
        isFinal: { type: boolean }
        segment:
          $ref: '#/components/schemas/SpeakerSegment'
        words:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerWord'
        speakers:
          type: array
          items:
            $ref: '#/components/schemas/Speaker'
        latencyMs: { type: integer }

    Speaker:
      type: object
      properties:
        label: { type: string }
        personId: { type: string }
        displayName: { type: string }
        role: { type: string }
        confidence: { type: number }
        attributionConfidence: { type: number }

    SpeakerSegment:
      type: object
      properties:
        text: { type: string }
        startMs: { type: integer }
        endMs: { type: integer }
        speakerLabel: { type: string }
        speakerConfidence: { type: number }
        personId: { type: string }
        displayName: { type: string }
        role: { type: string }
        attributionConfidence: { type: number }
        words:
          type: array
          items:
            $ref: '#/components/schemas/SpeakerWord'

    SpeakerWord:
      type: object
      properties:
        text: { type: string }
        startMs: { type: integer }
        endMs: { type: integer }
        confidence: { type: number }
        speakerLabel: { type: string }
        speakerConfidence: { type: number }
        personId: { type: string }
        displayName: { type: string }
        role: { type: string }
        attributionConfidence: { type: number }

    AssistSelfTestResponse:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        text: { type: string }
        action: { type: string }
        locale: { type: string }
        latency_ms: { type: integer }
        details:
          type: object
          additionalProperties: true

    CreateSessionResponse:
      type: object
      required: [session_id, ws_url, ws_subprotocol, ticket, expires_at]
      properties:
        session_id: { type: string }
        ws_url:
          type: string
          format: uri
          description: |
            Browser-reachable WebSocket URL without a ticket query. Open the
            WebSocket with `Sec-WebSocket-Protocol: <ws_subprotocol>`. Browser
            clients do not send bearer tokens in the WebSocket handshake.
            Tickets are HMAC-bound to the session id, single-use, and expire
            after the configured TTL (default 90 s). Expired tickets are not
            refreshed in v1; create a new session. Set SPEECHKIT_PUBLIC_URL
            for browser-facing Docker/proxy deployments so `ws_url` uses the
            public origin.
        ws_subprotocol:
          type: string
          description: WebSocket subprotocol value to pass during upgrade, e.g. `ticket.<value>`.
        ticket:
          type: string
          description: One-time WebSocket upgrade ticket. Prefer `ws_subprotocol` rather than putting this value in URLs.
        expires_at:
          type: string
          format: date-time
          description: Ticket expiry timestamp.
        livekit:
          $ref: '#/components/schemas/LiveKitJoinInfo'

    CreateDictationStreamSessionResponse:
      type: object
      required: [session_id, ws_url, ws_subprotocol, ticket, expires_at, capabilities]
      properties:
        session_id: { type: string }
        ws_url:
          type: string
          format: uri
          description: |
            WebSocket URL for the streaming Dictation upgrade. Open it with
            `Sec-WebSocket-Protocol: <ws_subprotocol>`; tickets are
            HMAC-bound to the session id, single-use, and expire after the
            configured TTL (default 90 s).
        ws_subprotocol:
          type: string
          description: WebSocket subprotocol value to pass during upgrade, e.g. `ticket.<value>`.
        ticket:
          type: string
          description: One-time WebSocket upgrade ticket. Prefer `ws_subprotocol` rather than putting this value in URLs.
        expires_at:
          type: string
          format: date-time
          description: Ticket expiry timestamp.
        capabilities:
          $ref: '#/components/schemas/DictationStreamCapabilities'

    DictationStreamCapabilities:
      type: object
      required: [streaming, emulation]
      properties:
        streaming:
          type: boolean
          description: |
            True when a streaming-capable STT provider is configured. False
            means a `start` frame would fail with `streaming_unavailable`;
            fall back to `POST /v1/dictation/transcribe`.
        emulation:
          type: string
          enum: [off]
          description: Reserved for a future chunked-batch emulation mode; always `off` in v1.

    LiveKitJoinInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: LiveKit WebSocket URL, e.g. `wss://livekit.example.com`.
        room:
          type: string
          description: SpeechKit-managed LiveKit room name.
        token:
          type: string
          description: Short-lived LiveKit JWT scoped to this room and participant.
        token_expires_at:
          type: string
          format: date-time
        participant_identity:
          type: string

    ListedSession:
      type: object
      properties:
        session_id: { type: string }
        state:
          type: string
          enum: [pending_ws, active, closed]
        created_at:
          type: string
          format: date-time
        has_ws_client: { type: boolean }

    VoiceAgentSessionMetrics:
      type: object
      description: Current Voice Agent session occupancy and configured capacity.
      properties:
        total_sessions: { type: integer }
        active_sessions: { type: integer }
        pending_sessions: { type: integer }
        identity_sessions: { type: integer }
        max_global_sessions: { type: integer }
        max_per_identity_sessions: { type: integer }

    SourceMeta:
      type: object
      properties:
        format: { type: string }
        sample_rate: { type: integer }
        channels: { type: integer }
        duration_ms: { type: integer }

    Persona:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        voice: { type: string }
        locale: { type: string }
        default_role: { type: string }
        default_sequence:
          type: string
          description: Optional sequence started when the persona is selected without an explicit sequence_id.
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source:
          type: string
          enum: [toml, store]

    Role:
      type: object
      required: [id, display_name, system_prompt]
      properties:
        id: { type: string }
        display_name: { type: string }
        system_prompt: { type: string }
        refinement_prompt: { type: string }
        locale: { type: string }
        vocabulary_hint: { type: string }
        tool_allowlist:
          type: array
          items: { type: string }
        temperature:
          type: number
          format: double
        thinking_enabled: { type: boolean }
        thinking_level:
          type: string
          enum: [off, low, medium, high]
        include_thoughts: { type: boolean }
        thinking_budget: { type: integer }
        automatic_activity_detection: { type: boolean }
        vad_start_sensitivity:
          type: string
          enum: [low, medium, high]
        vad_end_sensitivity:
          type: string
          enum: [low, medium, high]
        vad_prefix_padding_ms: { type: integer }
        vad_silence_duration_ms: { type: integer }
        activity_handling: { type: string }
        turn_coverage: { type: string }
        context_compression_enabled: { type: boolean }
        context_compression_trigger_tokens: { type: integer }
        context_compression_target_tokens: { type: integer }
        enable_affective_dialog: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source:
          type: string
          enum: [toml, store]

    Sequence:
      type: object
      required: [id, display_name, steps]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        completion:
          type: string
          enum: [all_steps, explicit_close, max_turns]
        max_turns: { type: integer }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SequenceStep' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source:
          type: string
          enum: [toml, store]

    SequenceStep:
      type: object
      required: [id, instruction]
      properties:
        id: { type: string }
        instruction: { type: string }
        exit_criteria: { type: string }
        require_tools:
          type: array
          items: { type: string }
        max_turns: { type: integer }

# ── WebSocket protocol (informational) ───────────────────────────────────
# OpenAPI 3.1 has no first-class WebSocket primitive; the path under
# /v1/voiceagent/sessions/{id}/ws is documented via tags + the
# CreateSessionResponse.ws_url field above. The full protocol is described
# in docs/server/README.md and the wire types in
# internal/server/voiceagent/protocol.go.
