openapi: 3.1.0
info:
  title: SpeechKit Server API
  version: 1.0.0
  description: |
    Stable v1 HTTP and WebSocket contract for the SpeechKit Server.
    The canonical server API prefix is `/v1/`; `/api/v1/` remains
    available as a compatibility alias. These endpoints are covered by the same
    backwards-compatibility guarantees as the Framework's public
    `pkg/speechkit` packages — fields are additive across minor releases; no
    rename or removal without a version bump.

    Ships with the container image
    `ghcr.io/kombifyio/speechkit-server:v0.26.0` and later. Earlier images
    expose the same surface but were Server-internal pre-v0.26.

  contact:
    url: https://github.com/kombifyio/SpeechKit
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.speechkit.dev
    description: Replace with your deployment's URL.

# ── Auth ────────────────────────────────────────────────────────────────────
# Default server deployments require bearer auth. `auth_mode = "none"` is only
# intended for loopback/dev deployments and must not be used on public binds.
security:
  - {}
  - bearer: []
  - edgeHmac: []

paths:

  # ── Health ──────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: |
        Always returns 200 while the process is up. Public — no auth required.
      tags: [health]
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  version:
                    type: string
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Mode readiness for orchestrators. Returns 200 when every blocking
        component required by the enabled modes reports OK. Optional provider
        probes stay visible in `components` with `blocking=false` and can make
        `strict_status` degraded without failing this endpoint. Pass
        `?strict=true` or call `/readyz/strict` to require every component to
        report OK. Public — no auth required.
      tags: [health]
      security: []
      parameters:
        - name: strict
          in: query
          required: false
          schema: { type: boolean }
          description: When true, use strict all-components readiness semantics.
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Readiness' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /readyz/strict:
    get:
      operationId: getStrictReadyz
      summary: Strict readiness probe
      description: |
        Diagnostic readiness that returns 200 only when every registered
        component reports OK, including optional provider probes. Public — no
        auth required.
      tags: [health]
      security: []
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Readiness' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /v1/deployment/status:
    get:
      operationId: getDeploymentStatus
      summary: Read headless deployment status
      description: |
        Authenticated, redacted runtime contract for deployers and CI smoke
        tests. The endpoint accepts the service bearer credential, local admin
        auth, or an edge-HMAC identity with role `admin`; normal edge user
        identities are rejected. The response reports which environment
        variable names are active and whether their values are present; it never
        returns secret values. Use it after container startup to confirm that
        Compose, Kubernetes, or Render injected the intended bearer, edge-auth,
        and provider credentials.
      tags: [deployment]
      security:
        - bearer: []
        - edgeHmac: []
      responses:
        '200':
          description: Redacted deployment status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Authenticated identity may not read deployment status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    head:
      operationId: headDeploymentStatus
      summary: Probe authenticated deployment status
      description: |
        Authenticated no-body variant of `GET /v1/deployment/status`.
      tags: [deployment]
      security:
        - bearer: []
        - edgeHmac: []
      responses:
        '200':
          description: Deployment status endpoint is reachable with credentials.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  # ── API-first Control Plane ────────────────────────────────────────────
  /v1/server/settings:
    get:
      operationId: getServerSettings
      summary: Read setup and runtime settings snapshot
      description: |
        Public during first-run onboarding with a sanitized bootstrap snapshot.
        Authenticated callers receive the full non-secret runtime snapshot.
      tags: [setup]
      responses:
        '200':
          description: Server setup snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerSettingsSnapshot' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      operationId: patchServerSettings
      summary: Save first-run or admin setup settings
      description: |
        During first-run onboarding, this endpoint accepts one anonymous setup
        write so automated installers can configure server auth and optional
        admin login. After onboarding is complete, settings changes require an
        admin identity through bearer/edge auth or an enabled admin session.
      tags: [setup]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerSettingsPatch' }
      responses:
        '200':
          description: Settings saved. One-time generated secrets are returned only in this response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerSettingsSaveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/server/admin/session:
    post:
      operationId: createServerAdminSession
      summary: Create browser admin session
      description: |
        Validates the standalone setup username/password when admin auth is
        enabled and returns an HttpOnly signed session cookie. This endpoint is
        unavailable when `admin_auth.enabled` is false.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Admin session cookie set.
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/BadRequest' }

  /v1/catalog/profiles:
    get:
      operationId: listCatalogProfiles
      summary: List provider profiles
      tags: [catalog]
      parameters:
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [dictation, assist, voiceagent, voice_agent] }
      responses:
        '200':
          description: Provider catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/catalog/providers:
    get:
      operationId: listCatalogProviders
      summary: List normalized provider matrix
      tags: [catalog]
      responses:
        '200':
          description: Provider-agnostic defaults and feature matrix.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider_matrix:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderMatrixRow' }
                  provider_defaults:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderDefault' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/catalog/provider-options:
    get:
      operationId: listCatalogProviderOptions
      summary: List per-provider option manifests
      description: >
        Returns the SpeechKit provider-option manifests (native/derived/unsupported
        options, including multilanguage) so clients can render provider truth
        instead of a hardcoded language list.
      tags: [catalog]
      responses:
        '200':
          description: Provider option manifests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                  updated:
                    type: string
                  manifests:
                    type: array
                    items:
                      type: object
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/catalog/contracts:
    get:
      operationId: listCatalogContracts
      summary: List strict mode contracts
      tags: [catalog]
      responses:
        '200':
          description: Mode contracts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items: { $ref: '#/components/schemas/ModeContract' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/catalog/readiness:
    get:
      operationId: listCatalogReadiness
      summary: List provider readiness snapshots
      tags: [catalog]
      responses:
        '200':
          description: Readiness for every provider profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  readiness:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderReadiness' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/catalog/profiles/{id}/readiness:
    get:
      operationId: getCatalogProfileReadiness
      summary: Get provider readiness
      tags: [catalog]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Provider readiness.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderReadiness' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/BadRequest' }

  /v1/config:
    get:
      operationId: getServerConfig
      summary: Read server configuration summary
      tags: [config]
      responses:
        '200':
          description: Read-only configuration summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/vocabulary/dictionary:
    get:
      operationId: listVocabularyDictionaryEntries
      summary: List old dictionary-shaped migration entries
      tags: [vocabulary]
      parameters:
        - name: language
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Migration projection entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/DictionaryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
    post:
      operationId: replaceVocabularyDictionaryEntries
      summary: Replace old dictionary-shaped migration entries
      description: Requires an admin identity.
      tags: [vocabulary]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string }
                entries:
                  type: array
                  items: { $ref: '#/components/schemas/DictionaryEntry' }
      responses:
        '200':
          description: Replaced entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/DictionaryEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/words:
    get:
      operationId: listWords
      summary: List Words used for recognition bias
      tags: [vocabulary]
      parameters:
        - name: language
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Words.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordsResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: replaceWords
      summary: Replace settings-sourced Words
      description: Requires an admin identity.
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WordsReplaceRequest' }
      responses:
        '200':
          description: Updated Words.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WordsResponse' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/replacements:
    get:
      operationId: listReplacements
      summary: List Replacements
      tags: [vocabulary]
      parameters:
        - name: language
          in: query
          required: false
          schema: { type: string }
        - name: stage
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Replacements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplacementsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: replaceReplacements
      summary: Replace settings-sourced Replacements
      description: Requires an admin identity.
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementsReplaceRequest' }
      responses:
        '200':
          description: Updated Replacements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplacementsResponse' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/customization/vocabulary:
    get:
      operationId: getVocabulary
      summary: List folded Words and leftover Replacements
      tags: [vocabulary]
      parameters:
        - name: language
          in: query
          required: false
          schema: { type: string }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Folded vocabulary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: replaceVocabulary
      summary: Replace Words and leftover Replacements in one write
      description: Requires an admin identity. Alias synonyms are materialized from Word.sounds_like.
      tags: [vocabulary]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocabularyReplaceRequest' }
      responses:
        '200':
          description: Updated folded vocabulary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VocabularyResponse' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/lexicons:
    get:
      operationId: listLexicons
      summary: List Lexicons
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Lexicons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LexiconsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: replaceLexicons
      summary: Replace settings-sourced Lexicons
      description: Requires an admin identity.
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LexiconsReplaceRequest' }
      responses:
        '200':
          description: Updated Lexicons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LexiconsResponse' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/rulesets:
    get:
      operationId: listRulesets
      summary: List Rulesets
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Rulesets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesetsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: replaceRulesets
      summary: Replace settings-sourced Rulesets
      description: Requires an admin identity.
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RulesetsReplaceRequest' }
      responses:
        '200':
          description: Updated Rulesets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RulesetsResponse' }
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/customization/pack:
    get:
      operationId: exportCustomizationPack
      summary: Export customization pack
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Customization pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomizationPack' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: importCustomizationPack
      summary: Import customization pack
      description: Requires an admin identity.
      tags: [vocabulary]
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [builtin, app, install, org, workspace, user, session] }
        - name: scope_key
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomizationPack' }
      responses:
        '200':
          description: Pack imported.
        '403': { $ref: '#/components/responses/AdminRequired' }

  /v1/customization/templates:
    get:
      operationId: listCustomizationTemplates
      summary: List Native Templates and active selections
      tags: [vocabulary]
      responses:
        '200':
          description: Customization templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomizationTemplatesResponse' }

  /v1/customization/templates/{templateId}/pack:
    get:
      operationId: getCustomizationTemplatePack
      summary: Export one Native Template as a Customization Pack
      tags: [vocabulary]
      parameters:
        - name: templateId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Customization template pack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomizationPack' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/transcripts:
    get:
      operationId: listTranscripts
      summary: List caller-scoped transcripts
      tags: [storage]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Transcripts visible to the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcripts:
                    type: array
                    items: { $ref: '#/components/schemas/Transcript' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /v1/transcripts/{id}:
    get:
      operationId: getTranscript
      summary: Get caller-scoped transcript
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Transcript.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transcript' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/BadRequest' }

  /v1/voiceagent/sessions/{id}/transcript:
    get:
      operationId: getVoiceAgentSessionTranscript
      summary: Get persisted Voice Agent session transcript
      tags: [storage, voiceagent]
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Session transcript.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceAgentTranscript' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/BadRequest' }

  /v1/voiceagent/sessions/{id}/summary:
    get:
      operationId: getVoiceAgentSessionSummary
      summary: Get persisted Voice Agent session summary
      tags: [storage, voiceagent]
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '200':
          description: Session summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceAgentSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404': { $ref: '#/components/responses/BadRequest' }

  /v1/tts/synthesize:
    post:
      operationId: synthesizeTTS
      summary: Synthesize text to audio
      tags: [tts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TTSSynthesizeRequest' }
      responses:
        '200':
          description: Synthesized audio as base64.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TTSSynthesizeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /v1/tts/voices:
    get:
      operationId: listTTSVoices
      summary: List configured TTS voices
      tags: [tts]
      responses:
        '200':
          description: Voice list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items: { $ref: '#/components/schemas/Voice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ── Dictation ───────────────────────────────────────────────────────────
  /v1/dictation/transcribe:
    post:
      operationId: transcribeDictation
      summary: Transcribe audio to text
      description: |
        Routes audio through the configured STT provider and returns the
        resulting transcript. Accepts either a multipart upload or JSON
        with base64-encoded audio.

        Supported audio formats: WAV (PCM 16-bit), MP3, raw PCM 16 kHz S16
        mono, WebM/Opus, OGG/Opus. WebM and OGG require ffmpeg in the
        container (default for Dockerfile.server).

        Provider precedence per request: explicit `provider_profile_id`
        override → edge-injected user voice-preference headers
        (`x-speechkit-pref-stt-primary` / `-secondary`, honoured only under a
        verified edge HMAC plus a valid `x-speechkit-pref-signature`) → the
        server's configured `[model_selection]` primary → the router's
        fallback order. Unsatisfiable preferences fall back instead of
        erroring; the response's `provider` field reports the provider
        actually used.
      tags: [dictation]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                language:
                  type: string
                  description: BCP-47 hint, e.g. "de", "en", "auto".
                model:
                  type: string
                prompt:
                  type: string
                provider_profile_id:
                  type: string
                  description: |
                    Optional explicit STT provider-profile pin (e.g.
                    `stt.deepgram.nova-3`), same semantics as the JSON field.
          application/json:
            schema:
              $ref: '#/components/schemas/DictateJSONRequest'
      responses:
        '200':
          description: Transcription succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictateResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: STT completed but returned no transcript.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  # ── Assist ──────────────────────────────────────────────────────────────
  /v1/assist/process:
    post:
      operationId: processAssist
      summary: STT → codeword/utility/LLM → optional TTS
      description: |
        Accepts either an audio payload (transcribed via STT first) or a
        text transcript directly. Runs the Framework's Assist pipeline,
        which routes to a tool intent or the LLM agent flow, and returns
        the result plus optional TTS audio as base64 in the JSON response.

        Tool execution is NOT done server-side; clients receive an
        `action: "execute"` signal plus the matched shortcut name and
        perform the action themselves.
      tags: [assist]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                text:
                  type: string
                locale:
                  type: string
                selection:
                  type: string
                context:
                  type: string
                app:
                  type: string
                  description: Foreground application name on the client (e.g. "chrome"). Folded into the Assist LLM context.
                window_title:
                  type: string
                  description: Foreground window title on the client. Folded into the Assist LLM context. May be sensitive — send only what you intend to share.
                tts:
                  type: string
                  description: '"true"/"false" — opt out of TTS audio in the response.'
                tts_format:
                  type: string
                  enum: [mp3, wav, opus]
                tts_voice:
                  type: string
          application/json:
            schema: { $ref: '#/components/schemas/AssistJSONRequest' }
      responses:
        '200':
          description: Pipeline succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: STT returned an empty transcript (audio contained no speech).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  /v1/assist/self-test:
    post:
      operationId: selfTestAssist
      summary: Run a text-only Assist self-test
      description: |
        Runs a fixed text-only Assist prompt with TTS output ignored. Use this
        to separate client/proxy issues from server-side LLM/provider
        configuration failures.
      tags: [assist]
      responses:
        '200':
          description: Assist pipeline produced a non-empty response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistSelfTestResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }

  # ── Voice Agent ─────────────────────────────────────────────────────────
  /v1/dictation/stream/sessions:
    post:
      operationId: createDictationStreamSession
      summary: Create a streaming Dictation session and ticket
      description: |
        Creates a streaming Dictation session and returns a one-time HMAC
        ticket for the WebSocket upgrade at
        `GET /v1/dictation/stream/sessions/{id}/ws` (send the returned
        `ws_subprotocol` as `Sec-WebSocket-Protocol`). The WS protocol —
        JSON control frames plus binary PCM upstream, live partial/final
        `transcript` frames downstream — is specified in
        `asyncapi.dictation-stream.v1.yaml` with golden example frames in
        `fixtures/dictation-stream.v1.json`.

        One WebSocket carries any number of sequential segments: each
        `start` frame opens a provider-native dictation stream, `finalize`
        flushes it, and `segment_done` closes the segment so the next
        `start` can follow on the same warm socket (a keyboard reuses one
        connection across mic presses).

        The `capabilities` block reports whether a streaming-capable STT
        provider (e.g. Deepgram) is configured. When `streaming` is false,
        a `start` frame would fail with `streaming_unavailable`; clients
        should fall back to `POST /v1/dictation/transcribe` instead of
        opening the socket.

        Edge-injected user voice preferences (`x-speechkit-pref-stt-*`) are
        captured at this session-mint request and applied as the default
        `provider_profile_id` for `start` frames that omit one; the
        ticket-authenticated WS upgrade itself carries no preference headers.
      tags: [dictation]
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateDictationStreamSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Per-identity session limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Global session limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/dictation/stream/sessions/{id}:
    delete:
      operationId: deleteDictationStreamSession
      summary: Force close a streaming Dictation session
      tags: [dictation]
      parameters:
        - { $ref: '#/components/parameters/SessionID' }
      responses:
        '204': { description: Closed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Caller does not own the session and is not admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found or already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/voiceagent/sessions:
    post:
      operationId: createVoiceAgentSession
      summary: Create a Voice Agent session and ticket
      description: |
        Creates a session record and returns a one-time HMAC ticket the
        client uses to upgrade the WebSocket. Tickets expire (default 90 s),
        are single-use, and are bound to the session ID — they cannot be
        replayed against a different session. Expired tickets are not
        refreshed in v1; create a new session.

        The WebSocket upgrade itself happens at
        `GET /v1/voiceagent/sessions/{id}/ws` with the returned
        `ws_subprotocol`; it is documented separately because OpenAPI 3.1 has
        no first-class WebSocket primitive.

        When `[server.livekit]` is enabled, the response also includes a
        short-lived LiveKit join token for the same authenticated caller.
        The configured LiveKit deployment is the target media service.
        SpeechKit remains the token issuer and policy boundary.

        Missing realtime provider keys do not turn this endpoint into a 404.
        The session can still be created while `/readyz` reports the provider
        as degraded; the WebSocket start emits a provider connection error such
        as `provider_connect_failed`.

        Deployments with the voice-agent tool bridge enabled
        (`[server.voiceagent.tool_bridge]`) additionally accept an opaque
        per-session credential header on this request (default
        `X-Edge-Obo-Subject-Token`, configurable via `credential_header`).
        The header is honoured only when the request authenticated via
        edge-HMAC; its value is held memory-only for the session's
        server-side tool calls and never appears in any response, ticket,
        or log. See `docs/server/toolbridge.v1.md`.

        Edge-injected user voice preferences (`x-speechkit-pref-va-provider`,
        `x-speechkit-pref-va-persona`) are likewise captured at this
        session-mint request. When the WebSocket `start` frame omits
        `provider` or `persona_id`, the captured preference fills the gap; an
        unconfigured preferred provider or unresolvable preferred persona
        falls back to the server default instead of failing the session.

        WebSocket control frames are JSON text messages. The first client
        frame must be `{"type":"start"}` and may include `persona_id`,
        `role_id`, `sequence_id`, `media_transport`, `voice`, `locale`,
        `model`, `activity_detection`, and `system_prompt_override`.
        `media_transport` defaults to `websocket` for backwards compatibility.
        Set `media_transport` to `livekit` to keep the WebSocket as the
        control channel while microphone and model audio move through the
        LiveKit room from this response. The default WebSocket audio path
        supports Gemini, Deepgram, AssemblyAI, OpenAI, and cascaded providers.
        v1 LiveKit media is limited to providers that advertise LiveKit
        support; cascaded providers remain on WebSocket audio until explicit
        transcoding is added. During a
        workflow, clients send `{"type":"advance_step","reason":"host"}` to
        move to the next sequence step. The server emits `sequence_step`
        frames with `status` values `entered`, `completed`, and
        `sequence_completed`. Tool calls use `tool_call` and `tool_response`.
        Provider-semantic server frames also carry optional `event_type`,
        `event_types`, and `provider_metadata` fields documented in
        `asyncapi.v1.yaml`; pure provider events such as `turn_end` and
        `session_resumable` are emitted as `{"type":"event", ...}` frames.
      tags: [voiceagent]
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: Per-identity session limit exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Global session limit reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listVoiceAgentSessions
      summary: List the caller's active sessions
      tags: [voiceagent]
      responses:
        '200':
          description: List returned (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/ListedSession' }
                  metrics:
                    $ref: '#/components/schemas/VoiceAgentSessionMetrics'
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/voiceagent/sessions/{id}/livekit-token:
    get:
      operationId: refreshVoiceAgentLiveKitToken
      summary: Refresh a LiveKit join token for a Voice Agent session
      tags: [voiceagent]
      parameters:
        - { $ref: '#/components/parameters/SessionID' }
      responses:
        '200':
          description: Fresh short-lived LiveKit join token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveKitJoinInfo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Caller does not own the session and is not admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found or already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: LiveKit token minting is disabled or misconfigured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/voiceagent/sessions/{id}:
    delete:
      operationId: deleteVoiceAgentSession
      summary: Force close a session
      tags: [voiceagent]
      parameters:
        - { $ref: '#/components/parameters/SessionID' }
      responses:
        '204': { description: Closed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Caller does not own the session and is not admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Session not found or already closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

