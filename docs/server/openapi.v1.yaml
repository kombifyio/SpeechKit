      tags: [persona]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/PersistFailed' }

  /v1/roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/RoleID' }
    get:
      operationId: getRole
      summary: Get role
      tags: [persona]
      responses:
        '200':
          description: Role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateRole
      summary: Update role (admin)
      tags: [persona]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/PersistFailed' }
    delete:
      operationId: deleteRole
      summary: Delete role (admin)
      tags: [persona]
      responses:
        '204':
          description: Deleted.
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/PersistFailed' }

  /v1/sequences:
    get:
      operationId: listSequences
      summary: List sequences
      tags: [persona]
      responses:
        '200':
          description: Sequences list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sequences:
                    type: array
                    items: { $ref: '#/components/schemas/Sequence' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createSequence
      summary: Create sequence (admin)
      tags: [persona]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Sequence' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sequence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/PersistFailed' }

  /v1/sequences/{id}:
    parameters:
      - { $ref: '#/components/parameters/SequenceID' }
    get:
      operationId: getSequence
      summary: Get sequence
      tags: [persona]
      responses:
        '200':
          description: Sequence.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sequence' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateSequence
      summary: Update sequence (admin)
      tags: [persona]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Sequence' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sequence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminRequired' }
        '500': { $ref: '#/components/responses/PersistFailed' }
    delete:
      operationId: deleteSequence
      summary: Delete sequence (admin)
      tags: [persona]
      responses:
        '204':
          description: Deleted.
        '403': { $ref: '#/components/responses/AdminRequired' }
        '404':
          description: Not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/PersistFailed' }

# ── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Static deployment-wide token from `$SPEECHKIT_SERVER_TOKEN`. The
        identity attached to the request context is `service@default/internal`.
        Suitable for internal service-to-service callers, product backends, or
        automation services on a private network.
    edgeHmac:
      type: apiKey
      in: header
      name: X-Edge-Auth-Hmac
      description: |
        HMAC-SHA256 of `userID + "\n" + orgID + "\n" + plan + "\n" + role` using
        `$EDGE_AUTH_SECRET`. Must be sent alongside `X-Edge-User-Id`,
        `X-Edge-Org-Id`, `X-Edge-Plan`, and optional `X-Edge-Role`. Used
        when fronted by a Cloudflare Worker / reverse proxy that has
        already validated a user JWT.

  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PersonaID:
      name: id
      in: path
      required: true
      schema: { type: string }
    RoleID:
      name: id
      in: path
      required: true
      schema: { type: string }
    SequenceID:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Readiness:
      description: Component health snapshot.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                enum: [ok, starting, degraded, unavailable]
              strict_status:
                type: string
                enum: [ok, starting, degraded, unavailable]
              components:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [ok, starting, degraded, unavailable]
                    detail: { type: string }
                    updated_at: { type: string, format: date-time }
                    blocking: { type: boolean }
                    kind: { type: string }
                    modes:
                      type: array
                      items: { type: string }
                    provider: { type: string }
              uptime_seconds: { type: integer }
              version: { type: string }
    BadRequest:
      description: The request body could not be decoded or failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: HTTP method is not allowed on this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminRequired:
      description: Caller's identity does not have role=admin.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeds the configured maximum upload size.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type is not one this endpoint accepts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Rate limit exceeded. Honour the `Retry-After` header.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProviderUnavailable:
      description: |
        No upstream provider was able to satisfy the request. Typical for
        STT/Genkit/TTS outages, or when the deployment has no provider
        keys configured for the requested mode.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PersistFailed:
      description: |
        The durable storage layer rejected the write. The in-memory state
        is unchanged so the next read returns the previous value.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    EnvStatus:
      type: object
      required: [env, configured]
      properties:
        env:
          type: string
          description: Environment variable name read by this process.
        configured:
          type: boolean
          description: True when the named environment variable has a non-empty value.

    DeploymentStatus:
      type: object
      required: [version, status, uptime_seconds, headless, auth, providers, store, modes]
      properties:
        version: { type: string }
        status:
          type: string
          enum: [ok, starting, degraded, unavailable]
        uptime_seconds: { type: integer }
        components:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        headless:
          type: object
          required: [settings_path, settings_write, onboarding_ui]
          properties:
            settings_path: { type: string }
            settings_write:
              type: boolean
              description: Whether settings writes are enabled for this process.
            onboarding_ui:
              type: boolean
              description: Whether the setup/onboarding UI is enabled.
        auth:
          type: object
          required:
            - mode
            - bearer_token_env
            - bearer_token_set
            - edge_auth_secret_env
            - edge_auth_secret_set
          properties:
            mode:
              type: string
              enum: [none, bearer, edge_hmac, bearer_or_edge]
            bearer_token_env: { type: string }
            bearer_token_set:
              type: boolean
              description: True when the active bearer token env has a non-empty value.
            bearer_role: { type: string }
            edge_auth_secret_env: { type: string }
            edge_auth_secret_set:
              type: boolean
              description: True when the active edge-HMAC secret env has a non-empty value.
            admin_username: { type: string }
            admin_password_set:
              type: boolean
              description: True when an admin password hash is configured.
        providers:
          type: object
          properties:
            google:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
                stt_key: { $ref: '#/components/schemas/EnvStatus' }
            openai:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
            groq:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
            huggingface:
              type: object
              properties:
                token: { $ref: '#/components/schemas/EnvStatus' }
            openrouter:
              type: object
              properties:
                api_key: { $ref: '#/components/schemas/EnvStatus' }
        store:
          type: object
          properties:
            backend: { type: string }
        modes:
          type: array
          items: { type: string }

    ProviderProfile:
      type: object
      properties:
        id: { type: string }
        mode: { type: string }
        name: { type: string }
        providerKind: { type: string }
        executionMode: { type: string }
        modelId: { type: string }
        source: { type: string }
        description: { type: string }
        license: { type: string }
        capabilities:
          type: array
          items: { type: string }
        adapterKind: { type: string }
        inferenceAllowed: { type: boolean }
        default: { type: boolean }
        recommended: { type: boolean }

    ServerSettingsSnapshot:
      type: object
      properties:
        version: { type: string }
        status: { type: string }
        onboarding:
          type: object
          properties:
            enabled: { type: boolean }
            complete: { type: boolean }
            required: { type: boolean }
            current_deploy_version: { type: string }
            completed_version: { type: string }
        auth:
          type: object
          properties:
            mode: { type: string }
            bearer_token_env: { type: string }
            bearer_token_set: { type: boolean }
            admin_auth_enabled: { type: boolean }
            admin_username: { type: string }
            admin_password_set: { type: boolean }
        editable:
          type: object
          properties:
            desired: { $ref: '#/components/schemas/ServerSettingsPatch' }

    ServerSettingsPatch:
      type: object
      properties:
        onboarding_complete: { type: boolean }
        server_auth:
          type: object
          properties:
            mode:
              type: string
              enum: [managed_bearer, self_managed]
            bearer_token_env: { type: string }
            generate_token: { type: boolean }
        admin_auth:
          type: object
          properties:
            enabled:
              type: boolean
              description: Enables standalone `/setup` username/password login.
            username: { type: string }
            password:
              type: string
              format: password
              description: Write-only. Stored as a bcrypt hash.
            password_hash:
              type: string
              description: Optional precomputed bcrypt hash for automation.

    ServerSettingsSaveResponse:
      type: object
      properties:
        status:
          type: string
          enum: [saved]
        restart_required: { type: boolean }
        desired: { $ref: '#/components/schemas/ServerSettingsPatch' }
        generated_token:
          type: object
          properties:
            token:
              type: string
              description: One-time server bearer token. Store it in the configured environment.
            env: { type: string }
            auth_mode: { type: string }
            header_name: { type: string }
        experimental: { type: boolean }

    ModeContract:
      type: object
      properties:
        mode: { type: string }
        intelligence: { type: string }
        input: { type: string }
        output: { type: string }
        allowed:
          type: array
          items: { type: string }
        forbidden:
          type: array
          items: { type: string }

    ProviderReadiness:
      type: object
      description: |
        Server-side readiness for a catalog profile. `active` means selected
        by server configuration; `default` is static catalog metadata.
        `ready` is independent of `active` and only reflects whether the
        profile could run if selected.
      properties:
        schemaVersion: { type: string }
        profileId: { type: string }
        mode: { type: string }
        providerKind: { type: string }
        executionMode: { type: string }
        modelId: { type: string }
        source: { type: string }
        active: { type: boolean }
        default: { type: boolean }
        configured: { type: boolean }
        credentialsReady: { type: boolean }
        runtimeReady: { type: boolean }
        capabilityReady: { type: boolean }
        ready: { type: boolean }
        missing:
          type: array
          items:
            type: string
            enum: [mode_disabled, provider_disabled, credentials, runtime]

    ConfigSummary:
      type: object
      properties:
        version: { type: string }
        public_url: { type: string }
        modes:
          type: array
          items: { type: string }
        auth_mode: { type: string }
        bearer_role: { type: string }
        max_upload_mb: { type: integer }
        features:
          type: object
          additionalProperties: { type: boolean }
        ready_status: { type: string }

    DictionaryEntry:
      type: object
      properties:
        id: { type: integer }
        spoken: { type: string }
        canonical: { type: string }
        language: { type: string }
        source: { type: string }
        enabled: { type: boolean }
        usageCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Transcript:
      type: object
      properties:
        id: { type: integer }
        text: { type: string }
        language: { type: string }
        provider: { type: string }
        model: { type: string }
        durationMs: { type: integer }
        latencyMs: { type: integer }
        audioPath: { type: string }
        audio: { $ref: '#/components/schemas/AudioAsset' }
        createdAt: { type: string, format: date-time }
        ownerUserId: { type: string }
        ownerOrgId: { type: string }
        ownerSource: { type: string }

    AudioAsset:
      type: object
      properties:
        storageKind: { type: string, enum: [local-file] }
        path: { type: string }
        mimeType:
          type: string
          description: MIME type preserved from the source upload when available.
        sizeBytes: { type: integer }
        durationMs: { type: integer }

    VoiceAgentTranscript:
      type: object
      properties:
        id: { type: integer }
        transcript: { type: string }
        turns:
          type: array
          items:
            type: object
            properties:
              role: { type: string }
              text: { type: string }
              createdAt: { type: string, format: date-time }
        language: { type: string }
        created_at: { type: string, format: date-time }

    VoiceAgentSummaryResponse:
      type: object
      properties:
        id: { type: integer }
        summary:
          type: object
          additionalProperties: true
        language: { type: string }
        created_at: { type: string, format: date-time }

    TTSSynthesizeRequest:
      type: object
      required: [text]
      properties:
        text: { type: string }
        locale: { type: string }
        voice: { type: string }
        speed: { type: number }
        format: { type: string, enum: [mp3, wav, opus, pcm] }

    TTSSynthesizeResponse:
      type: object
      properties:
        audio_base64: { type: string }
        format: { type: string }
        sample_rate: { type: integer }
        duration_ms: { type: integer }
        provider: { type: string }
        voice: { type: string }

    Voice:
      type: object
      description: Configured TTS voice entry. This is a server configuration snapshot, not live provider voice discovery.
      properties:
        provider: { type: string }
        id: { type: string }
        locale: { type: string }
        default: { type: boolean }
        discovery: { type: string, enum: [configured] }

    DictateJSONRequest:
      type: object
      required: [audio_base64]
      properties:
        audio_base64: { type: string }
        format:
          type: string
          enum: [wav, mp3, pcm16]
        language: { type: string }
        model: { type: string }
        prompt: { type: string }

    DictateResponse:
      type: object
      required: [text, duration_ms, latency_ms]
      properties:
        text: { type: string, minLength: 1 }
        language: { type: string }
        duration_ms: { type: integer }
        latency_ms: { type: integer }
        provider: { type: string }
        model: { type: string }
        confidence:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceMeta'

    AssistJSONRequest:
      type: object
      properties:
        text: { type: string }
        audio_base64: { type: string }
        format:
          type: string
          enum: [wav, mp3, pcm16]
        locale: { type: string }
        selection: { type: string }
        context: { type: string }
        tts: { type: boolean }
        tts_format:
          type: string
          enum: [mp3, wav, opus]
        tts_voice: { type: string }
        tts_speed:
          type: number
          format: double

    AssistResponse:
      type: object
      required: [text, action, latency_ms]
      properties:
        text: { type: string, minLength: 1 }
        speak_text: { type: string }
        action:
          type: string
          enum: [respond, execute, silent, shortcut]
        locale: { type: string }
        shortcut: { type: string }
        surface: { type: string }
        kind: { type: string }
        transcript: { type: string }
        audio_base64: { type: string }
        audio_format: { type: string }
        latency_ms: { type: integer }
        source:
          $ref: '#/components/schemas/SourceMeta'

    AssistSelfTestResponse:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        text: { type: string }
        action: { type: string }
        locale: { type: string }
        latency_ms: { type: integer }
        details:
          type: object
          additionalProperties: true

    CreateSessionResponse:
      type: object
      required: [session_id, ws_url, ticket, expires_at]
      properties:
        session_id: { type: string }
        ws_url:
          type: string
          format: uri
          description: |
            Use this exact URL (already includes the `?ticket=…` query
            param) to open the WebSocket. Browser clients do not send bearer
            tokens in the WebSocket handshake. Tickets are HMAC-bound to the
            session id, single-use, and expire after the configured TTL
            (default 90 s). Expired tickets are not refreshed in v1; create a
            new session. Set SPEECHKIT_PUBLIC_URL (or alias
            SPEECHKIT_SERVER_PUBLIC_URL) for browser-facing Docker/proxy
            deployments so `ws_url` uses the public origin.
        ticket:
          type: string
          description: One-time WebSocket upgrade ticket already embedded in `ws_url`.
        expires_at:
          type: string
          format: date-time
          description: Ticket expiry timestamp.
        livekit:
          $ref: '#/components/schemas/LiveKitJoinInfo'

    LiveKitJoinInfo:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: LiveKit WebSocket URL, e.g. `wss://livekit.example.com`.
        room:
          type: string
          description: SpeechKit-managed LiveKit room name.
        token:
          type: string
          description: Short-lived LiveKit JWT scoped to this room and participant.
        token_expires_at:
          type: string
          format: date-time
        participant_identity:
          type: string

    ListedSession:
      type: object
      properties:
        session_id: { type: string }
        state:
          type: string
          enum: [pending_ws, active, closed]
        created_at:
          type: string
          format: date-time
        has_ws_client: { type: boolean }

    SourceMeta:
      type: object
      properties:
        format: { type: string }
        sample_rate: { type: integer }
        channels: { type: integer }
        duration_ms: { type: integer }

    Persona:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }
        description: { type: string }
        voice: { type: string }
        locale: { type: string }
        default_role: { type: string }
        default_sequence:
          type: string
          description: Optional sequence started when the persona is selected without an explicit sequence_id.
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source:
          type: string
          enum: [toml, store]

    Role:
      type: object
      required: [id, display_name, system_prompt]
      properties:
        id: { type: string }
        display_name: { type: string }
        system_prompt: { type: string }
        refinement_prompt: { type: string }
        locale: { type: string }
        vocabulary_hint: { type: string }
        tool_allowlist:
          type: array
          items: { type: string }
        temperature:
          type: number
          format: double
        thinking_enabled: { type: boolean }
        thinking_level:
          type: string
          enum: [off, low, medium, high]
        include_thoughts: { type: boolean }
        thinking_budget: { type: integer }
        automatic_activity_detection: { type: boolean }
        vad_start_sensitivity:
          type: string
          enum: [low, medium, high]
        vad_end_sensitivity:
          type: string
          enum: [low, medium, high]
