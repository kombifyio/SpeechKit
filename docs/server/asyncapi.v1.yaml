asyncapi: 3.1.0
info:
  title: SpeechKit Voice Agent WebSocket API
  version: 1.1.0
  description: |
    Stable v1 WebSocket contract for the SpeechKit Server's Voice Agent mode.

    A client first calls `POST /v1/voiceagent/sessions` (see openapi.v1.yaml)
    to obtain a session id, `ws_url`, and a single-use `ws_subprotocol`, then
    upgrades a WebSocket to `GET /v1/voiceagent/sessions/{id}/ws` with
    `Sec-WebSocket-Protocol: ticket.<value>`. Do not send the HTTP bearer token
    in the browser WebSocket handshake.

    Tickets default to 90 seconds, are single-use, and are not refreshed in v1.
    If a ticket expires before upgrade, create a new Voice Agent session.
    Browser-facing Docker/proxy deployments should set `SPEECHKIT_PUBLIC_URL`
    so the HTTP session response returns a browser-reachable `ws_url` rather
    than a container hostname.

    The protocol multiplexes two kinds of frames over the same WebSocket:

    - **JSON control frames** (`text` opcode): a JSON object with a required
      `type` field. The full set is enumerated below.
    - **Binary audio frames** (`binary` opcode): raw PCM, **16 kHz S16 mono**
      from client to server. Server-to-client model audio defaults to
      **24 kHz S16 mono** over the SpeechKit WebSocket; provider-native
      adapters may preserve their native output rate and surface the effective
      format in `provider_metadata` when it differs.

    If the StartFrame uses `media_transport: "livekit"`, this WebSocket remains
    the control channel for start, transcripts, tool calls, errors, workflow
    steps, and shutdown. Microphone and model audio move through LiveKit audio
    tracks; WebSocket binary audio is rejected for that session.

    Server JSON frames that represent provider semantics carry optional
    `event_type`, `event_types`, and `provider_metadata` fields. `event_type`
    is the primary SpeechKit-normalized event for routing, `event_types`
    includes every normalized meaning when a provider combines multiple native
    events in one frame, and `provider_metadata` keeps provider-native debug
    details such as the original provider event name.

    Media transport matrix:

    | media_transport | Control frames | Client audio | Model audio | Provider support |
    |---|---|---|---|---|
    | websocket (default) | SpeechKit WS JSON | SpeechKit WS binary PCM | SpeechKit WS binary PCM | Gemini, Deepgram, AssemblyAI, OpenAI, Microsoft Foundry, cascaded providers |
    | livekit | SpeechKit WS JSON | LiveKit audio track | LiveKit audio track | Gemini and OpenAI native realtime providers |

    Field guarantees follow the same rules as openapi.v1.yaml: additive
    across minor releases, no rename or removal without a v2 bump.

  contact:
    url: https://github.com/kombifyio/SpeechKit
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

defaultContentType: application/json

servers:
  production:
    host: api.speechkit.dev
    pathname: /v1/voiceagent
    protocol: wss
    description: Replace with your deployment's public host.
    security:
      - $ref: '#/components/securitySchemes/sessionTicket'

channels:
  voiceAgentSession:
    address: /sessions/{sessionId}/ws
    title: Voice Agent realtime session
    description: |
      One WebSocket per active voice-agent session. The first message a
      client sends MUST be a StartFrame; the server replies with a State
      frame (state="connecting" then "listening") and begins streaming.
    parameters:
      sessionId:
        description: Session id returned by `POST /v1/voiceagent/sessions`.
    messages:
      # Client to server JSON control frames
      StartFrame:
        $ref: '#/components/messages/StartFrame'
      TextFrame:
        $ref: '#/components/messages/TextFrame'
      ToolResponseFrame:
        $ref: '#/components/messages/ToolResponseFrame'
      AdvanceStepFrame:
        $ref: '#/components/messages/AdvanceStepFrame'
      AudioEndFrame:
        $ref: '#/components/messages/AudioEndFrame'
      CancelFrame:
        $ref: '#/components/messages/CancelFrame'
      PingFrame:
        $ref: '#/components/messages/PingFrame'
      StopFrame:
        $ref: '#/components/messages/StopFrame'
      # Client to server binary audio
      AudioChunkClient:
        $ref: '#/components/messages/AudioChunkClient'
      # Server to client JSON control frames
      StateFrame:
        $ref: '#/components/messages/StateFrame'
      InputTranscriptFrame:
        $ref: '#/components/messages/InputTranscriptFrame'
      OutputTranscriptFrame:
        $ref: '#/components/messages/OutputTranscriptFrame'
      ToolCallFrame:
        $ref: '#/components/messages/ToolCallFrame'
      SequenceStepFrame:
        $ref: '#/components/messages/SequenceStepFrame'
      EventFrame:
        $ref: '#/components/messages/EventFrame'
      InterruptedFrame:
        $ref: '#/components/messages/InterruptedFrame'
      ErrorFrame:
        $ref: '#/components/messages/ErrorFrame'
      SessionEndFrame:
        $ref: '#/components/messages/SessionEndFrame'
      PongFrame:
        $ref: '#/components/messages/PongFrame'
      # Server to client binary audio
      AudioChunkServer:
        $ref: '#/components/messages/AudioChunkServer'

operations:
  sendClientFrame:
    action: send
    channel:
      $ref: '#/channels/voiceAgentSession'
    summary: Frames the client sends to the server.
    description: |
      The first frame MUST be StartFrame. Subsequent frames may be any of
      the client message types in any order. Binary audio chunks may be
      interleaved freely with JSON control frames only when
      `media_transport` is omitted or set to `websocket`.

      Servers tolerate unknown client frame `type` values: they are logged
      and ignored (no error frame, no close), so newer clients degrade
      gracefully against older servers. Clients that depend on a newer frame
      (e.g. `cancel`) should gate on a positive server signal such as the
      `provider`/`media_transport` fields on the session_ready State frame.
    messages:
      - $ref: '#/channels/voiceAgentSession/messages/StartFrame'
      - $ref: '#/channels/voiceAgentSession/messages/TextFrame'
      - $ref: '#/channels/voiceAgentSession/messages/ToolResponseFrame'
      - $ref: '#/channels/voiceAgentSession/messages/AdvanceStepFrame'
      - $ref: '#/channels/voiceAgentSession/messages/AudioEndFrame'
      - $ref: '#/channels/voiceAgentSession/messages/CancelFrame'
      - $ref: '#/channels/voiceAgentSession/messages/PingFrame'
      - $ref: '#/channels/voiceAgentSession/messages/StopFrame'
      - $ref: '#/channels/voiceAgentSession/messages/AudioChunkClient'

  receiveServerFrame:
    action: receive
    channel:
      $ref: '#/channels/voiceAgentSession'
    summary: Frames the client receives from the server.
    description: |
      All frames carry a `type` discriminator. SessionEnd is terminal; the
      server closes the WebSocket immediately after sending it.
    messages:
      - $ref: '#/channels/voiceAgentSession/messages/StateFrame'
      - $ref: '#/channels/voiceAgentSession/messages/InputTranscriptFrame'
      - $ref: '#/channels/voiceAgentSession/messages/OutputTranscriptFrame'
      - $ref: '#/channels/voiceAgentSession/messages/ToolCallFrame'
      - $ref: '#/channels/voiceAgentSession/messages/SequenceStepFrame'
      - $ref: '#/channels/voiceAgentSession/messages/EventFrame'
      - $ref: '#/channels/voiceAgentSession/messages/InterruptedFrame'
      - $ref: '#/channels/voiceAgentSession/messages/ErrorFrame'
      - $ref: '#/channels/voiceAgentSession/messages/SessionEndFrame'
      - $ref: '#/channels/voiceAgentSession/messages/PongFrame'
      - $ref: '#/channels/voiceAgentSession/messages/AudioChunkServer'

components:
  securitySchemes:
    sessionTicket:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: |
        Single-use session ticket minted by `POST /v1/voiceagent/sessions`.
        Bound to the session id and consumed at WebSocket upgrade. Send the
        returned `ws_subprotocol` value (`ticket.<value>`) as the WebSocket
        subprotocol; browser clients do not send `Authorization: Bearer` in
        the WebSocket handshake.

  messages:
    # client to server JSON
    StartFrame:
      title: Start
      summary: First frame; opens the realtime session.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StartFrame'

    TextFrame:
      title: Text
      summary: Inject a text user-turn into the session.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TextFrame'

    ToolResponseFrame:
      title: Tool response
      summary: Resolve a previously-issued ToolCall.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolResponseFrame'

    AdvanceStepFrame:
      title: Advance step
      summary: Move the workflow runner to the next sequence step.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AdvanceStepFrame'

    AudioEndFrame:
      title: Audio end
      summary: Mark the end of the current microphone burst.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AudioEndFrame'

    CancelFrame:
      title: Cancel
      summary: Stop relaying the current agent reply's downlink audio (tap-to-interrupt).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CancelFrame'

    PingFrame:
      title: Ping
      summary: Application-level keepalive.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PingFrame'

    StopFrame:
      title: Stop
      summary: Client-initiated session shutdown.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StopFrame'

    AudioChunkClient:
      title: Audio chunk (client to server)
      summary: PCM 16 kHz S16 mono microphone chunk (binary frame).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/AudioChunkBinary'

    # server to client JSON
    StateFrame:
      title: State
      summary: Session state transition notification.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StateFrame'

    InputTranscriptFrame:
      title: Input transcript
      summary: Server-side STT of the user's speech.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TranscriptFrame'

    OutputTranscriptFrame:
      title: Output transcript
      summary: Server-side STT of the model's spoken reply.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TranscriptFrame'

    ToolCallFrame:
      title: Tool call
      summary: Model-issued request to invoke a host-side tool.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ToolCallFrame'

    SequenceStepFrame:
      title: Sequence step
      summary: Workflow runner advanced or completed a step.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SequenceStepFrame'

    EventFrame:
      title: Provider event
      summary: Provider-neutral event without transcript, tool, or terminal JSON payload.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EventFrame'

    InterruptedFrame:
      title: Interrupted
      summary: >-
        User interrupted the model — speech barge-in, or the acknowledgement
        of a client CancelFrame (`provider_metadata.reason = "client_cancel"`).
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InterruptedFrame'

    ErrorFrame:
      title: Error
      summary: Server-side error during the session.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ErrorFrame'

    SessionEndFrame:
      title: Session end
      summary: Terminal frame; the server closes the socket after this.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionEndFrame'

    PongFrame:
      title: Pong
      summary: Reply to PingFrame.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PongFrame'

    AudioChunkServer:
      title: Audio chunk (server to client)
      summary: PCM 24 kHz S16 mono model-output chunk (binary frame).
      contentType: application/octet-stream
      payload:
        $ref: '#/components/schemas/AudioChunkBinary'

  schemas:
    # client to server
    StartFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: start }
        persona_id: { type: string }
        role_id: { type: string }
        sequence_id: { type: string }
        provider:
          type: string
          description: |
            Selects the realtime backend for THIS session, e.g. `gemini`,
            `openai`, `deepgram`, `assemblyai`, `cascaded`. Empty uses the
            server's configured default. An unknown or unconfigured provider
            is rejected at start with a `provider_unavailable` error.
        media_transport:
          type: string
          enum: [websocket, livekit]
          default: websocket
          description: |
            Selects where microphone and model audio move. `websocket` keeps
            the v1 binary-frame audio path. `livekit` keeps this WebSocket as
            the control channel and moves audio through the LiveKit room minted
            by `POST /v1/voiceagent/sessions`. The default WebSocket path
            supports Gemini, Deepgram, AssemblyAI, OpenAI, and cascaded
            providers. v1 LiveKit media is limited to providers that advertise
            LiveKit support; cascaded providers stay on WebSocket audio until
            explicit transcoding is added.
        voice: { type: string }
        locale: { type: string }
        model: { type: string }
        thinking:
          type: string
          enum: [off, low, medium, high]
        activity_detection:
          $ref: '#/components/schemas/ActivityDetection'
        speaker:
          $ref: '#/components/schemas/SpeakerOptions'
        system_prompt_override:
          type: string
          description: Durable instruction layered on top of the role's prompt.

    SpeakerOptions:
      type: object
      description: |
        Speaker diarization / identification for the session. Property names
        are camelCase (they mirror the server's `speaker.Options`), unlike the
        snake_case frame fields elsewhere in this document.
      properties:
        enabled: { type: boolean }
        diarization: { type: boolean }
        identification: { type: boolean }
        attribution: { type: boolean }
        providerProfileId: { type: string }
        model: { type: string }
        diarizationModel: { type: string }
        language: { type: string }
        speakersExpected: { type: integer, format: int32 }
        minSpeakersExpected: { type: integer, format: int32 }
        maxSpeakersExpected: { type: integer, format: int32 }
        speakerType: { type: string }
        knownValues:
          type: array
          items: { type: string }
        knownSpeakers:
          type: array
          items: { type: object }
        preferStreaming: { type: boolean }
        allowProviderMapping: { type: boolean }

    ActivityDetection:
      type: object
      properties:
        automatic: { type: boolean }
        start_sensitivity:
          type: string
          enum: ['', low, medium, high]
        end_sensitivity:
          type: string
          enum: ['', low, medium, high]
        prefix_padding_ms: { type: integer, format: int32 }
        silence_duration_ms: { type: integer, format: int32 }
        activity_handling:
          type: string
          enum: ['', no_interrupt, start_of_activity_interrupts]
        turn_coverage:
          type: string
          enum: ['', turn_includes_only_activity, turn_includes_all_input, turn_includes_audio_activity]

    TextFrame:
      type: object
      required: [type, text]
      properties:
        type: { type: string, const: text }
        text: { type: string }

    ToolResponseFrame:
      type: object
      required: [type, id, name, response]
      properties:
        type: { type: string, const: tool_response }
        id:
          type: string
          description: Echoes ToolCallFrame.id.
        name:
          type: string
          description: Echoes ToolCallFrame.name.
        response:
          type: object
          additionalProperties: true
          description: 'Free-form result; commonly an error object on failure.'

    AdvanceStepFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: advance_step }
        step_id:
          type: string
          description: Reserved for future direct jumps; v1 advances linearly.
        reason:
          type: string

    AudioEndFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: audio_end }

    CancelFrame:
      type: object
      required: [type]
      description: |
        Client tap-to-interrupt for the CURRENT agent reply. Added in 1.1.0.
        Idempotent and payload-free. The server stops relaying the current
        reply's downlink audio, invokes the provider-native response cancel
        where the provider protocol has one (OpenAI Realtime
        `response.cancel`), and always acknowledges with an Interrupted
        frame (`provider_metadata.reason = "client_cancel"`) so client
        playback state converges. Gemini Live, Deepgram Voice Agent,
        AssemblyAI Voice Agent, and the cascaded pipeline have no client-side
        cancel message: for them the reply may keep generating upstream while
        the server suppresses its downlink audio until the turn ends; output
        transcripts of the cancelled reply keep flowing. A cancel while
        nothing is playing is a no-op that is still acknowledged. Older
        servers (contract 1.0.x) ignore this frame silently — gate sending
        on the session_ready `provider`/`media_transport` fields.
      properties:
        type: { type: string, const: cancel }

    PingFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: ping }

    StopFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: stop }

    AudioChunkBinary:
      type: string
      format: binary
      description: |
        Raw PCM 16-bit signed little-endian mono frame. Sample rate:
        16 kHz client to server, 24 kHz server to client. Frames are sent on
        the WebSocket binary opcode without any wrapping header. Only valid
        when the session uses `media_transport: "websocket"`.

    # server to client
    LiveEventType:
      type: string
      enum:
        - session_ready
        - input_partial
        - input_final
        - output_audio
        - output_text
        - tool_call
        - tool_result_ack
        - interrupted
        - turn_end
        - session_resumable
        - session_end

    EventFrameFields:
      type: object
      properties:
        ai_session_id:
          type: string
          description: Durable agent-conversation identifier bound when the voice session was minted.
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
          description: All SpeechKit-normalized event meanings for this frame.
        provider_metadata:
          type: object
          additionalProperties: true
          description: Provider-native event details for diagnostics and advanced hosts.

    StateFrame:
      type: object
      required: [type, state]
      properties:
        type: { type: string, const: state }
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true
        state:
          type: string
          enum: [connecting, listening, processing, speaking, recovering, deactivating, inactive]
        provider:
          type: string
          description: |
            Present on the session_ready State frame (added in 1.1.0): the
            resolved provider that actually serves this session after the
            `start.provider` → edge voice-preference → server-default
            precedence ran, e.g. `gemini`, `deepgram`, `assemblyai`,
            `openai`, `cascaded`. Lets clients distinguish native realtime
            backends from the cascaded pipeline and gate `cancel` support.
        media_transport:
          type: string
          enum: [websocket, livekit]
          description: |
            Present on the session_ready State frame (added in 1.1.0): the
            media transport actually applied to this session.

    TranscriptFrame:
      type: object
      required: [type, text, done]
      properties:
        type:
          type: string
          enum: [input_transcript, output_transcript]
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true
        text:
          type: string
          description: Partial or full transcript chunk.
        done:
          type: boolean
          description: True when the transcript segment is final.
        speaker_label:
          type: string
          description: >
            Diarization label for the voice this text came from, e.g. `S1`.
            Present only when the StartFrame carried `speaker` options and the
            provider returned an attribution.
        person_id:
          type: string
          description: Identified person behind `speaker_label`, when identification ran.
        display_name:
          type: string
          description: Human-readable name for `person_id`.
        speaker_confidence:
          type: number
          description: Confidence in the attribution, 0..1.

    ToolCallFrame:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, const: tool_call }
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true
        id:
          type: string
          description: Unique within this session; echo back in ToolResponseFrame.id.
        name: { type: string }
        args:
          type: object
          additionalProperties: true

    SequenceStepFrame:
      type: object
      required: [type, step_id, status]
      properties:
        type: { type: string, const: sequence_step }
        sequence_id: { type: string }
        step_id: { type: string }
        step_index: { type: integer }
        status:
          type: string
          enum: [entered, completed, sequence_completed]
        reason: { type: string }

    EventFrame:
      type: object
      required: [type, event_type]
      properties:
        type: { type: string, const: event }
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true

    InterruptedFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: interrupted }
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true

    ErrorFrame:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, const: error }
        code:
          type: string
          description: Stable machine-readable error code.
        message: { type: string }
        remediation:
          type: string
          description: >-
            Short machine-friendly hint on how to unblock the denied
            capability (additive, optional).
        request_id:
          type: string
          description: >-
            Gateway/server correlation id for support and tracing
            (additive, optional).

    SessionEndFrame:
      type: object
      required: [type, reason]
      properties:
        type: { type: string, const: session_end }
        ai_session_id: { type: string }
        event_type:
          $ref: '#/components/schemas/LiveEventType'
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/LiveEventType'
        provider_metadata:
          type: object
          additionalProperties: true
        reason:
          type: string
          enum: [idle, go_away, client, error, shutdown, max_duration]

    PongFrame:
      type: object
      required: [type]
      properties:
        type: { type: string, const: pong }
