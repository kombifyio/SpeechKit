                $ref: "#/components/schemas/ActivatedProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ControlPlaneHeader:
      type: apiKey
      in: header
      name: X-SpeechKit-Control-Token
      description: Required for mutating requests when the desktop host has issued a control-plane token.
    ControlPlaneCookie:
      type: apiKey
      in: cookie
      name: speechkit_control_plane
      description: HttpOnly same-site cookie issued by the local desktop host.
  parameters:
    Mode:
      name: mode
      in: path
      required: true
      schema:
        type: string
        enum:
          - dictation
          - dictate
          - transcribe
          - assist
          - voice_agent
          - voiceAgent
          - voice-agent
      description: Mode name or accepted alias.
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
      description: Stable provider artifact ID from `/api/v1/providers/artifacts`.
    CustomizationLanguage:
      name: language
      in: query
      required: false
      schema:
        type: string
      description: Optional BCP-47 language scope. Implementations normalize region tags to the base language.
    CustomizationScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [builtin, app, install, org, workspace, user, session]
      description: Optional customization applicability scope. Device Settings defaults to install; user, org, workspace, and session require scope_key.
    CustomizationScopeKey:
      name: scope_key
      in: query
      required: false
      schema:
        type: string
      description: Required key for explicit user, org, workspace, or session scopes.
    CustomizationSource:
      name: source
      in: query
      required: false
      schema:
        type: string
      description: Optional customization provenance such as settings, api, developer, migration, or pack:<id>.
  responses:
    BadRequest:
      description: Invalid request or unsupported profile selection.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Control-plane guard rejected the request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Route, mode, or profile not found.
    Conflict:
      description: Request conflicts with the current mode, session, or capability state.
      content:
        text/plain:
          schema:
            type: string
    NotImplemented:
      description: The configured storage backend does not support this operation.
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: Runtime command bus unavailable.
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: Runtime command bus or dependent service unavailable.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Mode:
      type: string
      enum: [none, dictation, assist, voice_agent]
    RuntimeMode:
      type: string
      enum: [none, dictate, assist, voice_agent]
    IntelligenceKind:
      type: string
      enum: [user, utility, brainstorming]
    ProviderKind:
      type: string
      enum: [local_built_in, local_provider, cloud_provider, direct_provider]
    ExecutionMode:
      type: string
      enum: [local, self_hosted_http, hf_routed, openai_api, groq_api, google_api, ollama_local, openrouter_api]
    Capability:
      type: string
      enum:
        - transcription
        - stt
        - audio_input
        - llm
        - tts
        - realtime_audio
        - pipeline_fallback
        - tool_calling
        - dictionary_prompt
        - dictionary_native_hints
        - session_summary
    ModeContract:
      type: object
      required: [mode, intelligence, input, output, allowed, forbidden]
      properties:
        mode:
          $ref: "#/components/schemas/Mode"
        intelligence:
          $ref: "#/components/schemas/IntelligenceKind"
        input:
          type: string
        output:
          type: string
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        forbidden:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    BaseModeSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        hotkey:
          type: string
        hotkeyBehavior:
          type: string
          enum: [hold_to_talk, push_to_talk, toggle]
          # push_to_talk is the legacy alias for hold_to_talk and is normalised
          # on read; new writes should always use hold_to_talk.
        primaryProfileId:
          type: string
        fallbackProfileId:
          type: string
        modeSource:
          type: string
          enum: [local, server]
    DictationSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [dictionaryEnabled]
          properties:
            dictionaryEnabled:
              type: boolean
    AssistSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [ttsEnabled]
          properties:
            ttsEnabled:
              type: boolean
            utilityRegistry:
              type: string
    VoiceAgentSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [sessionSummary, pipelineFallback]
          properties:
            sessionSummary:
              type: boolean
            pipelineFallback:
              type: boolean
            closeBehavior:
              type: string
            agentProfileId:
              type: string
            agentSequenceId:
              type: string
    ServerConnectionTarget:
      type: object
      required:
        - id
        - label
        - url
        - authMode
        - bearerTokenSet
        - fallbackToLocal
        - requestTimeoutSec
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        bearerTokenEnv:
          type: string
        bearerTokenSet:
          type: boolean
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
    ServerConnectionSetting:
      type: object
      required: [enabled, url, bearerTokenSet, fallbackToLocal, requestTimeoutSec]
      properties:
        enabled:
          type: boolean
        activeTargetId:
          type: string
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        bearerTokenSet:
          type: boolean
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ServerConnectionTarget"
    ServerConnectionPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        activeTargetId:
          type: string
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ServerConnectionTarget"
        token:
          type: string
          writeOnly: true
          description: Optional secret value stored locally under bearerTokenEnv.
    ServerConnectionSmokeRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        token:
          type: string
          writeOnly: true
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
    ServerConnectionSmokeResponse:
      type: object
      required: [ok, status, message]
      properties:
        ok:
          type: boolean
        status:
          type: string
        message:
          type: string
        healthStatus:
          type: integer
        readyStatus:
          type: integer
    ModeSettings:
      type: object
      required: [dictation, assist, voiceAgent, serverConnection]
      properties:
        dictation:
          $ref: "#/components/schemas/DictationSetting"
        assist:
          $ref: "#/components/schemas/AssistSetting"
        voiceAgent:
          $ref: "#/components/schemas/VoiceAgentSetting"
        serverConnection:
          $ref: "#/components/schemas/ServerConnectionSetting"
    ModeSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        hotkey:
          type: string
        hotkeyBehavior:
          type: string
          enum: [hold_to_talk, push_to_talk, toggle]
          # push_to_talk is the legacy alias for hold_to_talk and is normalised
          # on read; new writes should always use hold_to_talk.
        primaryProfileId:
          type: string
        fallbackProfileId:
          type: string
        modeSource:
          type: string
          enum: [local, server]
        dictionaryEnabled:
          type: boolean
        ttsEnabled:
          type: boolean
        sessionSummary:
          type: boolean
        pipelineFallback:
          type: boolean
        closeBehavior:
          type: string
        agentProfileId:
          type: string
        agentSequenceId:
          type: string
    ModesResponse:
      type: object
      required: [contracts, settings]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ModeContract"
        settings:
          $ref: "#/components/schemas/ModeSettings"
    ModelVariant:
      type: object
      required: [id, name, modelId]
      properties:
        id:
          type: string
        name:
          type: string
        modelId:
          type: string
        description:
          type: string
        recommended:
          type: boolean
    ProviderProfile:
      type: object
      required: [id, name, providerKind]
      properties:
        id:
          type: string
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        name:
          type: string
        providerKind:
          $ref: "#/components/schemas/ProviderKind"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
        modelId:
          type: string
        source:
          type: string
        description:
          type: string
        license:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        adapterKind:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ModelVariant"
        inferenceAllowed:
          type: boolean
        default:
          type: boolean
        recommended:
          type: boolean
        experimental:
          type: boolean
    ProviderProfilesResponse:
      type: object
      required: [profiles, activeProfiles, groups, contracts]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProviderProfile"
        activeProfiles:
          type: object
          additionalProperties:
            type: string
        groups:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ModeContract"
    Readiness:
      type: object
      required: [profileId, mode, providerKind, active, default, configured, credentialsReady, runtimeReady, capabilityReady, ready]
      properties:
        schemaVersion:
          type: string
          enum: [provider-readiness.v1]
        profileId:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        providerKind:
          $ref: "#/components/schemas/ProviderKind"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
        modelId:
          type: string
        source:
          type: string
        active:
          type: boolean
        default:
          type: boolean
        configured:
          type: boolean
        credentialsReady:
          type: boolean
        runtimeReady:
          type: boolean
        capabilityReady:
          type: boolean
        ready:
          type: boolean
        missing:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessRequirement"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessAction"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessArtifact"
    ReadinessRequirement:
      type: object
      required: [id, label, category, required, ready]
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
          enum: [credential, runtime, capability, model]
        required:
          type: boolean
        ready:
          type: boolean
        missing:
          type: string
    ReadinessAction:
      type: object
      required: [id, label, kind]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [configure_credential, configure_provider, configure_runtime, download_artifact, select_artifact, install_runtime]
        target:
          type: string
    ReadinessArtifact:
      type: object
      required: [id, name, kind, available, selected]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [http, ollama]
        sizeLabel:
          type: string
        sizeBytes:
          type: integer
          format: int64
        available:
          type: boolean
        selected:
          type: boolean
        runtimeReady:
          type: boolean
        runtimeProblem:
          type: string
        recommended:
          type: boolean
    ProviderArtifact:
      type: object
      required: [id, profileId, name, description, sizeLabel, sizeBytes, kind, license, available, selected]
      properties:
        id:
          type: string
        profileId:
          type: string
        name:
          type: string
        description:
          type: string
        sizeLabel:
          type: string
        sizeBytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [http, ollama]
        url:
          type: string
        sha256:
          type: string
        ollamaModel:
          type: string
        license:
          type: string
        available:
          type: boolean
        selected:
          type: boolean
        runtimeReady:
          type: boolean
        runtimeProblem:
          type: string
        recommended:
          type: boolean
    DownloadJob:
      type: object
      required: [id, modelId, profileId, status, progress, bytesDone, totalBytes, statusText]
      properties:
        id:
          type: string
        modelId:
          type: string
        profileId:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        progress:
          type: number
        bytesDone:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        statusText:
          type: string
        error:
          type: string
    ProviderArtifactsResponse:
      type: object
      required: [artifacts, jobs]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderArtifact"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/DownloadJob"
    DictionaryEntry:
      type: object
      required: [spoken, canonical, enabled, usageCount]
      properties:
        id:
          type: integer
          format: int64
        spoken:
          type: string
        canonical:
          type: string
        language:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        usageCount:
          type: integer
    DictionaryResponse:
      type: object
      required: [language, entries]
      properties:
        language:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DictionaryEntry"
    DictionaryImportRequest:
      type: object
      required: [entries]
      properties:
        language:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DictionaryEntry"
    CustomizationMatch:
      type: object
      required: [type, pattern]
      properties:
        type:
          type: string
          enum: [literal, phrase, regex, spoken_alias]
        pattern:
          type: string
        case_sensitive:
          type: boolean
        word_boundary:
          type: boolean
    CustomizationOutput:
      type: object
      properties:
        text:
          type: string
        intent:
          type: string
        template:
          type: string
        payload:
          type: object
          additionalProperties: true
    Word:
      type: object
      required: [term, enabled]
      properties:
        id: { type: string }
        term: { type: string }
        sounds_like:
          type: array
          items: { type: string }
        language: { type: string }
        weight: { type: number }
        tags:
          type: array
          items: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        enabled: { type: boolean }
        usage_count: { type: integer }
    CustomizationScopeRef:
      type: object
      properties:
        kind:
          type: string
          enum: [builtin, app, install, org, workspace, user, session]
        key: { type: string }
    Replacement:
      type: object
      required: [kind, match, output, stage, enabled]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [substitution, synonym, snippet, command, template]
        match:
          $ref: "#/components/schemas/CustomizationMatch"
        output:
          $ref: "#/components/schemas/CustomizationOutput"
        language: { type: string }
        modes:
          type: array
          items:
            type: string
            enum: [dictation, assist, voice_agent]
        stage:
          type: string
          enum: [pre_recognition_cleanup, post_stt, post_llm, output]
        priority: { type: integer }
        tags:
          type: array
          items: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        enabled: { type: boolean }
        usage_count: { type: integer }
    Lexicon:
      type: object
      required: [name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        language: { type: string }
        word_ids:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        enabled: { type: boolean }
    Ruleset:
      type: object
      required: [name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        language: { type: string }
        replacement_ids:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        enabled: { type: boolean }
    WordsResponse:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
    WordsReplaceRequest:
      type: object
      required: [words]
      properties:
        language: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
    ReplacementsResponse:
      type: object
      required: [replacements]
      properties:
        replacements:
          type: array
          items: { $ref: "#/components/schemas/Replacement" }
    VocabularyResponse:
      type: object
      required: [words, replacements]
      properties:
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
        replacements:
          type: array
          items: { $ref: "#/components/schemas/Replacement" }
    VocabularyReplaceRequest:
      type: object
      required: [words]
      properties:
        language: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
        replacements:
          type: array
          items: { $ref: "#/components/schemas/Replacement" }
    ReplacementsReplaceRequest:
      type: object
      required: [replacements]
      properties:
        language: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        replacements:
          type: array
          items: { $ref: "#/components/schemas/Replacement" }
    LexiconsResponse:
      type: object
      required: [lexicons]
      properties:
        lexicons:
          type: array
          items: { $ref: "#/components/schemas/Lexicon" }
    LexiconsReplaceRequest:
      type: object
      required: [lexicons]
      properties:
        language: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        lexicons:
          type: array
          items: { $ref: "#/components/schemas/Lexicon" }
    RulesetsResponse:
      type: object
      required: [rulesets]
      properties:
        rulesets:
          type: array
          items: { $ref: "#/components/schemas/Ruleset" }
    RulesetsReplaceRequest:
      type: object
      required: [rulesets]
      properties:
        language: { type: string }
        scope:
          $ref: "#/components/schemas/CustomizationScopeRef"
        source: { type: string }
        rulesets:
          type: array
          items: { $ref: "#/components/schemas/Ruleset" }
    CustomizationTemplate:
      type: object
      required: [id, version, name, source, builtIn, wordCount, replacementCount]
      properties:
        id: { type: string }
        version: { type: string }
        name: { type: string }
        description: { type: string }
        source: { type: string }
        languages:
          type: array
          items: { type: string }
        modes:
          type: array
          items:
            type: string
            enum: [dictation, assist, voice_agent]
        builtIn: { type: boolean }
        defaultActive: { type: boolean }
        wordCount: { type: integer }
        replacementCount: { type: integer }
    CustomizationTemplatesResponse:
      type: object
      required: [templates, activeTemplateIds]
      properties:
        templates:
          type: array
          items: { $ref: "#/components/schemas/CustomizationTemplate" }
        activeTemplateIds:
          type: array
          items: { type: string }
    CustomizationTemplatesReplaceRequest:
      type: object
      required: [activeTemplateIds]
      properties:
        activeTemplateIds:
          type: array
          items: { type: string }
    CustomizationPack:
      type: object
      properties:
        schema_version:
          type: string
          enum: [speechkit.customization.pack.v1]
        id: { type: string }
        name: { type: string }
        description: { type: string }
        words:
          type: array
          items: { $ref: "#/components/schemas/Word" }
        replacements:
          type: array
          items: { $ref: "#/components/schemas/Replacement" }
        lexicons:
          type: array
          items: { $ref: "#/components/schemas/Lexicon" }
        rulesets:
          type: array
          items: { $ref: "#/components/schemas/Ruleset" }
    VoiceAgentTurn:
      type: object
      required: [role, text]
      properties:
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    VoiceAgentSessionSummary:
      type: object
      required: [summary]
      properties:
        title:
          type: string
        summary:
          type: string
        ideas:
          type: array
          items:
            type: string
        decisions:
          type: array
          items:
            type: string
        openQuestions:
          type: array
          items:
            type: string
        nextSteps:
          type: array
          items:
            type: string
        rawText:
          type: string
    VoiceAgentSession:
      type: object
      required: [id, startedAt, endedAt, summary]
      properties:
        id:
          type: integer
          format: int64
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        language:
          type: string
        providerProfileId:
          type: string
        runtimeKind:
          type: string
          enum: [native_realtime, pipeline_fallback]
        transcript:
          type: string
        turns:
          type: array
          items:
            $ref: "#/components/schemas/VoiceAgentTurn"
        summary:
          $ref: "#/components/schemas/VoiceAgentSessionSummary"
        createdAt:
          type: string
          format: date-time
    RecordingSession:
      type: object
      required: [id, kind, status, captureStatus, summaryStatus, language, startedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        externalId:
          type: string
        kind:
          type: string
          enum: [dictation, meeting]
        status:
          type: string
          enum: [active, finished, failed]
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        summaryStatus:
          type: string
          enum: [idle, running, ready, failed]
        summaryError:
          type: string
        title:
          type: string
        language:
          type: string
        provider:
          type: string
        model:
          type: string
        inputSource:
          type: string
          enum: [microphone, system_loopback, mic_and_system]
        processingMode:
          type: string
          enum: [final_full, segment_batch, provider_stream, auto]
        summary:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        captureStartedAt:
          type: string
          format: date-time
        capturePausedAt:
          type: string
          format: date-time
        captureStoppedAt:
          type: string
          format: date-time
        summaryUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        segments:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSessionSegment"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSessionSnapshot"
    RecordingSessionSegment:
      type: object
      required: [id, sessionId, segmentIndex, text, isFinal, startedMs, endedMs, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        segmentIndex:
          type: integer
        transcriptionId:
          type: integer
          format: int64
        providerItemId:
          type: string
        text:
          type: string
        isFinal:
          type: boolean
        startedMs:
          type: integer
          format: int64
        endedMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    RecordingSessionSnapshot:
      type: object
      required: [id, sessionId, capturedMs, mimeType, sizeBytes, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        capturedMs:
          type: integer
          format: int64
          description: Offset on the meeting's transcript timeline (same time base as segment startedMs/endedMs).
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        monitor:
          type: string
        note:
          type: string
        description:
          type: string
          description: Optional vision-model description (filled by later enrichment).
        createdAt:
          type: string
          format: date-time
    RecordingSessionSnapshotRequest:
      type: object
      properties:
        note:
          type: string
          description: Optional annotation stored with the snapshot.
    RecordingSessionCreateRequest:
      type: object
      properties:
        externalId: { type: string }
        kind:
          type: string
          enum: [dictation, meeting]
        title: { type: string }
        language: { type: string }
        provider: { type: string }
        model: { type: string }
        inputSource:
          type: string
          enum: [microphone, system_loopback, mic_and_system]
        processingMode:
          type: string
          enum: [final_full, segment_batch, provider_stream, auto]
        startedAt:
          type: string
          format: date-time
    RecordingSessionSegmentRequest:
      type: object
      required: [text]
      properties:
        segmentIndex: { type: integer }
        transcriptionId:
          type: integer
          format: int64
        providerItemId: { type: string }
        text: { type: string }
        isFinal: { type: boolean }
        startedMs:
          type: integer
          format: int64
        endedMs:
          type: integer
          format: int64
    RecordingSessionCaptureResponse:
      type: object
      required: [id, status, captureStatus]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [capture_started, capture_paused, capture_resumed, capture_stopped]
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        capture:
          $ref: "#/components/schemas/MeetingCaptureSnapshot"
    RecordingSessionEnhancement:
      type: object
      description: One written-up version of a meeting.
      required: [id, sessionId, templateSlug, status, structured]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        templateSlug:
          type: string
        templateSnapshot:
          type: string
          description: The template as it was when this ran, so an old write-up stays explicable.
        status:
          type: string
          enum: [idle, pending, running, partial, ready, failed, cancelled]
        error:
          type: string
        errorKind:
          type: string
          description: Classification of the failure (transient, quota, consent, ...), empty when it succeeded.
        retryable:
          type: boolean
          description: True when a failed run can be retried without changing anything.
        provider:
          type: string
        model:
          type: string
        stage:
          type: string
          description: What the run is doing right now (finalizing batches, generating, persisting).
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempt:
          type: integer
          description: How many times this write-up has been attempted.
        inputFingerprint:
          type: string
          description: Hash of the transcript and notes this run saw, so a re-run can tell whether the input changed.
        consentVersion:
          type: integer
          description: The version of the transcript-processing grant a cloud provider ran under.
        structured:
          type: boolean
          description: >-
            False when the model could not produce citable structure and the
            notes are prose. Clients surface that rather than implying the
            bullets can be traced back to the transcript.
        contentJson:
          type: string
          description: >-
            The structured document: sections of bullets, each carrying the
            transcript segment ids it came from and, where it came from one of
            the user's own notes, that note's id.
        contentMd:
          type: string
          description: The document rendered for reading, copying and export.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordingSessionSearchHit:
      type: object
      description: One matching session with the first place the query was found.
      required: [session, source, snippet]
      properties:
        session:
          $ref: "#/components/schemas/RecordingSession"
        source:
          type: string
          enum: [title, transcript, notes, write-up]
          description: Where the snippet comes from.
        snippet:
          type: string
    MeetingSummaryBatch:
      type: object
      description: >-
        One rolling digest of a meeting. Transcript-derived, so it follows the
        meeting's deletion and retention lifecycle.
      required: [id, sessionId, batchKey, level, startSegmentId, endSegmentId, sourceFingerprint, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        batchKey:
          type: string
        level:
          type: integer
          description: 0 for a batch over a segment range; higher levels merge lower ones.
        startSegmentId:
          type: integer
          format: int64
        endSegmentId:
          type: integer
          format: int64
        sourceFingerprint:
          type: string
        status:
          type: string
          enum: [sealed, queued, summarizing, ready, delayed, failed, superseded]
        digestJson:
          type: string
          description: The structured digest; present once the batch is ready.
        provider:
          type: string
        model:
          type: string
        errorKind:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingSettings:
      type: object
      description: Meeting Mode settings as stored, plus the local write-up model's readiness.
      required: [enabled, autoDetect, autoEnhance, compactOnStart, alwaysOnTop, generationProvider, generationModel, fallbackPolicy, batchMinutes, summaryLanguage, additionalSummaryLanguages, screenshotEnabled, screenshotHotkey, screenshotHotkeyEnabled, localModelReady]
      properties:
        enabled:
          type: boolean
        autoDetect:
          type: boolean
          description: Offer to take notes when a calling application takes the microphone.
        autoEnhance:
          type: boolean
          description: Write a meeting up automatically once it ends.
        compactOnStart:
          type: boolean
          description: Open the note window as the compact pill.
        alwaysOnTop:
          type: boolean
        generationProvider:
          type: string
          enum: [local, github_copilot]
        generationModel:
          type: string
        fallbackPolicy:
          type: string
          enum: [local_only, allow_local_fallback]
        batchMinutes:
          type: integer
          minimum: 1
          maximum: 30
          description: How often the running transcript is digested into a rolling summary batch.
        summaryLanguage:
          type: string
          description: BCP-47 tag of the primary write-up language, or `auto` to follow the meeting.
        additionalSummaryLanguages:
          type: array
          items:
            type: string
          description: Further BCP-47 tags; each produces its own write-up.
        screenshotEnabled:
          type: boolean
        screenshotHotkey:
          type: string
        screenshotHotkeyEnabled:
          type: boolean
        localModelReady:
          type: boolean
        localModelId:
          type: string
        localModelName:
          type: string
        localModelSizeLabel:
          type: string
    MeetingSettingsPatch:
      type: object
      description: Every field is optional; absent fields keep their value.
      properties:
        enabled:
          type: boolean
        autoDetect:
          type: boolean
        autoEnhance:
          type: boolean
        compactOnStart:
          type: boolean
        alwaysOnTop:
          type: boolean
        generationProvider:
          type: string
          enum: [local, github_copilot]
        generationModel:
          type: string
        fallbackPolicy:
          type: string
          enum: [local_only, allow_local_fallback]
        batchMinutes:
          type: integer
          minimum: 1
          maximum: 30
        summaryLanguage:
          type: string
        additionalSummaryLanguages:
          type: array
          items:
            type: string
        screenshotEnabled:
          type: boolean
        screenshotHotkey:
          type: string
        screenshotHotkeyEnabled:
          type: boolean
    CopilotIntegration:
      type: object
      required: [enabled, model, granted, available, authenticated, models]
      properties:
        enabled:
          type: boolean
        model:
          type: string
        granted:
          type: boolean
          description: Whether the current version of the transcript-processing grant is recorded.
        available:
          type: boolean
          description: Whether the bundled Copilot runtime answered.
        authenticated:
          type: boolean
        login:
          type: string
          description: The signed-in GitHub login when authenticated.
        message:
          type: string
          description: Runtime status text for the settings card.
        models:
          type: array
          items:
            type: string
    CopilotIntegrationPatch:
      type: object
      properties:
        enabled:
          type: boolean
        model:
          type: string
        grantTranscriptProcessing:
          type: boolean
          description: True records the grant; false withdraws it and cancels running write-ups.
    RecordingSessionNotes:
      type: object
      description: >-
        The notes a user typed during a meeting, kept apart from the transcript
        and from generated text. Each block carries the point in the meeting it
        was written at, which is how note enhancement finds the part of the
        conversation a note was about.
      properties:
        sessionId:
          type: integer
          format: int64
        contentMd:
          type: string
          description: The note pane as the user last left it.
        blocks:
          type: array
          items:
            type: object
            required: [id, text, tsMs]
            properties:
              id:
                type: string
                description: Stable for the note's lifetime so enhanced bullets can reference it.
              text:
                type: string
              tsMs:
                type: integer
                format: int64
                description: When the note was written, relative to the meeting's start.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingCaptureSnapshot:
      type: object
      description: >-
        What meeting capture is doing right now, reported by the capture runtime
        itself. A meeting records the microphone and the system loopback as
        separate channels, so channel health is tracked per channel: a meeting
        stays live while one of its channels is failed.
      required: [state, channels]
      properties:
        sessionId:
          type: integer
          format: int64
        state:
          type: string
          enum: [idle, starting, live, paused, finalizing, ended]
        startedAt:
          type: string
          format: date-time
          description: Wall clock all channel timestamps of this meeting are measured from.
        pendingSegments:
          type: integer
          description: Segments submitted for transcription that have not been persisted yet.
        channels:
          type: array
          items:
            type: object
            required: [channel, state]
            properties:
              channel:
                type: string
                enum: [mic, system]
              state:
                type: string
                enum: [idle, recording, paused, stalled, error]
              message:
                type: string
    RecordingSessionStateResponse:
      type: object
      required: [id, live, captureStatus, segmentCount, capture]
      properties:
        id:
          type: integer
          format: int64
        live:
          type: boolean
          description: Whether this session is the one currently being recorded.
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        segmentCount:
          type: integer
        capture:
          $ref: "#/components/schemas/MeetingCaptureSnapshot"
    RecordingSessionSummaryRequest:
      type: object
      properties:
        summary: { type: string }
        endedAt:
          type: string
          format: date-time
    RecordingSessionSummaryResponse:
      type: object
      required: [id, summary, status, generated, persisted]
      properties:
        id:
          type: integer
          format: int64
        summary: { type: string }
        status:
          type: string
          enum: [idle, running, ready, failed]
        error: { type: string }
        generated: { type: boolean }
        persisted: { type: boolean }
    SelectedArtifact:
      type: object
      required: [message, artifactId, profileId]
      properties:
        message:
          type: string
        artifactId:
          type: string
        profileId:
          type: string
    CommandAccepted:
      type: object
      required: [mode, status]
      properties:
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        status:
          type: string
          enum: [accepted]
    ActivatedProfile:
      type: object
      required: [profileId, mode, model]
      properties:
        profileId:
          type: string
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        model:
          type: string
