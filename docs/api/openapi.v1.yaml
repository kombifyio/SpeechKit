  /api/v1/recording-sessions/{sessionId}/summary-batches:
    get:
      tags: [Data]
      operationId: listMeetingSummaryBatches
      summary: List the rolling digests a meeting has been summarized into so far.
      description: >-
        While a meeting runs, its transcript is digested in batches and the
        batches are rolled up into higher levels. Level 0 rows cover a segment
        range each; higher levels merge lower ones. The final write-up starts
        from these digests rather than from the raw transcript.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The meeting's digest batches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingSummaryBatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/{sessionId}/imports:
    get:
      tags: [Data]
      operationId: listRecordingSessionImports
      summary: List what was imported into a meeting from outside services.
      description: >-
        One row per kind at most: the Microsoft Teams transcript import (its
        `contentJson` records whether the transcript was imported or pasted),
        the Copilot recap and the preflight outcome. While the transcript
        import waits, the meeting's write-up waits too.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The meeting's imports.
          content:
            application/json:
              schema:
                type: object
                required: [imports]
                properties:
                  imports:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecordingSessionImport"
  /api/v1/recording-sessions/{sessionId}/preflight:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [Data]
      operationId: runTeamsPreflight
      summary: Check a meeting's Microsoft 365 transcript path once.
      description: >-
        Runs the preflight of a meeting: the silent token and transcript
        permission, the calendar around now, the online meeting behind the call
        and a transcript list on it. A recorded `ready` or `no_teams_meeting`
        is final for the session and answers every later call
        (`cached: true`). The repairable outcomes `signed_out`,
        `admin_consent_required`, `tenant_disabled` and `unavailable` are
        recorded too, so a restart shows the last answer, but a later POST runs
        the preflight again (the one-minute access probe cache is the only
        debounce) and replaces the recorded outcome when it changed. It reads
        only and never blocks a capture; the caller decides what to show.
        `disabled` (the import is off by configuration, policy or the privacy
        scope, or its permission was not given) asks Microsoft 365 nothing and
        is not recorded. Every outcome carries a
        stable localization id in `messageId`. Answers 409 for a session that
        is not a meeting.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsPreflight"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The session is not a meeting.
    get:
      tags: [Data]
      operationId: getTeamsPreflight
      summary: Read a meeting's recorded preflight outcome without running it.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: The recorded outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsPreflight"
        "204":
          description: The meeting has no recorded preflight yet.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/recording-sessions/{sessionId}/transcript-paste:
    post:
      tags: [Data]
      operationId: pasteMeetingTranscript
      summary: Add a pasted or uploaded transcript to a finished meeting.
      description: >-
        For a meeting whose Teams transcript did not arrive. The body is JSON
        (`{"text": "...", "replace": false}`), a plain text or `text/vtt` body,
        or a multipart upload with a `.vtt` in the `file` part (a `replace`
        form field is read as well). WebVTT and the unattributed Teams text
        format are read by the same parser as the Graph import; the cues are
        appended as `teams` segments, so the write-up, the retention sweep and
        OneNote treat a pasted transcript like an imported one, and the
        write-up is queued from it. The transcript text is capped at 16 MB. The
        session records the origin on its `teams_transcript` import row
        (`contentJson`: `origin` imported or pasted, `at`, and for a paste
        `format` and `cues`). An automatic import never overwrites a pasted
        transcript. Refused when the transcript permission is missing, when
        `[microsoft365].import_teams_transcripts` or
        `[microsoft365].allow_transcript_paste` is off, when the session is not
        a finished meeting, or when a transcript is already present and
        `replace` is not true. Emits `meeting.transcript_pasted` (counts only,
        never text).
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: replace
          in: query
          required: false
          schema:
            type: boolean
          description: Replace a transcript that is already there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                replace:
                  type: boolean
          text/plain:
            schema:
              type: string
          text/vtt:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                replace:
                  type: boolean
      responses:
        "200":
          description: The cues were appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteResult"
        "403":
          description: Refused; `reason` is grant_missing, import_off or paste_off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteRefusal"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Refused; `reason` is not_finished or transcript_present, or the session is not a meeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteRefusal"
        "413":
          description: The transcript is larger than 16 MB (`too_large`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteRefusal"
        "415":
          description: The body is neither JSON, text, WebVTT nor multipart (`unsupported_media_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteRefusal"
        "422":
          description: The text holds no readable cue (`unreadable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPasteRefusal"
  /api/v1/recording-sessions/{sessionId}/imports/teams-transcript/retry:
    post:
      tags: [Data]
      operationId: retryTeamsTranscriptImport
      summary: Ask Microsoft 365 for the meeting's Teams transcript again.
      description: >-
        Restarts the wait (45 minutes) and keeps the Teams meeting already
        found in the calendar. Refused with 409 while the import is off or no
        Microsoft 365 account is connected.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The rescheduled import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionImport"
        "409":
          description: The import is off, no account is connected, or a pasted transcript is present.
  /api/v1/recording-sessions/{sessionId}/imports/copilot-recap/retry:
    post:
      tags: [Data]
      operationId: retryCopilotRecapImport
      summary: Ask Microsoft 365 for the meeting's Copilot recap again.
      description: >-
        Restarts the wait (four hours). Refused with 409 while the recap import
        is off or no Microsoft 365 account is connected.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The rescheduled import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionImport"
        "409":
          description: The import is off or no account is connected.
  /api/v1/recording-sessions/{sessionId}/exports:
    get:
      tags: [Data]
      operationId: listRecordingSessionExports
      summary: List the exports of a meeting.
      description: One record per target, with its stable status id.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The meeting's exports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordingSessionExport"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Data]
      operationId: createRecordingSessionExport
      summary: Export a meeting to a target, such as its notebook's OneNote section.
      description: >-
        Builds the page from the newest ready review, the user's notes
        verbatim, the cited transcript lines and the screenshots, and pushes
        it in the background (202 with the pending record). The same content
        is never sent twice; changed content is appended to the stored page.
        A meeting linked to a notebook is also exported on its own once its
        write-up is over while [onenote] enabled is on. A destination outside
        [onenote] allowed_notebook_scope fails with
        sk.export.destination_not_allowed before any request.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingSessionExportRequest"
      responses:
        "202":
          description: The pending export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No ready review, no destination, or an export already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExportRefused"
        "503":
          description: The target is not registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExportRefused"
  /api/v1/recording-sessions/{sessionId}/exports/{exportId}:
    get:
      tags: [Data]
      operationId: getRecordingSessionExport
      summary: Get one export of a meeting.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: exportId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExport"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/recording-sessions/{sessionId}/exports/{exportId}/retry:
    post:
      tags: [Data]
      operationId: retryRecordingSessionExport
      summary: Run an export again.
      description: >-
        Pushes to the linked notebook's destination, or to the destination in
        the body. Answers 202 with the pending record, like the POST.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: exportId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingSessionExportRequest"
      responses:
        "202":
          description: The pending export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No ready review, no destination, or an export already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionExportRefused"
  /api/v1/recording-sessions/{sessionId}/snapshots:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Data]
      operationId: listRecordingSessionSnapshots
      summary: List the screen snapshots captured during a meeting, ordered by timeline offset.
      responses:
        "200":
          description: Screen snapshots of this meeting.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordingSessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Data]
      operationId: captureRecordingSessionSnapshot
      summary: Capture a window the user picks right now into the open notebook of this session.
      description: >-
        The session's notebook must be open (409 otherwise); capture need not
        run. A request over the control plane is not a user gesture, so it
        never captures a whole monitor: the host opens its window picker and
        the answer arrives once the user picked a window (409 with reason
        `cancelled` when the picker is dismissed, `busy` while another
        screenshot is being taken). The process deny list and the window
        protection apply. The snapshot is stamped with the session's
        transcript-timeline offset: the running capture's, the last capture's
        after it stopped, or 0 before capture ever started. A host without a
        window picker answers 501.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingSessionSnapshotRequest"
      responses:
        "200":
          description: Stored screen snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionSnapshot"
        "403":
          description: >-
            The picked window may not be captured: `denied` (its application is on the
            screenshot deny list), `process_unresolved` (a deny list is in force and the
            window's application could not be determined) or `protected` (the window is
            protected from screen capture). Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotRefusal"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/{sessionId}/snapshots/{snapshotId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: snapshotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Data]
      operationId: getRecordingSessionSnapshot
      summary: Read one screen snapshot's metadata.
      responses:
        "200":
          description: Screen snapshot metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Data]
      operationId: deleteRecordingSessionSnapshot
      summary: Delete one screen snapshot, including its image file.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Snapshot deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/{sessionId}/snapshots/{snapshotId}/image:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: snapshotId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Data]
      operationId: getRecordingSessionSnapshotImage
      summary: Stream the snapshot's image bytes.
      responses:
        "200":
          description: Snapshot image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notebooks:
    get:
      tags: [Data]
      operationId: listNotebooks
      summary: List the device's notebook index, newest first.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Notebooks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notebook"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Data]
      operationId: createNotebook
      summary: Add a notebook linked to a OneNote section.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookRequest"
      responses:
        "201":
          description: Created notebook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          description: No display name, an unknown destination kind or a destination without its ids.
          content:
            text/plain:
              schema:
                type: string
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/notebooks/destinations:
    get:
      tags: [Data]
      operationId: listNotebookDestinations
      summary: List the OneNote sections a notebook can be linked to.
      description: >-
        Every section of every notebook in the allowed notebook scope
        ([onenote] allowed_notebook_scope, policy
        OneNote\AllowedNotebookScope): the user's own notebooks, or the one
        named SharePoint site. Listing needs the Microsoft 365 connect level
        notes_readwrite (Notes.ReadWrite). A missing sign-in or consent
        answers 409 with the access state and the connect level that fixes
        it; OneNote turned off or unreachable answers 503, a privacy scope
        without cloud services 403.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Destinations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotebookDestinationOption"
        "403":
          description: The privacy scope does not allow cloud services.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookDestinationsUnavailable"
        "409":
          description: Sign-in or consent needed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookDestinationsUnavailable"
        "503":
          description: No destination source is wired, OneNote is off, or Microsoft 365 is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotebookDestinationsUnavailable"
  /api/v1/notebooks/{notebookId}:
    parameters:
      - name: notebookId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Data]
      operationId: getNotebook
      summary: Get one notebook.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Notebook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Data]
      operationId: updateNotebook
      summary: Rename a notebook or relink it to another destination.
      description: An absent field keeps the stored value.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotebookRequest"
      responses:
        "200":
          description: Updated notebook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notebook"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Data]
      operationId: deleteNotebook
      summary: Remove a notebook from the index; its sessions stay and lose the link.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Notebook deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                    format: int64
                  deleted:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/meeting/snapshot:
    post:
      tags: [Data]
      operationId: captureLiveMeetingSnapshot
      deprecated: true
      summary: Overlay shortcut — capture a window the user picks into whichever meeting is live right now.
      description: |
        Deprecated since v0.68.0 and scheduled for removal in v0.69.0. Every
        response carries `Deprecation: true`, a `Sunset` date and a `Link`
        header with `rel="successor-version"`. Resolve the live meeting via
        `GET /api/v1/recording-sessions?kind=meeting&limit=1` and capture with
        `POST /api/v1/recording-sessions/{sessionId}/snapshots` instead. It
        captures the same way: through the window picker, never a whole
        monitor.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingSessionSnapshotRequest"
      responses:
        "200":
          description: Stored screen snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSessionSnapshot"
        "403":
          description: >-
            The picked window may not be captured: `denied` (its application is on the
            screenshot deny list), `process_unresolved` (a deny list is in force and the
            window's application could not be determined) or `protected` (the window is
            protected from screen capture). Nothing is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotRefusal"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/meeting/summary-readiness:
    get:
      tags: [Data]
      operationId: getMeetingSummaryReadiness
      summary: Can the meeting summary be written right now?
      description: >-
        Preflight for the models bound to meeting synthesis. It never blocks a
        meeting: capture and transcript are unaffected by a provider that
        cannot answer, so a surface warns with this rather than refusing to
        record. `degraded` means a preferred provider is out while another
        candidate still answers.
      responses:
        "200":
          description: The readiness of the summary provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSummaryReadiness"
  /api/v1/desktop/open-settings:
    post:
      tags: [Settings]
      operationId: openDesktopSettings
      summary: Bring the dashboard up on one settings tab.
      description: >-
        The deep link behind a repair offered in an overlay window. Overlay
        windows cannot navigate the dashboard, so they post the tab that owns
        the fix.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tab:
                  type: string
                  enum: [general, integrations, customization, speechkit_server, wake_word, storage, meeting]
      responses:
        "204":
          description: The dashboard was shown.
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/settings/meeting:
    get:
      tags: [Settings]
      operationId: getMeetingSettings
      summary: Read Meeting Mode settings.
      responses:
        "200":
          description: The current Meeting Mode settings plus local write-up model readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSettings"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Settings]
      operationId: patchMeetingSettings
      summary: Change Meeting Mode settings.
      description: >-
        Applies the patch transactionally: an invalid value restores the previous
        settings and answers 400; a screenshot shortcut that collides with
        another hotkey answers 409; Meeting Mode cannot be disabled while a
        meeting is being recorded. Changing the write-up provider, model or
        fallback policy reloads the generation runtime before the response.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeetingSettingsPatch"
      responses:
        "200":
          description: The settings after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/permissions:
    get:
      tags: [Settings]
      operationId: getPlatformPermissions
      summary: Read the operating-system privacy permissions SpeechKit needs.
      description: >-
        macOS keys every TCC grant to the code-signing hash, and SpeechKit's
        macOS builds are ad-hoc signed, so an update revokes Accessibility,
        Input Monitoring and Microphone together while the app keeps running.
        Clients poll this route and recover without a restart. `managed` is
        true only on macOS; every other host reports every permission as
        granted with `canPrompt` false, so a client hides the whole surface on
        that single field. The query never prompts.
      responses:
        "200":
          description: The current permission state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionsSnapshot"
  /api/v1/permissions/request:
    post:
      tags: [Settings]
      operationId: requestPlatformPermission
      summary: Raise the system prompt for one permission, or open its System Settings pane.
      description: >-
        `prompt` raises the macOS dialog; `open-settings` opens System Settings
        at the pane that owns the switch. The microphone prompt waits for the
        user, so the request is bounded to a few seconds and answers as soon as
        the dialog is on screen — the caller polls
        `GET /api/v1/permissions` for the verdict. An unknown id or action is a
        400; a host where `managed` is false answers 409 rather than reporting
        a silent success.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionRequest"
      responses:
        "200":
          description: The request reached the operating system, with the state as it stands now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRequestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/integrations/copilot:
    get:
      tags: [Integrations]
      operationId: getCopilotIntegration
      summary: Read the GitHub Copilot write-up integration.
      description: >-
        Asks the Copilot runtime for its live status, so the answer can take a
        few seconds. Without a runtime on the device the answer is immediate and
        runtime.state says missing, installing or failed. SpeechKit never holds
        a GitHub token; sign-in lives in the Copilot CLI's own credential store.
      responses:
        "200":
          description: Integration settings, grant state and runtime availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotIntegration"
    patch:
      tags: [Integrations]
      operationId: patchCopilotIntegration
      summary: Enable the integration, pick a model, or grant transcript processing.
      description: >-
        Granting records a versioned consent that meeting transcripts may be
        sent to GitHub Copilot for write-ups. Withdrawing the grant also cancels
        running write-ups.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotIntegrationPatch"
      responses:
        "200":
          description: The integration after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotIntegration"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/integrations/copilot/login:
    post:
      tags: [Integrations]
      operationId: startCopilotLogin
      summary: Open the GitHub sign-in in a terminal window.
      description: >-
        Starts `gh auth login --web` in a terminal and returns at once; the
        outcome is not reported back. Clients re-read the integration status
        once the user is done.
      security:
        - ControlPlaneHeader: []
      responses:
        "202":
          description: The sign-in was started.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/integrations/copilot/runtime:
    post:
      tags: [Integrations]
      operationId: installCopilotRuntime
      summary: Download the GitHub Copilot runtime.
      description: >-
        Starts the one-time download of the pinned Copilot CLI (Windows x64) and
        returns at once; the download is verified against pinned SHA-256
        digests before it is installed. Clients poll the integration status for
        runtime.state and progress. Repeated calls share one download.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: A runtime is already installed; the integration status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotIntegration"
        "202":
          description: The download runs in the background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRuntime"
        "403":
          description: The privacy scope blocks cloud downloads.
        "409":
          description: No runtime exists for this platform.
  /api/v1/integrations/copilot/revoke:
    post:
      tags: [Integrations]
      operationId: revokeCopilotGrant
      summary: Withdraw the transcript-processing grant and disable the integration.
      description: Running write-ups on Copilot are cancelled, not just future ones.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: The integration after revocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotIntegration"
  /api/v1/integrations/microsoft365:
    get:
      tags: [Integrations]
      operationId: getMicrosoft365Integration
      summary: Read the Microsoft 365 connection and the Teams transcript import.
      description: >-
        Microsoft 365 signs in with the same app registration as Microsoft
        Foundry but into its own slot, so a Foundry resource in another tenant
        keeps its sign-in. transcriptAccess probes the delegated
        OnlineMeetingTranscript.Read.All permission at most once a minute.
      responses:
        "200":
          description: Connection, transcript access and import settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365Integration"
    patch:
      tags: [Integrations]
      operationId: patchMicrosoft365Integration
      summary: Turn the Teams transcript import on or off, or grant or withdraw its permission.
      description: >-
        Turning the import on requires the recorded permission to copy Teams
        transcripts onto this device (granted in the same patch or earlier);
        otherwise 400. Withdrawing the permission turns the import off.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Microsoft365IntegrationPatch"
      responses:
        "200":
          description: The integration after the patch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365Integration"
        "400":
          description: The import was turned on without the permission.
  /api/v1/integrations/microsoft365/connect:
    post:
      tags: [Integrations]
      operationId: connectMicrosoft365
      summary: Start the Microsoft sign-in in the browser.
      description: >-
        `level: basic` asks for User.Read, Calendars.Read and
        OnlineMeetings.Read, which a user consents to alone. `level:
        transcripts` adds OnlineMeetingTranscript.Read.All, which only a tenant
        admin can consent to. Returns at once; clients follow `connect` in the
        integration status. 403 when the privacy scope forbids cloud services,
        409 while a sign-in runs.
      security:
        - ControlPlaneHeader: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [basic, transcripts, recaps]
      responses:
        "200":
          description: The sign-in started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365Integration"
        "403":
          description: The privacy scope forbids cloud services.
        "409":
          description: A sign-in is already running, or no app registration is configured.
  /api/v1/integrations/microsoft365/disconnect:
    post:
      tags: [Integrations]
      operationId: disconnectMicrosoft365
      summary: Forget the connected Microsoft 365 account.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: The integration after signing out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Microsoft365Integration"
  /api/v1/providers/artifacts:
    get:
      tags: [Providers]
      operationId: getProviderArtifacts
      summary: List downloadable or pullable provider artifacts and current jobs.
      responses:
        "200":
          description: Provider artifact catalog and download jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderArtifactsResponse"
  /api/v1/providers/artifacts/jobs:
    get:
      tags: [Providers]
      operationId: getProviderArtifactJobs
      summary: List provider artifact download jobs.
      responses:
        "200":
          description: Provider artifact jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DownloadJob"
  /api/v1/providers/artifacts/{artifactId}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Providers]
      operationId: downloadProviderArtifact
      summary: Start downloading or pulling a provider artifact.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Download job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/providers/artifacts/{artifactId}/select:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Providers]
      operationId: selectProviderArtifact
      summary: Select an already available provider artifact for its profile.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Provider artifact selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/artifacts/{artifactId}/install:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Providers]
      operationId: installProviderArtifact
      summary: Download or pull a provider artifact without changing any mode's model.
      description: >-
        A downloaded model becomes the model of its on-device engine only when
        that engine has none yet; no mode's model selection changes. An Ollama
        pull needs no activation.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Download job accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/providers/artifacts/{artifactId}/activate:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      tags: [Providers]
      operationId: activateProviderArtifact
      summary: Make an installed model the one its on-device engine runs.
      description: >-
        Modes that already run on the device follow the engine; no mode is
        moved onto the device and no cloud model choice changes.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Provider artifact activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedArtifact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/providers/{profileId}/activate:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
        description: Stable provider profile ID.
    post:
      tags: [Providers]
      operationId: activateProviderProfile
      summary: Activate a provider profile for its mode.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: Activated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /settings/state:
    get:
      tags: [Settings]
      operationId: getSettingsState
      summary: Read the settings the desktop is running with, including the policy-locked fields.
      description: >-
        The same document the reference settings panel renders. Secrets never
        appear in it: credential state is reported as configured flags and a
        database DSN is returned with its password redacted. `policyLockedFields`
        names the configuration keys an administrator policy pins; the host
        rejects a write to them, so a managed UI renders them read-only.
      responses:
        "200":
          description: The settings snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsState"
  /overlay/state:
    get:
      tags: [Modes]
      operationId: getOverlayState
      summary: Read the live dictation, assist and voice agent state the pill renders.
      responses:
        "200":
          description: The overlay snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverlayState"
  /features:
    get:
      tags: [Settings]
      operationId: getFeatures
      summary: Read which capabilities this build and install provide.
      responses:
        "200":
          description: Feature flags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Features"
  /app/version:
    get:
      tags: [Settings]
      operationId: getAppVersion
      summary: Read the running version and, when the update channel is on, the newest release.
      responses:
        "200":
          description: Version and update availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVersion"
  /auth/foundry/status:
    get:
      tags: [Integrations]
      operationId: getFoundryAuthStatus
      summary: Read who is signed in to Microsoft Foundry, through which source, and what the machine has.
      responses:
        "200":
          description: Foundry authentication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundryAuthStatus"
  /auth/foundry/login:
    post:
      tags: [Integrations]
      operationId: startFoundryLogin
      summary: Start a Microsoft Entra sign-in for Foundry as a background job.
      description: >-
        The sign-in blocks on the user (a browser, a device-code page), so the
        route returns a job id at once and clients poll
        `/auth/foundry/login/status`. 403 when the privacy network scope
        forbids cloud services.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [azure_cli, browser, device_code]
                tenantId:
                  type: string
      responses:
        "200":
          description: The sign-in job started.
          content:
            application/json:
              schema:
                type: object
                required: [jobId]
                properties:
                  jobId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/foundry/login/status:
    get:
      tags: [Integrations]
      operationId: getFoundryLoginStatus
      summary: Poll the running Foundry sign-in job.
      responses:
        "200":
          description: Progress of the sign-in job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundryLoginStatus"
  /auth/foundry/logout:
    post:
      tags: [Integrations]
      operationId: foundryLogout
      summary: Forget the Foundry sign-in and fall back to the API key.
      security:
        - ControlPlaneHeader: []
      responses:
        "200":
          description: The authentication status after signing out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundryAuthStatus"
  /api/v1/privacy/export:
    post:
      tags: [Data]
      operationId: exportPrivacyData
      summary: Export the data stored on this device (GDPR Art. 15).
      description: >-
        The desktop keeps one person's data per OS profile, so every accepted
        scope (`install`, `user`, `device`) addresses the same data. `format:
        zip` answers `application/zip` with the JSON manifest and the audio
        files; the default answers JSON. 501 when the storage backend cannot
        export.
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "200":
          description: The exported data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyExportResponse"
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/privacy/delete:
    post:
      tags: [Data]
      operationId: deletePrivacyData
      summary: Erase the data stored on this device (GDPR Art. 17).
      description: >-
        `confirm: true` is mandatory; without it the host answers 400. The
        response reports what was erased, what could not be (`incomplete`) and
        what is deliberately kept (`retained`).
      security:
        - ControlPlaneHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequest"
      responses:
        "200":
          description: The erasure result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyDeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  securitySchemes:
    ControlPlaneHeader:
      type: apiKey
      in: header
      name: X-SpeechKit-Control-Token
      description: Required on every control-plane request, reads included, except the static frontend assets. The per-session token is delivered only to the desktop webview inside its HTML entry and is never returned by an endpoint.
  parameters:
    Mode:
      name: mode
      in: path
      required: true
      schema:
        type: string
        enum:
          - dictation
          - dictate
          - transcribe
          - assist
          - voice_agent
          - voiceAgent
          - voice-agent
      description: Mode name or accepted alias.
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
      description: Stable provider artifact ID from `/api/v1/providers/artifacts`.
    CustomizationLanguage:
      name: language
      in: query
      required: false
      schema:
        type: string
      description: Optional BCP-47 language scope. Implementations normalize region tags to the base language.
    CustomizationScope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [builtin, app, install, org, workspace, user, session]
      description: Optional customization applicability scope. Device Settings defaults to install; user, org, workspace, and session require scope_key.
    CustomizationScopeKey:
      name: scope_key
      in: query
      required: false
      schema:
        type: string
      description: Required key for explicit user, org, workspace, or session scopes.
    CustomizationSource:
      name: source
      in: query
      required: false
      schema:
        type: string
      description: Optional customization provenance such as settings, api, developer, migration, or pack:<id>.
  responses:
    BadRequest:
      description: Invalid request or unsupported profile selection.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Control-plane guard rejected the request.
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: Route, mode, or profile not found.
    Conflict:
      description: Request conflicts with the current mode, session, or capability state.
      content:
        text/plain:
          schema:
            type: string
    NotImplemented:
      description: The configured storage backend does not support this operation.
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: Runtime command bus unavailable.
      content:
        text/plain:
          schema:
            type: string
    ServiceUnavailable:
      description: Runtime command bus or dependent service unavailable.
      content:
        text/plain:
          schema:
            type: string
  schemas:
    Mode:
      type: string
      enum: [none, dictation, assist, voice_agent]
    RuntimeMode:
      type: string
      enum: [none, dictate, assist, voice_agent]
    IntelligenceKind:
      type: string
      enum: [user, utility, brainstorming]
    ProviderKind:
      type: string
      enum: [local_built_in, local_provider, cloud_provider, direct_provider]
    ExecutionMode:
      type: string
      enum: [local, self_hosted_http, hf_routed, openai_api, groq_api, google_api, ollama_local, openrouter_api]
    Capability:
      type: string
      enum:
        - transcription
        - stt
        - audio_input
        - llm
        - tts
        - realtime_audio
        - pipeline_fallback
        - tool_calling
        - dictionary_prompt
        - dictionary_native_hints
        - session_summary
    ModeContract:
      type: object
      required: [mode, intelligence, input, output, allowed, forbidden]
      properties:
        mode:
          $ref: "#/components/schemas/Mode"
        intelligence:
          $ref: "#/components/schemas/IntelligenceKind"
        input:
          type: string
        output:
          type: string
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        forbidden:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
    BaseModeSetting:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        hotkey:
          type: string
        hotkeyBehavior:
          type: string
          enum: [hold_to_talk, push_to_talk, toggle]
          # push_to_talk is the legacy alias for hold_to_talk and is normalised
          # on read; new writes should always use hold_to_talk.
        primaryProfileId:
          type: string
        fallbackProfileId:
          type: string
        modeSource:
          type: string
          enum: [local, server]
    DictationSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [dictionaryEnabled]
          properties:
            dictionaryEnabled:
              type: boolean
    AssistSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [ttsEnabled]
          properties:
            ttsEnabled:
              type: boolean
            utilityRegistry:
              type: string
    VoiceAgentSetting:
      allOf:
        - $ref: "#/components/schemas/BaseModeSetting"
        - type: object
          required: [sessionSummary, pipelineFallback]
          properties:
            sessionSummary:
              type: boolean
            pipelineFallback:
              type: boolean
            closeBehavior:
              type: string
            agentProfileId:
              type: string
            agentSequenceId:
              type: string
    ServerConnectionTarget:
      type: object
      required:
        - id
        - label
        - url
        - authMode
        - bearerTokenSet
        - fallbackToLocal
        - requestTimeoutSec
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        bearerTokenEnv:
          type: string
        bearerTokenSet:
          type: boolean
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
    ServerConnectionSetting:
      type: object
      required: [enabled, url, bearerTokenSet, fallbackToLocal, requestTimeoutSec]
      properties:
        enabled:
          type: boolean
        activeTargetId:
          type: string
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        bearerTokenSet:
          type: boolean
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ServerConnectionTarget"
    ServerConnectionPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        activeTargetId:
          type: string
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        fallbackToLocal:
          type: boolean
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ServerConnectionTarget"
        token:
          type: string
          writeOnly: true
          description: Optional secret value stored locally under bearerTokenEnv.
    ServerConnectionSmokeRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
        bearerTokenEnv:
          type: string
        authMode:
          type: string
          enum: [bearer, api_key]
        token:
          type: string
          writeOnly: true
        requestTimeoutSec:
          type: integer
          minimum: 0
          maximum: 3600
    ServerConnectionSmokeResponse:
      type: object
      required: [ok, status, message]
      properties:
        ok:
          type: boolean
        status:
          type: string
        message:
          type: string
        healthStatus:
          type: integer
        readyStatus:
          type: integer
    ModeSettings:
      type: object
      required: [dictation, assist, voiceAgent, serverConnection]
      properties:
        dictation:
          $ref: "#/components/schemas/DictationSetting"
        assist:
          $ref: "#/components/schemas/AssistSetting"
        voiceAgent:
          $ref: "#/components/schemas/VoiceAgentSetting"
        serverConnection:
          $ref: "#/components/schemas/ServerConnectionSetting"
    ModeSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        hotkey:
          type: string
        hotkeyBehavior:
          type: string
          enum: [hold_to_talk, push_to_talk, toggle]
          # push_to_talk is the legacy alias for hold_to_talk and is normalised
          # on read; new writes should always use hold_to_talk.
        primaryProfileId:
          type: string
        fallbackProfileId:
          type: string
        modeSource:
          type: string
          enum: [local, server]
        dictionaryEnabled:
          type: boolean
        ttsEnabled:
          type: boolean
        sessionSummary:
          type: boolean
        pipelineFallback:
          type: boolean
        closeBehavior:
          type: string
        agentProfileId:
          type: string
        agentSequenceId:
          type: string
    ModesResponse:
      type: object
      required: [contracts, settings]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ModeContract"
        settings:
          $ref: "#/components/schemas/ModeSettings"
    ModelVariant:
      type: object
      required: [id, name, modelId]
      properties:
        id:
          type: string
        name:
          type: string
        modelId:
          type: string
        description:
          type: string
        recommended:
          type: boolean
    ProviderProfile:
      type: object
      required: [id, name, providerKind]
      properties:
        id:
          type: string
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        name:
          type: string
        providerKind:
          $ref: "#/components/schemas/ProviderKind"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
        modelId:
          type: string
        source:
          type: string
        description:
          type: string
        license:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        adapterKind:
          type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ModelVariant"
        inferenceAllowed:
          type: boolean
        default:
          type: boolean
        recommended:
          type: boolean
        experimental:
          type: boolean
    ProviderProfilesResponse:
      type: object
      required: [profiles, activeProfiles, groups, contracts]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProviderProfile"
        activeProfiles:
          type: object
          additionalProperties:
            type: string
        groups:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ModeContract"
    Readiness:
      type: object
      required: [profileId, mode, providerKind, active, default, configured, credentialsReady, runtimeReady, capabilityReady, ready]
      properties:
        schemaVersion:
          type: string
          enum: [provider-readiness.v1]
        profileId:
          type: string
        mode:
          $ref: "#/components/schemas/Mode"
        providerKind:
          $ref: "#/components/schemas/ProviderKind"
        executionMode:
          $ref: "#/components/schemas/ExecutionMode"
        modelId:
          type: string
        source:
          type: string
        active:
          type: boolean
        default:
          type: boolean
        configured:
          type: boolean
        credentialsReady:
          type: boolean
        runtimeReady:
          type: boolean
        capabilityReady:
          type: boolean
        ready:
          type: boolean
        missing:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessRequirement"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessAction"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessArtifact"
    ReadinessRequirement:
      type: object
      required: [id, label, category, required, ready]
      properties:
        id:
          type: string
        label:
          type: string
        category:
          type: string
          enum: [credential, runtime, capability, model]
        required:
          type: boolean
        ready:
          type: boolean
        missing:
          type: string
    ReadinessAction:
      type: object
      required: [id, label, kind]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [configure_credential, configure_provider, configure_runtime, download_artifact, select_artifact, install_runtime]
        target:
          type: string
    ReadinessArtifact:
      type: object
      required: [id, name, kind, available, selected]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [http, ollama]
        sizeLabel:
          type: string
        sizeBytes:
          type: integer
          format: int64
        available:
          type: boolean
        selected:
          type: boolean
        runtimeReady:
          type: boolean
        runtimeProblem:
          type: string
        recommended:
          type: boolean
    ProviderArtifact:
      type: object
      required: [id, profileId, name, description, sizeLabel, sizeBytes, kind, license, available, selected]
      properties:
        id:
          type: string
        profileId:
          type: string
        name:
          type: string
        description:
          type: string
        sizeLabel:
          type: string
        sizeBytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [http, ollama]
        url:
          type: string
        sha256:
          type: string
        ollamaModel:
          type: string
        dir:
          type: string
          description: Directory the files of a multi-file model (a Parakeet model) are installed into; url and sha256 are then empty.
        files:
          type: array
          description: The files of a multi-file model, each verified against its own SHA-256.
          items:
            type: object
            required: [name, url, sha256, sizeBytes]
            properties:
              name:
                type: string
              url:
                type: string
              sha256:
                type: string
              sizeBytes:
                type: integer
                format: int64
        license:
          type: string
        available:
          type: boolean
        selected:
          type: boolean
        runtimeReady:
          type: boolean
        runtimeProblem:
          type: string
        recommended:
          type: boolean
    DownloadJob:
      type: object
      required: [id, modelId, profileId, status, progress, bytesDone, totalBytes, statusText]
      properties:
        id:
          type: string
        modelId:
          type: string
        profileId:
          type: string
        status:
          type: string
          enum: [pending, running, done, failed, cancelled]
        progress:
          type: number
        bytesDone:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        statusText:
          type: string
        error:
          type: string
    ProviderArtifactsResponse:
      type: object
      required: [artifacts, jobs]
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderArtifact"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/DownloadJob"
    DictionaryEntry:
      type: object
      required: [spoken, canonical, enabled, usageCount]
      properties:
        id:
          type: integer
          format: int64
        spoken:
          type: string
        canonical:
          type: string
        language:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        usageCount:
          type: integer
    DictionaryResponse:
      type: object
      required: [language, entries]
      properties:
        language:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DictionaryEntry"
    DictionaryImportRequest:
      type: object
      required: [entries]
      properties:
        language:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DictionaryEntry"
    CustomizationMatch:
      type: object
      required: [type, pattern]
      properties:
        type:
          type: string
          enum: [literal, phrase, regex, spoken_alias]
        pattern:
          type: string
        case_sensitive:
          type: boolean
        word_boundary:
          type: boolean
    CustomizationOutput:
      type: object
