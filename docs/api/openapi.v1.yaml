          description: The meeting's digest batches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeetingSummaryBatch"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
