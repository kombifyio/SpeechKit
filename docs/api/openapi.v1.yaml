    post:
      tags: [Data]
      operationId: captureLiveMeetingSnapshot
      deprecated: true
      summary: Overlay shortcut — capture a screen snapshot into whichever meeting is live right now.
      description: |
        Deprecated since v0.68.0 and scheduled for removal in v0.69.0. Every
