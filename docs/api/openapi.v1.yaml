openapi: 3.1.0
info:
  title: SpeechKit Local Control API
  version: 1.0.0
  summary: Versioned local control plane for SpeechKit v23 mode and provider orchestration.
  description: >
    SpeechKit exposes this API from the local desktop host so external tools can
    inspect mode contracts, manage per-mode settings, select provider profiles,
    check readiness, and start or stop the three strict modes. Read-only GET
    routes are local introspection surfaces; mutating PATCH and POST routes
    declare ControlPlaneHeader or ControlPlaneCookie security.
servers:
  - url: http://127.0.0.1:{port}
    description: Local SpeechKit desktop host
    variables:
      port:
        default: "0"
        description: Runtime-assigned local control-plane port.
security: []
tags:
  - name: Modes
  - name: Server
  - name: Providers
  - name: Data
  - name: Customization
  - name: Settings
  - name: Integrations
paths:
  /api/v1/modes:
    get:
      tags: [Modes]
      operationId: getModes
      summary: List mode contracts and current settings.
      responses:
        "200":
          description: Mode contracts and settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModesResponse"
  /api/v1/modes/{mode}/settings:
    parameters:
      - $ref: "#/components/parameters/Mode"
    get:
      tags: [Modes]
      operationId: getModeSettings
      summary: Read one mode's settings.
      responses:
        "200":
          description: Mode-specific settings.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DictationSetting"
                  - $ref: "#/components/schemas/AssistSetting"
                  - $ref: "#/components/schemas/VoiceAgentSetting"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Modes]
      operationId: patchModeSettings
      summary: Update one mode's settings.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModeSettingsPatch"
      responses:
        "200":
          description: Updated mode-specific settings.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DictationSetting"
                  - $ref: "#/components/schemas/AssistSetting"
                  - $ref: "#/components/schemas/VoiceAgentSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/modes/{mode}/start:
    parameters:
      - $ref: "#/components/parameters/Mode"
    post:
      tags: [Modes]
      operationId: startMode
      summary: Start the selected mode through the command bus.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      responses:
        "200":
          description: Command accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/modes/{mode}/stop:
    parameters:
      - $ref: "#/components/parameters/Mode"
    post:
      tags: [Modes]
      operationId: stopMode
      summary: Stop the selected mode through the command bus.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      responses:
        "200":
          description: Command accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/server-connection:
    get:
      tags: [Server]
      operationId: getServerConnection
      summary: Read the registered SpeechKit server targets and active target.
      responses:
        "200":
          description: Current server connection settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConnectionSetting"
    patch:
      tags: [Server]
      operationId: patchServerConnection
      summary: Update or activate a SpeechKit server target.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerConnectionPatch"
      responses:
        "200":
          description: Updated server connection settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConnectionSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/server-connection/smoke:
    post:
      tags: [Server]
      operationId: smokeTestServerConnection
      summary: Probe a SpeechKit server target with health and readiness checks.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerConnectionSmokeRequest"
      responses:
        "200":
          description: Probe result for the provided server target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerConnectionSmokeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/server-connection/lan:
    get:
      tags: [Server]
      operationId: listLanServers
      summary: Browse `_speechkit._tcp` on the LAN and return dial URLs without credentials.
      responses:
        "200":
          description: SpeechKit servers found on the local network.
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      required: [instanceName, url]
                      properties:
                        instanceName:
                          type: string
                        url:
                          type: string
                        modes:
                          type: array
                          items:
                            type: string
                        version:
                          type: string
  /api/v1/providers/profiles:
    get:
      tags: [Providers]
      operationId: getProviderProfiles
      summary: List provider profiles, active selections, groups, and mode contracts.
      responses:
        "200":
          description: Provider profile catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfilesResponse"
  /api/v1/providers/readiness:
    get:
      tags: [Providers]
      operationId: getProviderReadiness
      summary: List provider readiness for every profile.
      responses:
        "200":
          description: Provider readiness list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Readiness"
  /api/v1/dictionary:
    get:
      tags: [Data]
      operationId: getDictionary
      summary: Export old dictionary-shaped migration entries with usage counts.
      parameters:
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Current migration projection entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryResponse"
    post:
      tags: [Data]
      operationId: importDictionary
      summary: Import old dictionary-shaped entries as a migration projection.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DictionaryImportRequest"
      responses:
        "200":
          description: Updated migration projection entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/customization/words:
    get:
      tags: [Customization]
      operationId: listCustomizationWords
      summary: List Words used for recognition bias.
      parameters:
        - $ref: "#/components/parameters/CustomizationLanguage"
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      responses:
        "200":
          description: Words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordsResponse"
    post:
      tags: [Customization]
      operationId: replaceCustomizationWords
      summary: Replace settings-sourced Words for a language.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordsReplaceRequest"
      responses:
        "200":
          description: Updated Words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordsResponse"
  /api/v1/customization/replacements:
    get:
      tags: [Customization]
      operationId: listCustomizationReplacements
      summary: List Replacements.
      parameters:
        - $ref: "#/components/parameters/CustomizationLanguage"
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      responses:
        "200":
          description: Replacements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplacementsResponse"
    post:
      tags: [Customization]
      operationId: replaceCustomizationReplacements
      summary: Replace settings-sourced Replacements for a language.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacementsReplaceRequest"
      responses:
        "200":
          description: Updated Replacements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplacementsResponse"
  /api/v1/customization/vocabulary:
    get:
      tags: [Customization]
      operationId: getCustomizationVocabulary
      summary: List Words with aliases folded in and leftover Replacements.
      parameters:
        - $ref: "#/components/parameters/CustomizationLanguage"
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      responses:
        "200":
          description: Folded vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyResponse"
    post:
      tags: [Customization]
      operationId: replaceCustomizationVocabulary
      summary: Replace Words and leftover Replacements in one write. Alias synonyms are materialized from Word.sounds_like.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyReplaceRequest"
      responses:
        "200":
          description: Updated folded vocabulary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyResponse"
  /api/v1/customization/lexicons:
    get:
      tags: [Customization]
      operationId: listCustomizationLexicons
      summary: List Lexicons.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      responses:
        "200":
          description: Lexicons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LexiconsResponse"
    post:
      tags: [Customization]
      operationId: replaceCustomizationLexicons
      summary: Replace settings-sourced Lexicons for a language.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LexiconsReplaceRequest"
      responses:
        "200":
          description: Updated Lexicons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LexiconsResponse"
  /api/v1/customization/rulesets:
    get:
      tags: [Customization]
      operationId: listCustomizationRulesets
      summary: List Rulesets.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      responses:
        "200":
          description: Rulesets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetsResponse"
    post:
      tags: [Customization]
      operationId: replaceCustomizationRulesets
      summary: Replace settings-sourced Rulesets for a language.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesetsReplaceRequest"
      responses:
        "200":
          description: Updated Rulesets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetsResponse"
  /api/v1/customization/templates:
    get:
      tags: [Customization]
      operationId: listCustomizationTemplates
      summary: List Native Templates and active selections.
      responses:
        "200":
          description: Customization templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomizationTemplatesResponse"
    post:
      tags: [Customization]
      operationId: replaceActiveCustomizationTemplates
      summary: Replace the active Native Template list.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomizationTemplatesReplaceRequest"
      responses:
        "200":
          description: Active customization templates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomizationTemplatesResponse"
  /api/v1/customization/templates/{templateId}/pack:
    get:
      tags: [Customization]
      operationId: getCustomizationTemplatePack
      summary: Export one Native Template as a Customization Pack.
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Customization template pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomizationPack"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/customization/pack:
    get:
      tags: [Customization]
      operationId: exportCustomizationPack
      summary: Export Words, Replacements, Lexicons, and Rulesets as a pack.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
      responses:
        "200":
          description: Customization pack.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomizationPack"
    post:
      tags: [Customization]
      operationId: importCustomizationPack
      summary: Import a customization pack.
      parameters:
        - $ref: "#/components/parameters/CustomizationScope"
        - $ref: "#/components/parameters/CustomizationScopeKey"
        - $ref: "#/components/parameters/CustomizationSource"
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomizationPack"
      responses:
        "200":
          description: Pack imported.
  /api/v1/voice-sessions:
    get:
      tags: [Data]
      operationId: getVoiceSessions
      summary: List persisted Voice Agent session summaries without heavy transcript detail.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Voice Agent session summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceAgentSession"
  /api/v1/voice-sessions/{sessionId}:
    get:
      tags: [Data]
      operationId: getVoiceSession
      summary: Get one persisted Voice Agent session with transcript, turns, and summary detail.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Voice Agent session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAgentSession"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/recording-sessions:
    get:
      tags: [Data]
      operationId: listRecordingSessions
      summary: List long-running dictation and meeting recording sessions.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [dictation, meeting]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: include_segments
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Recording sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordingSession"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      tags: [Data]
      operationId: createRecordingSession
      summary: Start a long-running dictation or meeting recording session record.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingSessionCreateRequest"
      responses:
        "200":
          description: Created recording session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/search:
    get:
      tags: [Data]
      operationId: searchRecordingSessions
      summary: Find meetings by what was said, typed or written up.
      description: >-
        Every term of the query has to appear somewhere in a session — its
        title, transcript, the user's own notes or a finished write-up. Each hit
        names the first place the query matched so a list can show why the
        meeting is in the results. Segments are omitted from the returned
        sessions.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [dictation, meeting]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Matching sessions with a snippet each.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordingSessionSearchHit"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/{sessionId}:
    get:
      tags: [Data]
      operationId: getRecordingSession
      summary: Get one recording session with ordered segment detail.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Recording session detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSession"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      tags: [Data]
      operationId: deleteRecordingSession
      summary: Delete one recording session and its ordered transcript segments.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Recording session deleted.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                    format: int64
                  deleted:
                    type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/v1/recording-sessions/{sessionId}/enhancements:
    get:
      tags: [Data]
      operationId: listRecordingSessionEnhancements
      summary: List the written-up notes of a meeting, newest first.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The write-ups this meeting has, including runs that failed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecordingSessionEnhancement"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Data]
      operationId: startRecordingSessionEnhancement
      summary: Write this meeting up.
      description: >-
        Merges the transcript, the notes the user typed during the meeting and a
        template into structured notes where each bullet cites the transcript it
        came from. Writing up outlives the request, so the run is returned and
        the client polls the list. Running again with another template or
        language produces a new write-up rather than replacing the previous one.
        With `action: cancel` the request stops a running write-up instead of
        starting one.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateSlug:
                  type: string
                  description: Which template to write up as; empty means the general meeting template.
                language:
                  type: string
                  description: >-
                    BCP-47 tag of the language to write up in. Empty resolves the
                    configured summary language against the meeting's language.
                action:
                  type: string
                  enum: [cancel]
                  description: Cancel the write-up named by `enhancementId` instead of starting one.
                enhancementId:
                  type: integer
                  format: int64
                  description: "The write-up to cancel; required with `action: cancel`."
      responses:
        "200":
          description: >-
            The write-up run that was started, or `{id, cancelled: true}` for a
            cancel request.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RecordingSessionEnhancement"
                  - type: object
                    required: [id, cancelled]
                    properties:
                      id:
                        type: integer
                        format: int64
                      cancelled:
                        type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The write-up named for cancellation is not running.
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/recording-sessions/{sessionId}/enhancements/{enhancementId}/markdown:
    get:
      tags: [Data]
      operationId: getRecordingSessionEnhancementMarkdown
      summary: Download one ready write-up as a Markdown file.
      description: >-
        Renders the write-up as a complete Markdown document under the meeting's
        title. A write-up is only addressable through its own meeting.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: enhancementId
          in: path
          required: true
