  /api/v1/recording-sessions/{sessionId}/summary-job:
    post:
      tags: [Data]
      operationId: startRecordingSessionSummaryJob
      summary: Start an asynchronous provider-capable summary job for ordered final recording-session segments.
      security:
        - ControlPlaneHeader: []
      parameters:
        - name: sessionId
