      summary: Save one ready write-up as a Markdown file where the user chooses.
      description: >-
        The desktop shows its own save dialog and writes the file there. The
        path never comes from the client, so the local API cannot be used to
        write files to arbitrary places. Closing the dialog is not an error.
      security:
        - ControlPlaneHeader: []
        - ControlPlaneCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: enhancementId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Where the file was written, or that the user cancelled.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [path, bytes]
                    properties:
                      path:
                        type: string
                      bytes:
                        type: integer
                  - type: object
                    required: [cancelled]
                    properties:
                      cancelled:
                        type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
