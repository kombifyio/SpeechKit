      summary: Close the notebook of a meeting session and end the session.
      description: >-
        Stops capture when it runs for the session, closes the notebook and
        ends the session the way a finished meeting ends (the end is stored,
        the notepad closes, the write-up and the Teams import start). A
        screenshot still in flight is discarded. Closing a finished session
        answers it unchanged.
      security:
        - ControlPlaneHeader: []
