    RecordingSession:
      type: object
      required: [id, kind, status, captureStatus, summaryStatus, language, startedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        externalId:
          type: string
        kind:
          type: string
          enum: [dictation, meeting]
        status:
          type: string
          enum: [active, finished, failed]
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        summaryStatus:
          type: string
          enum: [idle, running, ready, failed]
        summaryError:
          type: string
        title:
          type: string
        language:
          type: string
        provider:
          type: string
        model:
          type: string
        inputSource:
          type: string
          enum: [microphone, system_loopback, mic_and_system]
        processingMode:
          type: string
          enum: [final_full, segment_batch, provider_stream, auto]
        summary:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        captureStartedAt:
          type: string
          format: date-time
        capturePausedAt:
          type: string
          format: date-time
        captureStoppedAt:
          type: string
          format: date-time
        summaryUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        segments:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSessionSegment"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/RecordingSessionSnapshot"
        notebookId:
          type: integer
          format: int64
          description: The notebook of the index this session belongs to; absent when none.
        open:
          type: boolean
          description: Whether this session is the notebook open on this device, with or without capture.
    RecordingSessionSegment:
      type: object
      required: [id, sessionId, segmentIndex, text, isFinal, startedMs, endedMs, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        segmentIndex:
          type: integer
        transcriptionId:
          type: integer
          format: int64
        providerItemId:
          type: string
        text:
          type: string
        isFinal:
          type: boolean
        startedMs:
          type: integer
          format: int64
        endedMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    RecordingSessionSnapshot:
      type: object
      required: [id, sessionId, capturedMs, mimeType, sizeBytes, width, height, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        capturedMs:
          type: integer
          format: int64
          description: Offset on the meeting's transcript timeline (same time base as segment startedMs/endedMs).
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        monitor:
          type: string
        note:
          type: string
        description:
          type: string
          description: Optional vision-model description (filled by later enrichment).
        createdAt:
          type: string
          format: date-time
    SnapshotRefusal:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [denied, process_unresolved, protected, cancelled, busy]
          description: Why no screenshot was stored. Never names the window or its application.
    RecordingSessionSnapshotRequest:
      type: object
      properties:
        note:
          type: string
          description: Optional annotation stored with the snapshot.
    RecordingSessionCreateRequest:
      type: object
      properties:
        externalId: { type: string }
        kind:
          type: string
          enum: [dictation, meeting]
        title: { type: string }
        language: { type: string }
        provider: { type: string }
        model: { type: string }
        inputSource:
          type: string
          enum: [microphone, system_loopback, mic_and_system]
        processingMode:
          type: string
          enum: [final_full, segment_batch, provider_stream, auto]
        startedAt:
          type: string
          format: date-time
        notebookId:
          type: integer
          format: int64
          description: Link the new session to this notebook of the index.
        open:
          type: boolean
          description: >-
            Open the new meeting session as this device's notebook without
            starting capture (409 while another notebook is open).
    RecordingSessionUpdateRequest:
      type: object
      required: [notebookId]
      additionalProperties: false
      properties:
        notebookId:
          type: [integer, "null"]
          format: int64
          description: A notebook id to link, or null to unlink.
    Notebook:
      type: object
      required: [id, displayName, destination, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        displayName:
          type: string
        destination:
          $ref: "#/components/schemas/NotebookDestination"
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotebookDestination:
      type: object
      required: [kind, notebookId, sectionId]
      properties:
        kind:
          type: string
          enum: [onenote]
        notebookId:
          type: string
          description: The OneNote notebook id.
        sectionId:
          type: string
          description: The OneNote section id pages are written to.
        siteId:
          type: string
          description: >-
            The SharePoint site whose notebooks hold the section; absent for
            the user's own notebooks.
        displayPath:
          type: string
          description: Human-readable location, such as "Work notebook / Meetings".
    NotebookRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
        destination:
          $ref: "#/components/schemas/NotebookDestination"
    NotebookDestinationOption:
      type: object
      required: [kind, notebookId, notebookName, sectionId, sectionName, displayPath]
      properties:
        kind:
          type: string
          enum: [onenote]
        notebookId: { type: string }
        notebookName: { type: string }
        sectionId: { type: string }
        sectionName: { type: string }
        siteId: { type: string }
        displayPath: { type: string }
    NotebookDestinationsUnavailable:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [notebook_destinations_unavailable, notebook_destinations_access]
        access:
          type: string
          description: In the Microsoft 365 settings vocabulary.
          enum: [signed_out, admin_consent_required, scope_blocked, unavailable]
        connectLevel:
          type: string
          description: The connect level that grants what is missing; empty when none helps.
          enum: ["", notes, notes_readwrite]
    RecordingSessionExport:
      type: object
      required: [id, sessionId, targetId, status, statusId, retryable]
      description: >-
        One export of a meeting to one target. Identifiers and states only,
        never content.
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        targetId:
          type: string
          example: onenote
        status:
          type: string
          enum: [pending, synced, failed]
        statusId:
          type: string
          description: Stable localization id of the state.
          enum:
            - sk.export.pending
            - sk.export.synced
            - sk.export.signed_out
            - sk.export.consent_required
            - sk.export.destination_gone
            - sk.export.destination_full
            - sk.export.destination_not_allowed
            - sk.export.too_large
            - sk.export.throttled
            - sk.export.unavailable
            - sk.export.failed
            - sk.export.target_unavailable
        warningId:
          type: string
          description: >-
            Set on a failed export: the meeting's transcript and screenshots
            stay on the device until the sync succeeds or the retention limit
            ends them.
          enum: [sk.export.kept_until_synced]
        retryable:
          type: boolean
          description: A retry can succeed without the user changing anything.
        destinationId:
          type: string
        externalId:
          type: string
          description: The page the destination holds.
        url:
          type: string
        pushedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordingSessionExportRequest:
      type: object
      additionalProperties: false
      properties:
        target:
          type: string
          description: >-
            Export target id (onenote). Defaults to the destination kind of
            the notebook the meeting is linked to.
        destination:
          $ref: "#/components/schemas/ExportDestination"
        allowRollover:
          type: boolean
          description: >-
            Let a full OneNote section roll over to a new section named with
            the year (default true); the linked notebook then follows it.
    ExportDestination:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The section id.
        parentId:
          type: string
          description: The notebook id, needed for a rollover.
        name:
          type: string
        container:
          type: string
          description: The SharePoint site id; empty for the user's own notebooks.
    RecordingSessionExportRefused:
      type: object
      required: [statusId]
      properties:
        statusId:
          type: string
          enum:
            - sk.export.pending
            - sk.export.review_not_ready
            - sk.export.no_destination
            - sk.export.target_unavailable
            - sk.export.failed
    RecordingSessionSegmentRequest:
      type: object
      required: [text]
      properties:
        segmentIndex: { type: integer }
        transcriptionId:
          type: integer
          format: int64
        providerItemId: { type: string }
        text: { type: string }
        isFinal: { type: boolean }
        startedMs:
          type: integer
          format: int64
        endedMs:
          type: integer
          format: int64
    RecordingSessionCaptureResponse:
      type: object
      required: [id, status, captureStatus]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [capture_started, capture_paused, capture_resumed, capture_stopped]
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        capture:
          $ref: "#/components/schemas/MeetingCaptureSnapshot"
    RecordingSessionEnhancement:
      type: object
      description: One written-up version of a meeting.
      required: [id, sessionId, templateSlug, status, structured]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        templateSlug:
          type: string
        templateSnapshot:
          type: string
          description: The template as it was when this ran, so an old write-up stays explicable.
        status:
          type: string
          enum: [idle, pending, running, partial, ready, failed, cancelled]
        error:
          type: string
        errorKind:
          type: string
          description: Classification of the failure (transient, quota, consent, ...), empty when it succeeded.
        retryable:
          type: boolean
          description: True when a failed run can be retried without changing anything.
        provider:
          type: string
        model:
          type: string
        stage:
          type: string
          description: What the run is doing right now (finalizing batches, generating, persisting).
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempt:
          type: integer
          description: How many times this write-up has been attempted.
        inputFingerprint:
          type: string
          description: Hash of the transcript and notes this run saw, so a re-run can tell whether the input changed.
        consentVersion:
          type: integer
          description: The version of the transcript-processing grant a cloud provider ran under.
        structured:
          type: boolean
          description: >-
            False when the model could not produce citable structure and the
            notes are prose. Clients surface that rather than implying the
            bullets can be traced back to the transcript.
        contentJson:
          type: string
          description: >-
            The structured document: sections of bullets, each carrying the
            transcript segment ids it came from and, where it came from one of
            the user's own notes, that note's id.
        contentMd:
          type: string
          description: The document rendered for reading, copying and export.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordingSessionSearchHit:
      type: object
      description: One matching session with the first place the query was found.
      required: [session, source, snippet]
      properties:
        session:
          $ref: "#/components/schemas/RecordingSession"
        source:
          type: string
          enum: [title, transcript, notes, write-up]
          description: Where the snippet comes from.
        snippet:
          type: string
    MeetingSummaryBatch:
      type: object
      description: >-
        One rolling digest of a meeting. Transcript-derived, so it follows the
        meeting's deletion and retention lifecycle.
      required: [id, sessionId, batchKey, level, startSegmentId, endSegmentId, sourceFingerprint, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        batchKey:
          type: string
        level:
          type: integer
          description: 0 for a batch over a segment range; higher levels merge lower ones.
        startSegmentId:
          type: integer
          format: int64
        endSegmentId:
          type: integer
          format: int64
        sourceFingerprint:
          type: string
        status:
          type: string
          enum: [sealed, queued, summarizing, ready, delayed, failed, superseded]
        digestJson:
          type: string
          description: The structured digest; present once the batch is ready.
        provider:
          type: string
        model:
          type: string
        errorKind:
          type: string
          description: >-
            Why a delayed or failed batch is not ready — `authentication`,
            `consent`, `quota`, `configuration`, `context_limit`,
            `invalid_output`, `transient` or `permanent`. The desktop surfaces
            name the cause and offer the settings card that repairs it.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingSummaryReadiness:
      type: object
      description: >-
        Whether the meeting summary provider can be reached with the
        credentials stored right now.
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, degraded, blocked]
          description: >-
            `degraded` means summaries still arrive, from a weaker model that
            the chain falls through to.
        reason:
          type: string
          enum: [no_generator, no_model, signed_out, no_grant]
        provider:
          type: string
        model:
          type: string
        action:
          type: string
          enum: [open_integrations, open_meeting_settings]
          description: The settings tab that repairs the reason.
    MeetingProviderId:
      type: string
      enum: [local, foundry, github_copilot]
      description: >-
        `local` runs only on models on this device; the transcript never leaves it. `foundry` is the
        Microsoft Foundry utility deployment and needs the meeting transcript permission. `github_copilot`
        needs the Copilot cloud-processing grant from its integration.
    MeetingProviderSummary:
      type: object
      required: [id, model, available, cloud, granted]
      properties:
        id:
          $ref: '#/components/schemas/MeetingProviderId'
        model:
          type: string
          description: Model or deployment that writes the meeting up; empty means the account default.
        available:
          type: boolean
          description: Set up on this device and not blocked by the privacy scope.
        cloud:
          type: boolean
          description: The transcript leaves the device.
        granted:
          type: boolean
          description: Transcript-processing permission; always true for `local`.
        endpoint:
          type: string
          description: Host the transcript is sent to, when known.
    MeetingSettings:
      type: object
      description: Meeting Mode settings as stored, plus the local write-up model's readiness.
      required: [enabled, autoDetect, autoEnhance, compactOnStart, alwaysOnTop, generationProvider, fallbackProviders, providers, batchMinutes, summaryLanguage, additionalSummaryLanguages, screenshotEnabled, screenshotHotkey, screenshotHotkeyEnabled, captureChannels, localModelReady]
      properties:
        enabled:
          type: boolean
        autoDetect:
          type: boolean
          description: Offer to take notes when a calling application takes the microphone.
        autoEnhance:
          type: boolean
          description: Write a meeting up automatically once it ends.
        compactOnStart:
          type: boolean
          description: Open the note window as the compact pill.
        alwaysOnTop:
          type: boolean
        generationProvider:
          $ref: '#/components/schemas/MeetingProviderId'
        fallbackProviders:
          type: array
          items:
            $ref: '#/components/schemas/MeetingProviderId'
          description: Tried in this order when the primary provider fails. Never contains the primary.
        providers:
          type: array
          items:
            $ref: '#/components/schemas/MeetingProviderSummary'
          description: One entry per provider, in the order the settings page offers them.
        batchMinutes:
          type: integer
          minimum: 1
          maximum: 30
          description: How often the running transcript is digested into a rolling summary batch.
        summaryLanguage:
          type: string
          description: BCP-47 tag of the primary write-up language, or `auto` to follow the meeting.
        additionalSummaryLanguages:
          type: array
          items:
            type: string
          description: Further BCP-47 tags; each produces its own write-up.
        screenshotEnabled:
          type: boolean
        screenshotHotkey:
          type: string
        screenshotHotkeyEnabled:
          type: boolean
        captureChannels:
          type: array
          items:
            type: string
            enum: [mic, system]
          description: >-
            The sources a meeting records, as resolved: the configured list, or both `mic` and
            `system` when none is configured. One entry runs a single capture session (the system
            loopback is never opened with `["mic"]`) and the channel health reports one row.
            Pinned by the machine policy `Meeting\CaptureChannels`.
        localModelReady:
          type: boolean
        localModelId:
          type: string
        localModelName:
          type: string
        localModelSizeLabel:
          type: string
    MeetingSettingsPatch:
      type: object
      description: Every field is optional; absent fields keep their value.
      properties:
        enabled:
          type: boolean
        autoDetect:
          type: boolean
        autoEnhance:
          type: boolean
        compactOnStart:
          type: boolean
        alwaysOnTop:
          type: boolean
        generationProvider:
          $ref: '#/components/schemas/MeetingProviderId'
        fallbackProviders:
          type: array
          items:
            $ref: '#/components/schemas/MeetingProviderId'
        foundryTranscriptGrant:
          type: boolean
          description: >-
            Grants (true) or revokes (false) permission to send meeting transcripts to Microsoft
            Foundry. A patch that makes Foundry the provider or a fallback is rejected with 400 unless
            the permission is recorded or granted in the same patch. Revoking cancels running write-ups.
        batchMinutes:
          type: integer
          minimum: 1
          maximum: 30
        summaryLanguage:
          type: string
        additionalSummaryLanguages:
          type: array
          items:
            type: string
        screenshotEnabled:
          type: boolean
        screenshotHotkey:
          type: string
        screenshotHotkeyEnabled:
          type: boolean
        captureChannels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [mic, system]
          description: >-
            Channels to record from the next meeting on. Unknown names and an empty list answer
            400; a change under the `Meeting\CaptureChannels` pin answers 403.
    Microsoft365Integration:
      type: object
      required: [available, scopeBlocked, signedIn, transcriptAccess, importTeamsTranscripts, allowTranscriptPaste, granted, recapAccess, importCopilotRecaps, recapGranted, connect]
      properties:
        available:
          type: boolean
          description: False when no Entra app registration is configured.
        scopeBlocked:
          type: boolean
          description: The privacy scope forbids cloud services.
        signedIn:
          type: boolean
        user:
          type: string
        tenantId:
          type: string
        transcriptAccess:
          type: string
          enum: [granted, admin_consent_required, signed_out, unavailable]
        adminConsentUrl:
          type: string
          description: Set with admin_consent_required; the page a tenant admin opens to approve access.
        importTeamsTranscripts:
          type: boolean
        allowTranscriptPaste:
          type: boolean
          description: A transcript can be pasted into a finished meeting; it also needs the import and its permission.
        granted:
          type: boolean
          description: The versioned permission to copy Teams transcripts onto this device is recorded.
        recapAccess:
          type: string
          enum: [granted, admin_consent_required, signed_out, unavailable]
          description: Access to Microsoft 365 Copilot meeting insights (OnlineMeetingAiInsight.Read.All).
        importCopilotRecaps:
          type: boolean
        recapGranted:
          type: boolean
          description: The recorded permission is of a version that covers Copilot recaps (2 or later).
        connect:
          type: object
          required: [running, done]
          properties:
            running:
              type: boolean
            done:
              type: boolean
            error:
              type: string
    Microsoft365IntegrationPatch:
      type: object
      properties:
        importTeamsTranscripts:
          type: boolean
        importCopilotRecaps:
          type: boolean
        allowTranscriptPaste:
          type: boolean
        grantTranscriptImport:
          type: boolean
          description: >-
            Grants (true) the current permission, covering Teams transcripts and
            Copilot recaps, or withdraws (false) it, which turns both imports off.
    TeamsPreflight:
      type: object
      required: [sessionId, outcome, messageId, cached]
      properties:
        sessionId:
          type: integer
          format: int64
        outcome:
          type: string
          enum: [ready, no_teams_meeting, signed_out, admin_consent_required, tenant_disabled, disabled, unavailable]
        messageId:
          type: string
          description: >-
            Stable localization id of the sentence for the outcome:
            sk.meeting.preflight.<outcome>.
        adminConsentUrl:
          type: string
          description: Set with admin_consent_required; the page a tenant admin opens.
        checkedAt:
          type: string
          format: date-time
          description: When Microsoft 365 was asked; absent for disabled.
        cached:
          type: boolean
          description: A final outcome (ready or no_teams_meeting) of an earlier call answers.
    TranscriptPasteResult:
      type: object
      required: [sessionId, origin, format, cues, replaced]
      properties:
        sessionId:
          type: integer
          format: int64
        origin:
          type: string
          enum: [pasted]
        format:
          type: string
          enum: [webvtt, teams_text]
        cues:
          type: integer
          description: Cues appended as teams segments.
        replaced:
          type: boolean
    TranscriptPasteRefusal:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
          enum: [transcript_paste_refused]
        reason:
          type: string
          enum: [grant_missing, import_off, paste_off, not_finished, transcript_present, too_large, unreadable, unsupported_media_type]
        messageId:
          type: string
          description: Stable localization id, sk.meeting.paste.refused.<reason>; absent for unsupported_media_type.
    RecordingSessionImport:
      type: object
      required: [id, sessionId, kind, status, attempts, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [teams_transcript, copilot_recap, teams_preflight]
        status:
          type: string
          enum: [waiting, imported, unavailable, failed, cancelled]
        attempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        externalMeetingId:
          type: string
        externalItemId:
          type: string
          description: Comma-separated ids of the Teams transcripts imported.
        subject:
          type: string
        contentJson:
          type: string
          description: >-
            For copilot_recap, the recap as JSON ({notes:[{title,text,subpoints}], actionItems:[{title,text,owner}]}).
            For teams_transcript, the origin ({origin: imported | pasted, at, and for a paste format and cues}).
            For teams_preflight, the outcome ({outcome, checkedAt}).
        errorKind:
          type: string
          description: >-
            Why no content arrived: no_teams_meeting, no_transcript, no_recap,
            tenant_disabled, consent_required, signed_out, not_found, throttled,
            transient, permanent, import_disabled or store.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CopilotIntegration:
      type: object
      required: [enabled, model, granted, available, authenticated, models, runtime]
      properties:
        enabled:
          type: boolean
        model:
          type: string
        runtime:
          $ref: "#/components/schemas/CopilotRuntime"
        granted:
          type: boolean
          description: Whether the current version of the transcript-processing grant is recorded.
        available:
          type: boolean
          description: Whether the Copilot runtime answered.
        authenticated:
          type: boolean
        login:
          type: string
          description: The signed-in GitHub login when authenticated.
        message:
          type: string
          description: Runtime status text for the settings card.
        models:
          type: array
          items:
            type: string
    CopilotRuntime:
      type: object
      required: [state, downloadBytes, doneBytes, totalBytes]
      properties:
        state:
          type: string
          enum: [ready, missing, installing, failed, unsupported]
          description: >-
            ready: a Copilot CLI is on the device; missing: it is not
            downloaded yet; installing: the download runs; failed: the last
            download failed (see error); unsupported: no runtime exists for
            this platform.
        version:
          type: string
        downloadBytes:
          type: integer
          format: int64
          description: Size of the one-time download.
        doneBytes:
          type: integer
          format: int64
        totalBytes:
          type: integer
          format: int64
        error:
          type: string
          description: The last download failure, until the next attempt starts.
    CopilotIntegrationPatch:
      type: object
      properties:
        enabled:
          type: boolean
        model:
          type: string
        grantTranscriptProcessing:
          type: boolean
          description: True records the grant; false withdraws it and cancels running write-ups.
    RecordingSessionNotes:
      type: object
      description: >-
        The notes a user typed during a meeting, kept apart from the transcript
        and from generated text. Each block carries the point in the meeting it
        was written at, which is how note enhancement finds the part of the
        conversation a note was about.
      properties:
        sessionId:
          type: integer
          format: int64
        contentMd:
          type: string
          description: The note pane as the user last left it.
        blocks:
          type: array
          items:
            type: object
            required: [id, text, tsMs]
            properties:
              id:
                type: string
                description: Stable for the note's lifetime so enhanced bullets can reference it.
              text:
                type: string
              tsMs:
                type: integer
                format: int64
                description: When the note was written, relative to the meeting's start.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MeetingCaptureSnapshot:
      type: object
      description: >-
        What meeting capture is doing right now, reported by the capture runtime
        itself. A meeting records the microphone and the system loopback as
        separate channels, so channel health is tracked per channel: a meeting
        stays live while one of its channels is failed.
      required: [state, channels]
      properties:
        sessionId:
          type: integer
          format: int64
        state:
          type: string
          enum: [idle, starting, live, paused, finalizing, ended]
        startedAt:
          type: string
          format: date-time
          description: Wall clock all channel timestamps of this meeting are measured from.
        pendingSegments:
          type: integer
          description: Segments submitted for transcription that have not been persisted yet.
        channels:
          type: array
          items:
            type: object
            required: [channel, state]
            properties:
              channel:
                type: string
                enum: [mic, system]
              state:
                type: string
                enum: [idle, recording, paused, stalled, error]
              message:
                type: string
    RecordingSessionStateResponse:
      type: object
      required: [id, live, open, captureStatus, segmentCount, capture]
      properties:
        id:
          type: integer
          format: int64
        live:
          type: boolean
          description: Whether this session is the one currently being recorded.
        open:
          type: boolean
          description: Whether this session is the notebook open on this device, with or without capture.
        captureStatus:
          type: string
          enum: [idle, recording, paused, stopped]
        segmentCount:
          type: integer
        capture:
          $ref: "#/components/schemas/MeetingCaptureSnapshot"
    RecordingSessionSummaryRequest:
      type: object
      properties:
        summary: { type: string }
        endedAt:
          type: string
          format: date-time
    RecordingSessionSummaryResponse:
      type: object
      required: [id, summary, status, generated, persisted]
      properties:
        id:
          type: integer
          format: int64
        summary: { type: string }
        status:
          type: string
          enum: [idle, running, ready, failed]
        error: { type: string }
        generated: { type: boolean }
        persisted: { type: boolean }
    SelectedArtifact:
      type: object
      required: [message, artifactId, profileId]
      properties:
        message:
          type: string
        artifactId:
          type: string
        profileId:
          type: string
    CommandAccepted:
      type: object
      required: [mode, status]
      properties:
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        status:
          type: string
          enum: [accepted]
    Permission:
      type: object
      required: [id, label, status, required, canPrompt, reason, detail]
      properties:
        id:
          type: string
          enum: [accessibility, inputMonitoring, microphone]
        label:
          type: string
        status:
          type: string
          enum: [granted, denied, not-determined, restricted, unknown]
        required:
          type: boolean
        canPrompt:
          type: boolean
          description: Whether action "prompt" can still put a system dialog on screen.
        reason:
          type: string
          description: One sentence about what is missing; empty when granted.
        detail:
          type: string
          description: What the permission buys. Always present.
    PermissionsSnapshot:
      type: object
      required: [schemaVersion, platform, managed, secureInputActive, permissions]
      properties:
        schemaVersion:
          type: integer
        platform:
          type: string
          description: runtime.GOOS of the desktop host.
        managed:
          type: boolean
          description: True only where the operating system gates these permissions.
        secureInputActive:
          type: boolean
          description: A password field holds the keyboard, so no synthetic keystroke is delivered. No grant lifts it.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    PermissionRequest:
      type: object
      required: [id, action]
      properties:
        id:
          type: string
          enum: [accessibility, inputMonitoring, microphone]
        action:
          type: string
          enum: [prompt, open-settings]
    PermissionRequestResult:
      type: object
      required: [prompted, snapshot]
      properties:
        prompted:
          type: boolean
          description: The operating system accepted the request. It says nothing about the answer.
        snapshot:
          $ref: "#/components/schemas/PermissionsSnapshot"
    ActivatedProfile:
      type: object
      required: [profileId, mode, model]
      properties:
        profileId:
          type: string
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        model:
          type: string
    SettingsState:
      type: object
      description: >-
        The settings snapshot. Only the fields a managed UI branches on are
        listed; the document carries more (profiles, provider credential
        states, hotkeys) and clients must ignore unknown keys.
      properties:
        language:
          type: string
          description: BCP-47 UI and speech language.
        saveAudio:
          type: boolean
        audioRetentionDays:
          type: integer
        dictationProcessingMode:
          type: string
        activeMode:
          type: string
        modeEnabled:
          $ref: "#/components/schemas/ModeAvailability"
        availableModes:
          $ref: "#/components/schemas/ModeAvailability"
        privacy:
          type: object
          properties:
            networkScope:
              type: string
              description: The network scope the privacy settings select.
            allowSetupTraffic:
              type: boolean
        policyLockedFields:
          type: array
          items:
            type: string
          description: Configuration keys an administrator policy pins. Absent when none is.
      additionalProperties: true
    ModeAvailability:
      type: object
      properties:
        dictate:
          type: boolean
        assist:
          type: boolean
        voice_agent:
          type: boolean
      additionalProperties: true
    OverlayState:
      type: object
      required: [state, phase, text, level, visible, activeMode, meetingActive]
      properties:
        platform:
          type: string
          description: The operating system the host runs on (runtime.GOOS).
        hotkeyPermission:
          type: string
        state:
          type: string
        phase:
          type: string
        text:
          type: string
        level:
          type: number
        visible:
          type: boolean
        activeMode:
          type: string
        meetingActive:
          type: boolean
        lastTranscription:
          type: string
        transcriptDraft:
          type: string
        speechLanguage:
          type: string
        mainLanguage:
          type: string
        modeEnabled:
          $ref: "#/components/schemas/ModeAvailability"
        availableModes:
          $ref: "#/components/schemas/ModeAvailability"
        auditDegraded:
          type: boolean
          description: Audit forwarding is required but failing; cloud sessions are refused.
      additionalProperties: true
    Features:
      type: object
      required: [cloudMode, hasAuth, hasCloudStore, loggedIn, plan, installMode, bitlocker]
      properties:
        cloudMode:
          type: boolean
        hasAuth:
          type: boolean
        hasCloudStore:
          type: boolean
        loggedIn:
          type: boolean
        plan:
          type: string
        installMode:
          type: string
        bitlocker:
          type: string
          enum: [protected, unprotected, unknown]
    AppVersion:
      type: object
      required: [version, updateCheckEnabled]
      properties:
        version:
          type: string
        updateCheckEnabled:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        latestVersion:
          type: string
        updateURL:
          type: string
        installMode:
          type: string
        manualDownloadRequired:
          type: boolean
        adminManaged:
          type: boolean
          description: Reported only; this client never installs an admin-managed update.
        updateNote:
          type: string
        downloadURL:
          type: string
        downloadSizeBytes:
          type: integer
          format: int64
        assetName:
          type: string
        verification:
          type: string
        publisherVerified:
          type: boolean
    FoundryAccount:
      type: object
      properties:
        user:
          type: string
        tenantId:
          type: string
        tenantName:
          type: string
        subscriptionName:
          type: string
    FoundryAuthStatus:
      type: object
      required: [authMode, entraCredential, signedIn, browserAvailable, azureCli, projectEndpoint, endpointValid, keyConfigured]
      properties:
        authMode:
          type: string
        entraCredential:
          type: string
        signedIn:
          type: boolean
          description: An Entra identity is usable right now.
        source:
          type: string
          enum: [azure_cli, browser, device_code, client_secret]
        account:
          $ref: "#/components/schemas/FoundryAccount"
        browserAvailable:
          type: boolean
        browserUnavailableReason:
          type: string
        clientIdSource:
          type: string
          enum: [config, env, build]
        signedOutReason:
          type: string
        clientSecretConfigured:
          type: boolean
        clientSecretError:
          type: string
        azureCli:
          type: object
          required: [found, signedIn, installSupported]
          properties:
            found:
              type: boolean
            path:
              type: string
            version:
              type: string
            source:
              type: string
            signedIn:
              type: boolean
            account:
              $ref: "#/components/schemas/FoundryAccount"
            installSupported:
              type: boolean
            error:
              type: string
            checkedAt:
              type: string
        scopeBlocked:
          type: string
          description: Present when the privacy network scope blocks cloud sign-in.
        projectEndpoint:
          type: string
        endpointValid:
          type: boolean
        keyConfigured:
          type: boolean
    FoundryLoginStatus:
      type: object
      required: [running, done]
      properties:
        running:
          type: boolean
        done:
          type: boolean
        error:
          type: string
        deviceCode:
          type: object
          required: [code, url]
          properties:
            code:
              type: string
            url:
              type: string
        account:
          $ref: "#/components/schemas/FoundryAccount"
        source:
          type: string
          enum: [azure_cli, browser, device_code, client_secret]
    PrivacyRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [install, user, device]
        user_sid:
          type: string
          description: Recorded in the audit event as the subject the requester named; it does not select rows.
        format:
          type: string
          enum: [json, zip]
          description: Export only. Defaults to json.
        confirm:
          type: boolean
          description: Delete only. Must be true.
    PrivacyExportResponse:
      type: object
      required: [export]
      properties:
        export:
          type: object
          description: The scope export (transcriptions, quick notes, voice agent sessions, recording sessions, dictionary entries).
          additionalProperties: true
    PrivacyDeleteResponse:
      type: object
      required: [rows_deleted, audio_files_attempted, audio_files_removed, snapshot_files_attempted, snapshot_files_removed, requested_scope, scope_key, compacted, retained]
      properties:
        rows_deleted:
          type: integer
        audio_files_attempted:
          type: integer
        audio_files_removed:
          type: integer
        snapshot_files_attempted:
          type: integer
        snapshot_files_removed:
          type: integer
        requested_scope:
          type: string
        scope_key:
          type: string
        other_files_removed:
          type: object
          additionalProperties:
            type: integer
        incomplete:
          type: array
          items:
            type: string
        compacted:
          type: boolean
        retained:
          type: array
          items:
            type: string
