# golangci-lint v2 config. Requires golangci-lint >= v2.0.0.
# Run locally: golangci-lint run ./...
# Auto-fix: golangci-lint run --fix ./...
#
# gofmt and goimports are run as separate CI/lefthook steps, not via
# golangci-lint. gosimple is covered by staticcheck.

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    # Baseline correctness
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errcheck
    # Security
    - gosec
    # Error handling discipline
    - errorlint
    - bodyclose
    - rowserrcheck
    - noctx
    # Style and defensive checks
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - nilerr
    - makezero
    - contextcheck
    - exhaustive

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        # Flush/Sync on stdout/stderr is idiomatic to ignore.
        - (os.File).Sync
        - (*os.File).Sync
    gosec:
      excludes:
        # G104: errors unhandled. errcheck reports this with better signal.
        - G104
        # G101: hardcoded credentials. Existing hits are secret/env key names,
        # not credential values.
        - G101
        # G704: SSRF via tainted endpoint. All provider HTTP is built through
        # netsec.BuildEndpoint and dialed via netsec.NewSafeHTTPClient, which
        # validate the host at dial time, so the tainted-URL path is mitigated.
        - G704
      config:
        global:
          audit: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
          disabled: true
        - name: var-declaration
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
        - unnamedResult
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    paths:
      - frontend
      - Website
      - marketing-site-svelte
      - android
      - internal/frontendassets
      - scripts
      - installer
      - docker
      - docs
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - errorlint
          - gocritic
          - gosec
          - noctx
          - contextcheck
          - bodyclose
          - unparam
          - rowserrcheck
      # Test helpers conventionally lead with *testing.T before ctx; the
      # context-first rule is a production convention, not a test one.
      - path: _test\.go
        text: context-as-argument
        linters:
          - revive
      - path: internal/winapi/
        linters:
          - revive
          - gocritic
      - path: internal/audio/.*_windows_cgo\.go
        linters:
          - gocritic
          - unconvert
      - path: internal/vad/
        linters:
          - revive

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
