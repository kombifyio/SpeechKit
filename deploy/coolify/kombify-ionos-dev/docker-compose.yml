name: speechkit-kombify-ionos-dev

services:
  speechkit-init:
    image: ${SPEECHKIT_SERVER_IMAGE:?set SPEECHKIT_SERVER_IMAGE in Coolify}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /var/lib/speechkit/data /var/lib/speechkit/models
        chown -R 2000:2000 /var/lib/speechkit/data /var/lib/speechkit/models
    volumes:
      - speechkit-data:/var/lib/speechkit/data
      - speechkit-models:/var/lib/speechkit/models
    restart: "no"

  speechkit-whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    environment:
      SPEECHKIT_WHISPER_MODEL: ${SPEECHKIT_SELFHOSTED_WHISPER_MODEL:-large-v3-turbo}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        model="$${SPEECHKIT_WHISPER_MODEL:-large-v3-turbo}"
        model_path="/models/ggml-$${model}.bin"
        if [ ! -f "$${model_path}" ]; then
          ./models/download-ggml-model.sh "$${model}" /models
        fi
        mkdir -p /public/v1
        printf '{"object":"list","data":[{"id":"whisper-1","object":"model"}]}' > /public/v1/models
        exec whisper-server --host 0.0.0.0 --port 8080 --convert --request-path /v1 --inference-path /audio/transcriptions --public /public -m "$${model_path}"
    expose:
      - "8080"
    volumes:
      - speechkit-models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/models >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  speechkit-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - --hf-repo
      - ${SPEECHKIT_SELFHOSTED_LLM_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      - --alias
      - ${SPEECHKIT_SELFHOSTED_LLM_MODEL:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --parallel
      - "2"
      - -n
      - "256"
      - --no-webui
    expose:
      - "8080"
    volumes:
      - speechkit-llm-cache:/root/.cache
    restart: unless-stopped

  speechkit-server:
    image: ${SPEECHKIT_SERVER_IMAGE:?set SPEECHKIT_SERVER_IMAGE in Coolify}
    depends_on:
      speechkit-init:
        condition: service_completed_successfully
      speechkit-whisper:
        condition: service_healthy
      speechkit-llm:
        condition: service_started
    configs:
      - source: speechkit_config
        target: /etc/speechkit/config.toml
    environment:
      SPEECHKIT_CONFIG_PATH: /etc/speechkit/config.toml
      SPEECHKIT_PUBLIC_URL: ${SPEECHKIT_PUBLIC_URL:-https://speechkit.kombify.dev}
      SPEECHKIT_SELFHOSTED_DEFAULTS: ${SPEECHKIT_SELFHOSTED_DEFAULTS:-true}
      SPEECHKIT_SELFHOSTED_STT_URL: ${SPEECHKIT_SELFHOSTED_STT_URL:-http://speechkit-whisper:8080}
      SPEECHKIT_SELFHOSTED_STT_MODEL: ${SPEECHKIT_SELFHOSTED_STT_MODEL:-whisper-1}
      SPEECHKIT_SELFHOSTED_LLM_BASE_URL: ${SPEECHKIT_SELFHOSTED_LLM_BASE_URL:-http://speechkit-llm:8080/v1}
      SPEECHKIT_SELFHOSTED_LLM_REPO: ${SPEECHKIT_SELFHOSTED_LLM_REPO:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      SPEECHKIT_SELFHOSTED_LLM_MODEL: ${SPEECHKIT_SELFHOSTED_LLM_MODEL:-ggml-org/gemma-4-E4B-it-GGUF:Q4_K_M}
      SPEECHKIT_SERVER_ONBOARDING_UI: ${SPEECHKIT_SERVER_ONBOARDING_UI:-false}
      SPEECHKIT_SERVER_SETTINGS_WRITE: ${SPEECHKIT_SERVER_SETTINGS_WRITE:-false}
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:?set SPEECHKIT_SERVER_TOKEN in Coolify}
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    expose:
      - "8080"
    volumes:
      - speechkit-data:/var/lib/speechkit/data
      - speechkit-models:/var/lib/speechkit/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.speechkit-dev-compress.compress: "true"
      traefik.http.middlewares.speechkit-dev-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.speechkit-dev-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.speechkit-dev-http.rule: "Host(`${SPEECHKIT_PUBLIC_HOST:-speechkit.kombify.dev}`)"
      traefik.http.routers.speechkit-dev-http.entrypoints: "http"
      traefik.http.routers.speechkit-dev-http.middlewares: "speechkit-dev-redirect"
      traefik.http.routers.speechkit-dev-api.rule: "Host(`${SPEECHKIT_PUBLIC_HOST:-speechkit.kombify.dev}`) && (Path(`/healthz`) || Path(`/readyz`) || PathPrefix(`/v1/dictation`) || PathPrefix(`/v1/assist`) || PathPrefix(`/v1/voiceagent`) || PathPrefix(`/api/v1/dictation`) || PathPrefix(`/api/v1/assist`) || PathPrefix(`/api/v1/voiceagent`))"
      traefik.http.routers.speechkit-dev-api.entrypoints: "https"
      traefik.http.routers.speechkit-dev-api.tls: "true"
      traefik.http.routers.speechkit-dev-api.tls.certresolver: "letsencrypt"
      traefik.http.routers.speechkit-dev-api.priority: "200"
      traefik.http.routers.speechkit-dev-api.middlewares: "speechkit-dev-compress"
      traefik.http.routers.speechkit-dev-api.service: "speechkit-dev"
      traefik.http.routers.speechkit-dev-ui.rule: "Host(`${SPEECHKIT_PUBLIC_HOST:-speechkit.kombify.dev}`)"
      traefik.http.routers.speechkit-dev-ui.entrypoints: "https"
      traefik.http.routers.speechkit-dev-ui.tls: "true"
      traefik.http.routers.speechkit-dev-ui.tls.certresolver: "letsencrypt"
      traefik.http.routers.speechkit-dev-ui.priority: "100"
      traefik.http.routers.speechkit-dev-ui.middlewares: "${SPEECHKIT_TINYAUTH_MIDDLEWARE:-tinyauth@docker},speechkit-dev-compress"
      traefik.http.routers.speechkit-dev-ui.service: "speechkit-dev"
      traefik.http.services.speechkit-dev.loadbalancer.server.port: "8080"
      tinyauth.apps.speechkit.config.domain: "${SPEECHKIT_PUBLIC_HOST:-speechkit.kombify.dev}"
      tinyauth.apps.speechkit.oauth.groups: "${SPEECHKIT_TINYAUTH_OAUTH_GROUPS:-admins}"
      tinyauth.apps.speechkit.path.allow: "^/(healthz|readyz)$|^/(v1|api/v1)/(dictation|assist|voiceagent)(/.*)?$"

configs:
  speechkit_config:
    file: ./config.toml

volumes:
  speechkit-data:
  speechkit-llm-cache:
  speechkit-models:
