# Local development stack for the SpeechKit Server-Target.
#
# Brings up the server plus an optional whisper.cpp sidecar and a PostgreSQL
# backing store. Secrets are expected to come from the environment — copy
# `.env.example` to `.env` or use `doppler run -- docker compose up`.
#
# This is the reference dev compose file. Production deployments (Render,
# Kubernetes, etc.) use their own manifests and inject the same env vars.

services:
  speechkit-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      args:
        VERSION: dev-compose
    image: speechkit-server:dev
    environment:
      # Required by deploy/config/server.example.toml, which uses bearer_or_edge auth.
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:?set SPEECHKIT_SERVER_TOKEN for the server bearer token}
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      SPEECHKIT_GOOGLE_STT_API_KEY: ${SPEECHKIT_GOOGLE_STT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Self-hosted defaults the server picks up when no cloud key is
      # configured. install-server.sh writes these into .env; the local
      # endpoints below back them. Override SPEECHKIT_SELFHOSTED_DEFAULTS=
      # to false to disable the default-local wiring.
      SPEECHKIT_SELFHOSTED_DEFAULTS: ${SPEECHKIT_SELFHOSTED_DEFAULTS:-true}
      SPEECHKIT_SELFHOSTED_STT_URL: ${SPEECHKIT_SELFHOSTED_STT_URL:-http://speechkit-whisper:8080}
      SPEECHKIT_SELFHOSTED_LLM_BASE_URL: ${SPEECHKIT_SELFHOSTED_LLM_BASE_URL:-http://speechkit-llm:8080/v1}
    volumes:
      - ../config/server.example.toml:/etc/speechkit/config.toml:ro
      - speechkit-models:/var/lib/speechkit/models
    ports:
      - "127.0.0.1:${SPEECHKIT_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Whisper.cpp HTTP server sidecar. Profile-gated so cloud-only setups
  # don't have to pull a 100+ MB image they never use. install-server.sh
  # adds COMPOSE_PROFILES=local to .env, which activates this service +
  # the matching llama sidecar. speechkit-server reaches it at
  # http://speechkit-whisper:8080 via SPEECHKIT_SELFHOSTED_STT_URL.
  speechkit-whisper:
    profiles: ["local"]
    # Pinned to whisper.cpp commit 968eebe7 (image build 2026-05-15) —
    # later `:main` builds rejected every WAV upload with
    # `error: failed to read audio data from (RIFF...)`, blocking
    # install-e2e-linux gates and the public release pipeline since
    # v0.35.4. Override SPEECHKIT_WHISPER_IMAGE in your environment if
    # you want a different (newer or tagged) image.
    image: ${SPEECHKIT_WHISPER_IMAGE:-ghcr.io/ggml-org/whisper.cpp@sha256:fd7ca21c83126b08f610d02a50f68878a66388a4b96e90e2637ced84397013b5}
    # ggml-org/whisper.cpp:main ships with ENTRYPOINT ["bash", "-c"]
    # which swallows additional args. Override with the full server
    # binary path so command-list args reach it directly.
    entrypoint: ["/app/build/bin/whisper-server"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/whisper/${SPEECHKIT_WHISPER_MODEL_FILE:-ggml-large-v3-turbo.bin}
      - --inference-path
      - /v1/audio/transcriptions
    volumes:
      - speechkit-models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # llama.cpp HTTP server sidecar. Profile-gated (see speechkit-whisper
  # above). Speaks OpenAI-compatible /v1/ endpoints. speechkit-server
  # reaches it at http://speechkit-llm:8080/v1 via
  # SPEECHKIT_SELFHOSTED_LLM_BASE_URL.
  speechkit-llm:
    profiles: ["local"]
    image: ${SPEECHKIT_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/llama/${SPEECHKIT_LLM_MODEL_FILE:-gemma-4-E4B-it-Q4_K_M.gguf}
    volumes:
      - speechkit-models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: speechkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD for the database password}
      POSTGRES_DB: speechkit
    volumes:
      - speechkit-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SPEECHKIT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speechkit -d speechkit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  speechkit-models:
  speechkit-postgres:
