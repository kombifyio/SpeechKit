# OSS quick-start docker-compose for SpeechKit.
#
# Unlike docker-compose.yml (which builds from local sources for
# development), this file pulls published images straight from GHCR.
# Use this when you want to try SpeechKit without cloning the
# repository first.
#
# Two services are defined:
#
#   speechkit-server (port 8080):
#     The full server — Dictation REST + Assist REST + Voice Agent WS
#     in one container. Choose this for single-pod deployments where
#     you want all three modes against one URL.
#
#   speechkit-voice (port 8090, commented out by default):
#     Voice-Agent-only WebSocket server. Uncomment when you want to
#     scale voice independently from REST traffic, or when the device-
#     target's per-mode `mode_source` config points Dictation/Assist
#     at one URL and Voice Agent at another.
#
# Quick start:
#   1. Copy .env.example to .env, fill in SPEECHKIT_SERVER_TOKEN +
#      whichever provider keys you want enabled (Google for Voice
#      Agent, OpenAI for Assist, etc.).
#   2. docker compose -f docker-compose.oss.yml up -d
#   3. curl -fsS http://localhost:8080/healthz
#
# By default this file pins both images to the latest stable tag —
# override with the IMAGE_TAG env var when you want a specific
# release: IMAGE_TAG=v0.26.0 docker compose ... up -d.

services:
  speechkit-server:
    image: ghcr.io/kombifyio/speechkit-server:${IMAGE_TAG:-latest}
    environment:
      # Required.
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:?set SPEECHKIT_SERVER_TOKEN}
      # Optional — enables specific provider features.
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
    volumes:
      # Mount your own config.toml here. The reference config under
      # deploy/config/server.example.toml is a good starting point —
      # it's intentionally framework-neutral so external users don't
      # inherit kombify-specific persona seeds.
      - ./config/config.toml:/etc/speechkit/config.toml:ro
      # Persistent volume for the whisper.cpp model files (~3 GB for
      # large-v3). Skip this binding if you only use cloud STT.
      - speechkit-models:/var/lib/speechkit/models
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Voice-only deployment, ships under the same release tag as
  # speechkit-server. Uncomment when you want to run the Voice Agent
  # tier on its own pod / port — typical reason: stateful WebSocket
  # connections (long-lived, beefier nodes) versus stateless REST
  # traffic (horizontally scaled, lean nodes). The device-target's
  # `[server_connection]` accepts a separate URL per mode, so the
  # split is invisible to end users.
  #
  # speechkit-voice:
  #   image: ghcr.io/kombifyio/speechkit-voice:${IMAGE_TAG:-latest}
  #   environment:
  #     SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:?set SPEECHKIT_SERVER_TOKEN}
  #     GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
  #     OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  #     HF_TOKEN: ${HF_TOKEN:-}
  #   volumes:
  #     - ./config/config.toml:/etc/speechkit/config.toml:ro
  #     - speechkit-models:/var/lib/speechkit/models
  #   ports:
  #     - "8090:8080"
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 30s

  # Postgres is optional — SQLite (the default) writes to a file
  # inside the container and works fine for single-instance deploys.
  # Uncomment to switch the persona store to Postgres:
  #
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: speechkit
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: speechkit
  #   volumes:
  #     - speechkit-postgres:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

volumes:
  speechkit-models:
  # speechkit-postgres:
