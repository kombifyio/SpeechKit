# OSS quick-start docker-compose for SpeechKit.
#
# Unlike docker-compose.yml (which builds from local sources for
# development), this file pulls published images straight from GHCR.
# Use this when you want to try SpeechKit without cloning the
# repository first.
#
# One service is defined:
#
#   speechkit-server (port 8080):
#     The central Framework server — Dictation REST + Assist REST +
#     Voice Agent WS in one container under one URL.
#
# Quick start:
#   1. Copy .env.example to .env and fill in whichever provider keys
#      you want enabled (Google for Voice Agent, OpenAI for Assist,
#      etc.). SPEECHKIT_SERVER_TOKEN is only needed when you enable
#      bearer auth in config.toml.
#   2. docker compose -f docker-compose.oss.yml up -d
#   3. curl -fsS http://localhost:8080/healthz
#
# By default this file pins the server image to the latest stable tag.
# Override with IMAGE_TAG when you want a specific release:
# IMAGE_TAG=v0.26.0 docker compose ... up -d.

services:
  speechkit-server:
    image: ghcr.io/kombifyio/speechkit-server:${IMAGE_TAG:-latest}
    environment:
      # Optional unless [server].auth_mode is set to "bearer" or "bearer_or_edge".
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:-}
      # Optional — enables specific provider features.
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      SPEECHKIT_GOOGLE_STT_API_KEY: ${SPEECHKIT_GOOGLE_STT_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
    volumes:
      # Mount your own config.toml here. The reference config under
      # deploy/config/server.example.toml is a good starting point —
      # it's intentionally framework-neutral so external users don't
      # inherit kombify-specific persona seeds.
      - ./config/config.toml:/etc/speechkit/config.toml:ro
      # Persistent volume for the whisper.cpp model files (~3 GB for
      # large-v3). Skip this binding if you only use cloud STT.
      - speechkit-models:/var/lib/speechkit/models
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Postgres is optional — SQLite (the default) writes to a file
  # inside the container and works fine for single-instance deploys.
  # Uncomment to switch the persona store to Postgres:
  #
  # postgres:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: speechkit
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: speechkit
  #   volumes:
  #     - speechkit-postgres:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

volumes:
  speechkit-models:
  # speechkit-postgres:
