# Local development stack for the SpeechKit Voice Server.
#
# Spins up the voice-only binary (built from cmd/speechkit-voice) on port
# 8090 — a different port than the full server's 8080 so the two can run
# side-by-side during dev for parity testing. Use this when you want to
# validate the split-deployment shape locally before deploying it for real.
#
# Pair with docker-compose.yml (full server on :8080) to mirror the
# production split where Dictation/Assist hit one URL and Voice Agent
# hits a different one — exactly the shape the device-target's per-mode
# `mode_source` config drives.

services:
  speechkit-voice:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      target: speechkit-voice
      args:
        VERSION: dev-compose
    image: speechkit-voice:dev
    environment:
      SPEECHKIT_SERVER_TOKEN: ${SPEECHKIT_SERVER_TOKEN:-}
      EDGE_AUTH_SECRET: ${EDGE_AUTH_SECRET:-}
      # Voice Agent leans on Gemini Live (default) or the cascaded provider
      # (whisper.cpp + Genkit + TTS). The cascaded provider is opt-in via
      # config.toml's [voice_agent].provider field and pulls additional
      # credentials from below.
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../config/server.example.toml:/etc/speechkit/config.toml:ro
      # Voice Agent doesn't need the whisper.cpp models that Dictation
      # relies on, but the cascaded provider DOES. Keep the volume
      # reservation so a config flip to cascaded doesn't require a
      # compose rewrite.
      - speechkit-models:/var/lib/speechkit/models
    ports:
      - "8090:8080"
    restart: unless-stopped

volumes:
  speechkit-models:
