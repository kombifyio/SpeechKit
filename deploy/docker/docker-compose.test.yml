# End-to-end test stack for the SpeechKit Server-Target.
#
# Spins up the server plus Postgres and then runs a one-shot test client
# that hits /healthz, /readyz, /readyz/strict, and the Assist self-test.
# Exits non-zero when any assertion fails — suitable
# for `docker compose -f deploy/docker/docker-compose.test.yml up
# --exit-code-from test-client`.
#
# CI uses this file for its smoke job; local developers can use it to
# prove an image works before pushing.

services:
  speechkit-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.server
      args:
        VERSION: e2e-test
    image: ${SPEECHKIT_SERVER_IMAGE:-speechkit-server:e2e}
    environment:
      SPEECHKIT_SERVER_TOKEN: e2e-dev-token
      # Cloud providers are left unset intentionally — the e2e client
      # drives text-only flows through /healthz and /readyz, which don't
      # require any provider to succeed.
      LOG_LEVEL: debug
      LOG_FORMAT: text
    volumes:
      - ../config/server.example.toml:/etc/speechkit/config.toml:ro
      - speechkit-test-models:/var/lib/speechkit/models
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: speechkit
      POSTGRES_PASSWORD: test-password
      POSTGRES_DB: speechkit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speechkit -d speechkit"]
      interval: 2s
      timeout: 2s
      retries: 15

  test-client:
    # Use a thin alpine image with curl and jq so the test script stays
    # in this compose file rather than a separate Go binary. The real
    # performance-comparison harness (M9c) will be a Go tool.
    #
    # Tagged with the "smoke" profile so server-linux.yml's existing
    # smoke job runs only this client (no profile is implicit-activate
    # by default; the local-only profile must NOT pull this client in
    # or --abort-on-container-exit kills the local-only stack early).
    profiles: ["smoke"]
    image: alpine:3.20
    depends_on:
      speechkit-server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        apk add --no-cache curl jq >/dev/null
        echo "== 1. /healthz =="
        curl -fsS http://speechkit-server:8080/healthz | jq -e '.status == "ok"' >/dev/null
        echo "== 2. /readyz =="
        ready_code=$$(curl -sS -o /tmp/readyz -w '%{http_code}' http://speechkit-server:8080/readyz)
        if [ "$$ready_code" != "200" ] && [ "$$ready_code" != "503" ]; then
          echo "readyz returned unexpected status $$ready_code"
          cat /tmp/readyz
          exit 1
        fi
        jq '.components | keys' /tmp/readyz
        echo "== 3. /readyz/strict =="
        strict_code=$$(curl -sS -o /tmp/readyz-strict -w '%{http_code}' http://speechkit-server:8080/readyz/strict)
        if [ "$$strict_code" != "200" ] && [ "$$strict_code" != "503" ]; then
          echo "readyz/strict returned unexpected status $$strict_code"
          cat /tmp/readyz-strict
          exit 1
        fi
        jq -e '.status == .strict_status and (.components | type == "object")' /tmp/readyz-strict >/dev/null
        echo "== 4. Deployment status =="
        curl -fsS \
          -H 'Authorization: Bearer e2e-dev-token' \
          http://speechkit-server:8080/v1/deployment/status \
          | jq -e '.auth.bearer_token_env == "SPEECHKIT_SERVER_TOKEN" and .auth.bearer_token_set == true and (.auth | tostring | contains("e2e-dev-token") | not)' >/dev/null
        echo "== 5. Assist self-test =="
        # Without provider keys this can return a structured 503. With keys it
        # must produce a concrete successful self-test response.
        code=$$(curl -s -o /tmp/body -w '%{http_code}' \
          -H 'Authorization: Bearer e2e-dev-token' \
          -H 'Content-Type: application/json' \
          -X POST \
          http://speechkit-server:8080/v1/assist/self-test)
        if [ "$$code" = "200" ]; then
          jq -e '.status == "ok" and (.text | length > 0)' /tmp/body >/dev/null
        elif [ "$$code" = "503" ]; then
          jq -e '.error.code == "pipeline_unavailable" and (.error.details | type == "object")' /tmp/body >/dev/null
          echo "assist self-test returned structured 503 (OK for providerless smoke test)"
        else
          echo "assist self-test returned unexpected status $$code"
          cat /tmp/body
          exit 1
        fi
        echo "== OK =="

  functional-test-client:
    profiles: ["functional"]
    image: golang:1.26
    working_dir: /workspace
    depends_on:
      speechkit-server:
        condition: service_healthy
    volumes:
      - ../..:/workspace
    environment:
      SPEECHKIT_E2E_DICTATION_AUDIO: ${SPEECHKIT_E2E_DICTATION_AUDIO:-}
      SPEECHKIT_E2E_DICTATION_TEXT: ${SPEECHKIT_E2E_DICTATION_TEXT:-}
      SPEECHKIT_E2E_VOICEAGENT_TEXT: ${SPEECHKIT_E2E_VOICEAGENT_TEXT:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        if [ -z "$${SPEECHKIT_E2E_DICTATION_AUDIO:-}" ]; then
          echo "SPEECHKIT_E2E_DICTATION_AUDIO is required for the functional Docker e2e profile" >&2
          exit 2
        fi
        if [ ! -f "$$SPEECHKIT_E2E_DICTATION_AUDIO" ]; then
          echo "SPEECHKIT_E2E_DICTATION_AUDIO does not exist in the container: $$SPEECHKIT_E2E_DICTATION_AUDIO" >&2
          exit 2
        fi
        set -- --server http://speechkit-server:8080 --token e2e-dev-token --scenarios all --strict-ready --require-functional --audio-fixture "$$SPEECHKIT_E2E_DICTATION_AUDIO"
        if [ -n "$${SPEECHKIT_E2E_DICTATION_TEXT:-}" ]; then
          set -- "$$@" --expect-dictation-text "$$SPEECHKIT_E2E_DICTATION_TEXT"
        fi
        if [ -n "$${SPEECHKIT_E2E_VOICEAGENT_TEXT:-}" ]; then
          set -- "$$@" --voiceagent-text "$$SPEECHKIT_E2E_VOICEAGENT_TEXT"
        fi
        go run ./cmd/sk-e2e "$$@"

  # ── local-only profile ────────────────────────────────────────────────
  # Runs sk-e2e --local-only against the server with no cloud keys.
  # Model pre-population is a workflow concern in install-e2e-linux.yml
  # (NOT a compose service) because --abort-on-container-exit aborts on
  # ANY service exit — including a one-shot "prepare" container — which
  # tore the stack down before the test client could run. Models are
  # seeded into the speechkit-test-models named volume from the host
  # cache before the compose stack starts.
  local-only-test-client:
    profiles: ["local-only"]
    image: golang:1.26
    working_dir: /workspace
    depends_on:
      speechkit-server:
        condition: service_healthy
    volumes:
      - ../..:/workspace
      - speechkit-test-models:/var/lib/speechkit/models
    environment:
      # Assert all cloud keys are unset before going further. Compose
      # treats unset env-var keys as removed (not blank), which is what
      # we want here.
      GOOGLE_AI_API_KEY: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      OPENROUTER_API_KEY: ""
      HF_TOKEN: ""
      GOOGLE_STT_API_KEY: ""
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -euo pipefail
        for k in GOOGLE_AI_API_KEY OPENAI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY HF_TOKEN GOOGLE_STT_API_KEY; do
          v=$$(printenv "$$k" || true)
          if [ -n "$$v" ]; then
            echo "local-only-test-client: $$k is set; refusing to run" >&2
            exit 2
          fi
        done
        go run ./cmd/sk-e2e \
          --server http://speechkit-server:8080 \
          --token e2e-dev-token \
          --scenarios all \
          --require-functional \
          --local-only \
          --timeout 180s \
          --audio-fixture testdata/e2e/dictation/hello-world.wav \
          --expect-dictation-text "(?i)hello,?\\s+world"

volumes:
  speechkit-test-models:
