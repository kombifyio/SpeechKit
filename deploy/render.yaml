# Render Blueprint for the SpeechKit Server-Target.
#
# Apply with the Render CLI or via the Render dashboard (New → Blueprint):
#
#   render blueprint create deploy/render.yaml
#
# The blueprint deploys a single Docker web service plus an optional
# managed PostgreSQL instance in Frankfurt. Secrets are expected to be
# injected via Doppler at deploy time; Render's `fromEnv` / `secretFile`
# mechanisms are deliberately NOT used for the actual values so the
# Blueprint stays usable for both the private kombify main-repo deploy
# AND the eventual OSS release (which has no Doppler access).

services:
  - type: web
    name: speechkit-server
    runtime: docker
    repo: https://github.com/kombifyio/SpeechKit        # rewrite to KombiverseLabs/kombify-SpeechKit for private deploys
    branch: main
    dockerfilePath: ./deploy/docker/Dockerfile.server
    # Frankfurt keeps inter-service latency low for the kombify-AI callers
    # already hosted on Render Frankfurt.
    region: frankfurt
    plan: standard                                      # 2 CPU / 4 GB — room for whisper.cpp subprocess + Genkit
    healthCheckPath: /healthz
    autoDeploy: false                                   # deploys are triggered manually / via CI
    envVars:
      # --- Runtime config ---
      - key: SPEECHKIT_CONFIG_PATH
        value: /etc/speechkit/config.toml
      - key: LOG_FORMAT
        value: json

      # --- Secrets (populated by Doppler at deploy time) ---
      # Optional auth secret. Set this only when config.toml uses
      # auth_mode = "bearer" or "bearer_or_edge".
      - key: SPEECHKIT_SERVER_TOKEN
        sync: false
      - key: EDGE_AUTH_SECRET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # --- Postgres (from the managed db below) ---
      - key: POSTGRES_DSN
        fromDatabase:
          name: speechkit-store
          property: connectionString

    # Persistent disk for the SQLite fallback + whisper.cpp model cache.
    # Render gives 10 GB by default on the Standard plan; larger whisper
    # models (`large-v3`, ~3 GB) should go here rather than baking into the
    # image so image pulls stay fast.
    disk:
      name: speechkit-models
      mountPath: /var/lib/speechkit/models
      sizeGB: 10

databases:
  - name: speechkit-store
    plan: basic-1gb
    region: frankfurt
    databaseName: speechkit
    user: speechkit
    # Postgres 17 matches Render's current default and the version used by
    # the Framework's existing migrations.
    postgresMajorVersion: 17
