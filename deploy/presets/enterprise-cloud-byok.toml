# SpeechKit Enterprise Preset — Profile B: BYOK Cloud (Gemini Live EU)
#
# Intended for customers who accept Google Cloud as DSGVO Art. 28 processor
# in exchange for sub-second realtime latency. Apply by copying this file
# to <install-dir>/config.toml.
#
# Customer responsibilities BEFORE first launch:
#   1. Create a Google Cloud project with EU region (europe-west3 or 4).
#   2. Generate an API key with Generative Language API enabled.
#   3. Sign Google Cloud DPA via the customer's account.
#   4. Set [providers.google] api_key to that key.
#
# Phase 2 (cpv.3.4) adds an in-product region selector. Until then,
# region is pinned at the Google Cloud project level (out of band).

[update]
enabled = true  # customer can flip to false or point manifest_url to internal mirror

[telemetry]
update_check = true

[logging]
max_file_size_mb = 50
max_files = 30

[audit]
enabled = true
retention_days = 90

[routing]
strategy = "dynamic"

[voice_agent]
provider = "gemini"
# model = "gemini-3.1-flash-live-preview"  # default; pin a specific version for stability

[providers.google]
# api_key = "..."  # customer fills in — never commit
# base_url override not recommended; use default Google endpoint
# (regional endpoint pinning happens at the Google Cloud project level for now)

# Other providers (openai, groq, huggingface, vps) intentionally absent —
# customer enables them explicitly if needed.
