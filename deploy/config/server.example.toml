# SpeechKit Server-Target — reference configuration.
#
# Copy this file to /etc/speechkit/config.toml (or pass --config <path>) and
# adjust for your deployment. The reference profile is production-oriented:
# API routes require bearer/edge auth by default. Health plus the smoke page stay
# public; /setup is public only during first-run bootstrap and requires an admin
# identity after a token or completed onboarding state exists. For a local-only
# demo you may set auth_mode = "none" explicitly.
# Provider secrets are optional; missing secrets degrade only the modes that
# need them.
#
# Secret values NEVER live in this file. Instead, this file refers to the ENV
# VAR NAMES that hold them; the server reads those at boot (and gracefully
# degrades when a secret is absent, logging which capability is off).

[general]
language = "en"
eager_warmup = false # Optional: warm supported mode runtimes before Start.

[server]
listen_addr            = ":8080"
# External API base used for generated WebSocket URLs behind a proxy.
# Include any external mount prefix, for example "https://speechkit.example.com/api".
public_url             = ""
# modes: leave empty or omit to enable all three. Comment out individual
# entries to disable a mode for a given deployment (e.g. a Dictation-only
# pool).
modes                  = ["dictation", "assist", "voiceagent"]
auth_mode              = "bearer_or_edge"       # bearer | edge_hmac | bearer_or_edge | oidc | bearer_or_oidc | none. Production default accepts service bearer tokens and Gateway X-Edge-* HMAC. Use "oidc" to validate JWTs from an external IdP (see [server.oidc]); "bearer_or_oidc" additionally keeps the static service bearer working — the shape for mobile/native per-user clients next to existing service callers.
bearer_token_env       = "SPEECHKIT_SERVER_TOKEN"
# Optional public demo token. When SPEECHKIT_SMOKE_TOKEN is set in the env,
# the smoke UI on `/` embeds it so visitors can drive all three modes from
# the browser without configuring credentials. The smoke identity is
# tagged Source="smoke", Plan="demo" — handlers and rate-limiters can
# tighten budgets for demo traffic. Leave the env var unset to disable.
smoke_token_env        = "SPEECHKIT_SMOKE_TOKEN"
bearer_role            = ""                     # Set "admin" only for trusted single-operator bearer-token installs.
admin_auth_enabled     = false                  # Optional setup UI username/password login. Keep false in the base image; enable through first-run setup/API for public installs.
admin_username         = ""                     # Set through /setup or /v1/server/settings. Do not store plaintext passwords in TOML.
admin_password_hash    = ""                     # bcrypt hash only; the setup API accepts a one-time admin_auth.password and stores the hash.
edge_auth_secret_env   = "EDGE_AUTH_SECRET"
cors_allowed_origins   = []                      # e.g. ["https://app.example.com"]; also enforced for browser WebSocket clients.
rate_limit_rps         = 10.0
rate_limit_burst       = 20
max_upload_mb          = 25
max_voiceagent_sessions = 100
max_sessions_per_user   = 3
ticket_ttl_sec          = 90
# Server-side idle timeout for Voice Agent WS sessions (seconds).
# Default 900 (15 min). Set to 0 for the implicit default, negative to
# disable the watchdog entirely.
voiceagent_idle_timeout_sec = 900
whisper_binary          = "/usr/local/bin/whisper-server"
whisper_port            = 8180
model_dir               = "/var/lib/speechkit/models"
log_format              = "json"                 # "json" | "text"
log_level               = "info"                 # "debug" | "info" | "warn" | "error"

# Streaming Dictation WebSocket (live partials): POST
# /v1/dictation/stream/sessions → single-use ticket → GET .../{id}/ws with
# Sec-WebSocket-Protocol: ticket.<value>. Needs a streaming-capable STT
# provider (e.g. Deepgram); otherwise capabilities.streaming=false and
# clients fall back to POST /v1/dictation/transcribe.
[server.dictation_stream]
enabled                   = true
max_global_sessions       = 100
max_per_identity_sessions = 3
idle_timeout_sec          = 300   # negative disables the idle watchdog
max_session_sec           = 0     # 0 disables; hosted deployments should set a finite budget
max_stream_audio_seconds  = 0     # cumulative uploaded audio per session; 0 disables

[server.security]
# Strict security response headers are ON by default; you only need this
# section to relax or extend the baseline. The default CSP is API-strict
# (default-src 'none'); the admin sign-in page ships its own hashed inline
# assets, so leave it unless you front the server with a custom UI.
# disabled                = false                # set true only to turn the headers off (not recommended)
# content_security_policy = ""                   # override the default strict CSP
# frame_options           = "DENY"               # X-Frame-Options
# referrer_policy         = "no-referrer"        # Referrer-Policy
hsts                      = false                # set true only when behind TLS termination
# hsts_max_age_seconds    = 63072000             # 2 years; applies when hsts = true

[server.debug]
# pprof exposes process internals — keep it OFF in production. When enabled it
# stays loopback-only and behind auth unless pprof_public is also set.
pprof_enabled = false
pprof_public  = false

[server.oidc]
# Only used when auth_mode = "oidc". The server validates each Bearer JWT
# against the provider's JWKS (signature, issuer, audience, expiry) and maps
# token claims onto the caller identity, giving real multi-tenancy from your
# IdP (Azure AD / Okta / Google Workspace / Auth0 / ...).
jwks_url           = ""            # e.g. "https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys"
issuer             = ""            # exact "iss" claim to require
audience           = ""            # exact "aud" claim to require (your API's client/app id)
clock_skew_seconds = 60            # tolerated exp/nbf skew
org_claim          = "org_id"      # token claim mapped to the caller's organization
role_claim         = "role"        # token claim mapped to the caller's role

[server.livekit]
# When enabled, POST /v1/voiceagent/sessions returns a short-lived LiveKit
# join token. Media goes directly to LiveKit; the SpeechKit bearer/edge auth
# boundary only mints scoped room access.
enabled        = false
url            = "" # e.g. "wss://livekit.example.com"; LIVEKIT_URL can populate this at runtime.
api_key_env    = "LIVEKIT_API_KEY"
api_secret_env = "LIVEKIT_API_SECRET"
token_ttl_sec  = 600
room_prefix    = "speechkit-va"

[server.features]
catalog        = true
storage_reads  = true
vocabulary     = true
tts_direct     = true
# Public wake-word model catalog (GET /v1/wakeword/models*): openWakeWord ONNX
# metadata for host consumers + microWakeWord v2 manifests for ESPHome / the
# Kombify-Box on-device. Already-public model metadata + redirects; on by
# default. Set false to hide the surface.
wakeword_models = true

# ── Local device-agent -> Home Assistant bridge (G0) ─────────────────────────
# Disabled in this reference profile. When enabled, the local server owns the
# Home Assistant origin/token and TTS provider. A paired device knows only this
# SpeechKit origin, its token, expected server instance, and pairing epoch.
# HTTP is loopback-only; LAN/DNS origins require HTTPS. Before enabling, change
# the active [tts] block below to enabled=true and strategy="local-only", and
# configure a ready local provider. Startup rejects every other TTS strategy.
#
# [assist.home_assistant]
# url       = "https://homeassistant.home.arpa:8123"
# token_env = "SPEECHKIT_HOME_ASSISTANT_TOKEN"
# agent_id  = "conversation.home_assistant" # Optional; empty uses HA default.
# language  = "de"                          # Optional locale override.
#
# [server.device_agent]
# enabled             = true
# server_instance_id  = "speechkit-home-01"
# claim_store_path    = "/var/lib/speechkit/device-agent-claims.db"
# max_request_age_sec = 600
# future_skew_sec     = 120
# claim_retention_sec = 86400
# max_claims          = 10000
#
# [[server.device_agent.devices]]
# device_id            = "speaker-kitchen-001"
# pairing_id           = "pairing-kitchen-2026-07" # Rotate with the token; never reuse.
# room_id              = "kitchen"
# token_env            = "SPEECHKIT_DEVICE_KITCHEN_TOKEN"
# allowed_client_cidrs = ["192.168.10.42/32"]
#
# # Immutable exact G0 rule: device + room + rule + phrase + locale + time +
# # action + entity must match. Only turn_on/turn_off for light.* is accepted.
# # This local allowlist is not a Workbench approval or Cloud standing grant.
# [[server.device_agent.devices.local_rules]]
# rule_id      = "kitchen-light-off"
# trigger_text = "turn off the kitchen light"
# locale       = "en-US"
# action       = "turn_off"
# entity_id    = "light.kitchen"
# not_before   = "2026-07-19T00:00:00Z" # Replace with a current approved window.
# expires_at   = "2026-08-18T00:00:00Z" # Maximum authorization window: 31 days.
#
# The bridge exposes only POST /v1/device-agent/{register,events,assist,tts}.
# It is absent from /api/v1, MCP, Gateway, federation, and general Assist/LLM.
# The durable ledger commits before HA dispatch. action_executed=yes requires
# the exact successful HA target and a matching REST state readback; ambiguous
# outcomes remain indeterminate and are never redispatched for that request ID.
# POST /v1/device-agent/tts accepts only request_id + format. It resolves the
# authenticated pairing's completed durable claim and synthesizes only the
# persisted HA speech/language; arbitrary text/locale and cloud TTS are denied.

# ── Wyoming voice backend (ESPHome / Home Assistant) ──────────────────────────
# Expose SpeechKit STT + TTS as Wyoming services so an ESPHome voice satellite,
# via Home Assistant's Assist pipeline, can use this server as its speech
# backend. Opens a SEPARATE TCP listener (Wyoming is not HTTP). Wyoming has no
# in-protocol auth: bind to a LAN interface, firewall the port, and optionally
# restrict allowed_client_cidrs to the Home Assistant host. Provider keys stay
# server-side — the device never holds a credential. See docs/server/wyoming.md.
[server.wyoming]
enabled      = false          # opt-in
addr         = ":10300"       # one listener advertises both STT (asr) and TTS
service_name = "speechkit"    # framework-neutral Info/attribution name
languages    = ["en", "de"]
voice        = "nova"         # advertised + default TTS voice
# allowed_client_cidrs = ["192.168.1.10/32"]  # e.g. the Home Assistant host

# ── STT / TTS / LLM providers ─────────────────────────────────────────────────
# Enable whatever the deployment should support. Disabled providers are simply
# skipped by the router.

[huggingface]
enabled   = true
model     = "openai/whisper-large-v3"
token_env = "HF_TOKEN"

[providers.openai]
enabled        = true
api_key_env    = "OPENAI_API_KEY"
stt_model      = "whisper-1"
utility_model  = "gpt-4o-mini"
assist_model   = "gpt-4o"
agent_model    = "gpt-4o"
tts_model      = "tts-1"
tts_voice      = "nova"
realtime_model = "gpt-realtime-2"  # Used when [voice_agent].provider = "openai".

[providers.google]
enabled        = true
api_key_env    = "GOOGLE_AI_API_KEY"
stt_api_key_env = "SPEECHKIT_GOOGLE_STT_API_KEY"
stt_credentials_json_env = "SPEECHKIT_GOOGLE_STT_CREDENTIALS_JSON"
application_credentials_env = "GOOGLE_APPLICATION_CREDENTIALS"
stt_model      = "latest_long"
utility_model  = "gemini-2.5-flash-lite"
assist_model   = "gemini-2.5-flash"
agent_model    = "gemini-2.5-pro"

[providers.deepgram]
enabled           = false
api_key_env       = "DEEPGRAM_API_KEY"
stt_model         = "nova-3"
stt_smart_format  = true
stt_use_vocabulary_keyterms = true
diarization_model = "latest"

[providers.assemblyai]
enabled    = false
api_key_env = "ASSEMBLYAI_API_KEY"
stt_models  = "universal-3-5-pro,universal-2"
streaming_model = "universal-3-5-pro"
streaming_base_url = "wss://streaming.assemblyai.com"
# Short clips (80ms–120s) use the synchronous Universal-3.5 Pro endpoint
# (single request/response, ~134ms p50, prompt/keyterms/conversation-context
# steering); diarization, PII redaction, and long audio stay async.
sync_base_url = ""     # empty = https://sync.assemblyai.com; set sync.us / sync.eu for data-zone pinning
disable_sync  = false  # true forces the classic async upload+poll flow

[providers.groq]
enabled        = false
api_key_env    = "GROQ_API_KEY"
stt_model      = "whisper-large-v3-turbo"

[routing]
# Server-Target containers ship without an in-process whisper.cpp, so the STT
# router must reach cloud providers (HF, OpenAI). The kernel default is
# "local-only" because Device-Target embeds whisper.cpp; we override here.
strategy                   = "cloud-only"
prefer_local_under_seconds = 0
parallel_cloud             = false

# ── Storage backend ─────────────────────────────────────────────────────────
#
# Persistent backend for transcriptions, quick notes, voice-agent session
# summaries, persona catalog, and wake-word activation audio. Omit the
# whole [store] block to fall back to SQLite at <data_dir>/store.db —
# fine for single-replica dev and the docker-compose default. Production
# deployments behind Render / Kubernetes should switch to Postgres so
# the persona catalog and session state survive container restarts and
# horizontal scaling.
#
# postgres_dsn is a standard Postgres connection string. Treat it as a
# secret — do NOT commit the literal value; use an env-var substitution
# in your real config (e.g. via the deployment manifest).
#
# [store]
# backend              = "postgres"
# postgres_dsn         = "postgres://speechkit:CHANGE-ME@localhost:5432/speechkit?sslmode=disable"
# save_audio           = false
# audio_retention_days = 30
# max_audio_storage_mb = 1024

[tts]
enabled  = true
strategy = "cloud-first" # Change to local-only when enabling [server.device_agent].
format   = "mp3"
speed    = 1.0

[tts.openai]
enabled = true
model   = "tts-1"
voice   = "nova"

[tts.google]
enabled = false
voice   = "en-US-Neural2-C"

[voice_agent]
enabled = true
# provider selects the backend:
#   "gemini"   (default) — Google Gemini Live cloud realtime
#   "openai"   — OpenAI Realtime API (gpt-realtime-2 default; requires
#                providers.openai.api_key_env populated). 16 kHz mic PCM is
#                upsampled to 24 kHz inline by the kernel adapter.
#   "cascaded" — self-hosted whisper.cpp → Genkit agent LLM → TTS pipeline
#                (requires STT + at least one agent-capable LLM + optional TTS;
#                 no Google API key needed)
#   "moshi"    — self-hosted Kyutai Moshi realtime Rust server (M9b, pending)
provider = "gemini"
# Primary: Gemini 3.1 Flash Live (preview as of April 2026). Reverts to the
# 2.5-native-audio model below if the preview endpoint becomes unavailable.
model          = "gemini-3.1-flash-live-preview"
fallback_model = "gemini-2.5-flash-native-audio-preview-12-2025"
voice          = "Kore"
framework_prompt                = """
You are a helpful, concise voice assistant. Always respond in the user's language.
Keep turns short. Confirm ambiguous requests before acting.
"""
automatic_activity_detection    = true
vad_start_sensitivity           = "medium"
vad_end_sensitivity             = "medium"
enable_input_transcript         = true
enable_output_transcript        = true
reminder_after_idle_sec         = 300
deactivate_after_idle_sec       = 900

[voice_agent.limits]
# Preferred v0.40.x capacity config. Legacy [server] limits above remain
# accepted; positive values here take precedence.
max_global_sessions       = 100
max_per_identity_sessions = 3

# ── Voice Agent Personas / Roles / Sequences ─────────────────────────────────
# These are TOML-seeded defaults. DB-stored entries with the same ID override
# these at runtime. The examples below are generic framework samples, not
# tied to any specific product or organization.

[[personas]]
id           = "default"
display_name = "Default Assistant"
description  = "Generic, polite, concise assistant with no specific domain focus."
voice        = "Kore"
locale       = "en"
default_role = "default-role"
default_sequence = ""
tags         = ["generic"]

[[personas]]
id           = "discovery-call"
display_name = "Discovery Call Host"
description  = "Guides a structured discovery conversation: greet, explore needs, summarize, confirm, close."
voice        = "Aoede"
locale       = "en"
default_role = "discovery-role"
default_sequence = "discovery-call"
tags         = ["sales", "structured"]

[[personas]]
id           = "support-triage"
display_name = "Support Triage Agent"
description  = "Identifies the caller, triages their issue, resolves or escalates."
voice        = "Charon"
locale       = "en"
default_role = "support-role"
default_sequence = "support-triage"
tags         = ["support", "structured"]

# ── Roles ────────────────────────────────────────────────────────────────────

[[roles]]
id            = "default-role"
display_name  = "Default Behavior"
system_prompt = """
You are a helpful voice assistant. Be concise. Respond in the user's language.
"""
temperature                 = 0.6
automatic_activity_detection = true
vad_start_sensitivity       = "medium"
vad_end_sensitivity         = "medium"

[[roles]]
id            = "discovery-role"
display_name  = "Discovery Conversation Host"
system_prompt = """
You are hosting a discovery conversation. Follow the active sequence step.
Ask one question at a time. Paraphrase what you hear before asking the next
question. Never invent details.
"""
temperature                 = 0.4
automatic_activity_detection = true
vad_start_sensitivity       = "low"
vad_end_sensitivity         = "medium"

[[roles]]
id            = "support-role"
display_name  = "Support Triage Specialist"
system_prompt = """
You are a support triage specialist. Identify the caller's issue, classify
severity, and either propose a next step or hand off to a human. Never make
promises about timelines without evidence.
"""
temperature                 = 0.3
automatic_activity_detection = true
vad_start_sensitivity       = "medium"
vad_end_sensitivity         = "medium"

# ── Sequences ────────────────────────────────────────────────────────────────

[[sequences]]
id           = "discovery-call"
display_name = "Classic Discovery Call"
description  = "Five-step discovery conversation."
completion   = "explicit_close"

  [[sequences.steps]]
  id           = "greet"
  instruction  = "Greet the caller warmly and explain that you will ask a few questions to understand their needs."
  exit_criteria = "The caller has acknowledged and is ready to proceed."

  [[sequences.steps]]
  id           = "ask-needs"
  instruction  = "Ask open-ended questions to understand the caller's current situation, desired outcome, and constraints. Listen before speaking."
  exit_criteria = "You have a clear picture of the caller's situation and goals."
  max_turns    = 8

  [[sequences.steps]]
  id           = "summarize"
  instruction  = "Summarize what you have heard in 2-3 sentences and ask the caller to correct anything you got wrong."
  exit_criteria = "The caller confirms the summary is accurate."

  [[sequences.steps]]
  id           = "confirm"
  instruction  = "Confirm the next concrete action and who is responsible."
  exit_criteria = "A specific next action is agreed."

  [[sequences.steps]]
  id           = "close"
  instruction  = "Thank the caller and close the conversation politely."
  exit_criteria = "The caller says goodbye or the conversation naturally ends."

[[sequences]]
id           = "support-triage"
display_name = "Support Triage"
description  = "Three-step support call triage."
completion   = "explicit_close"

  [[sequences.steps]]
  id           = "identify"
  instruction  = "Identify the caller and their account reference, if any."
  exit_criteria = "The caller has been identified or has declined to identify themselves."

  [[sequences.steps]]
  id           = "triage"
  instruction  = "Classify the issue: bug / question / feature request / billing. Assess urgency."
  exit_criteria = "The issue category and urgency are clear."

  [[sequences.steps]]
  id           = "resolve-or-escalate"
  instruction  = "If you can resolve the issue directly, do so. Otherwise, explain the escalation path clearly."
  exit_criteria = "The caller has a clear next step, either resolution or escalation ticket."
