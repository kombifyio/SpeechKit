title = "SpeechKit tracked-source secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Documented local test bearer token used only by docker-compose smoke tests"
paths = ['''(^|.*/)deploy/docker/docker-compose\.test\.yml$''']
regexes = ['''e2e-dev-token''']

[[allowlists]]
description = "Redaction fixtures that intentionally use fake OpenAI-looking keys"
paths = [
  '''(^|.*/)cmd/speechkit/diagnostics_test\.go$''',
]
regexes = ['''sk-1234567890''']

[[allowlists]]
description = "OpenAI-compatible adapter parameter names, not literal committed secrets"
paths = [
  '''(^|.*/)pkg/speechkit/stt/openaicompat/provider\.go$''',
  '''(^|.*/)pkg/speechkit/stt/vps/vps\.go$''',
]
regexes = ['''apiKey''']

[[allowlists]]
description = """
A blank assignment carries no secret by definition. Deployment guides list the
variable names an operator has to set and deliberately leave the values empty,
which the generic-api-key rule reads as a key beside a name. Matched on
content rather than on a path, because naming the private deployment
directory here would leak it into the public export.
"""
# Matched against the finding itself rather than the line: the rule's match
# runs past the newline into the next variable name, so a line anchor never
# closes.
regexTarget = "match"
regexes = ['''^[A-Z][A-Z0-9_]*=\s''']

[[allowlists]]
description = "Historical local Gateway example URL, not a committed secret"
paths = ['''(^|.*/)docs/speechkit-integration-plan\.md$''']
regexTarget = "line"
regexes = ['''url: http://kombify-speechkit-api:8080/v1/speechkit''']

[[allowlists]]
description = "This gitleaks config documents the exact fake fixtures it allows"
paths = ['''(^|.*/)\.gitleaks\.toml$''']
regexes = [
  '''e2e-dev-token''',
  '''sk-1234567890''',
  '''OPENAI_API_KEY=$''',
  '''url: http://kombify-speechkit-api:8080/v1/speechkit''',
]

[[allowlists]]
description = """
Agent scratch worktrees. `gitleaks dir` walks the filesystem rather than the
index, so a linked worktree under .claude/ gets scanned as if it were tracked
source and reports the same finding twice. Git already excludes the path; this
keeps the local run of the gate honest instead of failing on a copy of the
repository.
"""
paths = ['''(^|.*/)\.claude/worktrees/.*''']

[[allowlists]]
description = """
Generated frontend bundles. `gitleaks dir` walks the filesystem, so once a
developer has run the frontend build the minified output gets scanned as if it
were tracked source, and a property named tokenConfigured reads as a key. Git
does not track the directory; this keeps the local run of the gate honest
instead of failing on build output.
"""
paths = ['''(^|.*/)frontendassets/dist/.*''']


[[allowlists]]
# Local Android release signing material. It is gitignored (android/.gitignore
# "app/signing/") and verified unreachable by `git check-ignore`, so it can
# never be committed — but `gitleaks dir` walks the working tree, so a
# developer or CI runner that materialised the keystore would see the gate go
# red on a file the gate exists to keep out of git in the first place.
# Scoped to that one directory, not to *.properties anywhere.
description = "Gitignored Android signing material that cannot enter the repository"
paths = ['''(^|.*/)android/app/signing/.*''']
