# ============================================================================
# Voice-Companion (v0.37+) — Hands-Free Assist with skill catalog
# ============================================================================
# Setting [wakeword].default_mode = "assist" turns "Hey Quby" into a one-shot
# voice companion that hits the Assist pipeline + 7 skills (Time, Date, Math,
# Weather, Timer, Reminder, Wikipedia) and optionally Home Assistant.
# Voice-Agent mode keeps its multi-hour realtime semantics — switch
# `default_mode` between "assist" / "voice_agent" / "dictate" to pick the
# wake-word target. See docs/voice-companion.md for the full design.

# [wakeword]
# enabled = true
# phrase_id = "hey_quby"      # Curated catalog: hey_quby / hey_computer /
#                              # hey_jarvis / hey_mira / hey_kombify
# default_mode = "assist"      # "assist" (Voice-Companion, one-shot),
#                              # "voice_agent" (Multi-Hour Companion-Live),
#                              # "dictate" (transcription only)
# backend = "livekit_openwakeword"  # default; bundled per-phrase ONNX

# [wakeword.auto_end]
# silence_cutoff_sec = 10       # Ends a wake-word session after this many
#                                # seconds of silence (default 10s).
# # exit_phrases = ["danke", "stop", ...]    # Optional override of the
# #                                            # framework default list.

# [assist]
# enabled_tools = [
#   # Legacy text-utilities:
#   "copy_last", "insert_last", "summarize", "quick_note",
#   # Voice-Companion skills (default Enabled=true once the package ships):
#   "time", "date", "math", "weather", "timer", "reminder", "wikipedia",
#   # Smart-Home (only useful when [assist.home_assistant] is configured):
#   # "home_assistant",
# ]
# # include_window_context controls whether the Device-Target captures the
# # foreground application name + window title and feeds them to the Assist
# # LLM as context ("Active application: Code", "Active window: main.go").
# # This lets answers adapt to where you are (an email client vs. an IDE).
# # Window titles can be sensitive (document names, chat partners, URLs),
# # so set this to false to opt out. Default: true. The Server-Target
# # ignores this flag — there the integrating client decides whether to
# # send the `app` / `window_title` request fields.
# include_window_context = true

# [assist.home_assistant]
# # Optional Smart-Home bridge. When url + token_env are both set, the
# # voice-companion HomeAssistant skill routes commands like
# # "Hey Quby, schalte das Wohnzimmerlicht aus" through HA's
# # Conversation API. The token itself is NEVER stored in TOML — only the
# # environment variable name is configured here. Use Doppler / Windows
# # Credential Manager / a process env var to provide the actual token.
# url = "https://ha.example.lan:8123"
# token_env = "HA_LONG_LIVED_TOKEN"
# # language = "de"     # Optional override (default uses caller locale)

# [model_selection.tts]
# # Voice-Output model selection — pins which TTS provider Assist and
# # Voice-Agent use when speaking back to the user. Same shape as
# # [model_selection.assist] / .voice_agent / .dictate. v0.37.2 added
# # this so Thalia + Companion-Live deployments can pick a stable
# # voice ("Studio-O DE", "OpenAI Nova HD", "Piper Thorsten") without
# # editing the lower-level [tts.providers.*] blocks.
# #
# # Catalog IDs (see pkg/speechkit/catalog.go):
# #   tts.local.kokoro-82m                Local Built-in (Apache-2.0, ~50MB ONNX, EN, RECOMMENDED v0.37.3 default)
# #   tts.local.supertonic-3              Local Built-in (OpenRAIL, multilingual 32 langs incl. DE)
