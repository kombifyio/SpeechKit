# ============================================================================
# Voice-Companion (v0.37+) — Hands-Free Assist with skill catalog
# ============================================================================
# Setting [wakeword].default_mode = "assist" turns "Hey Quby" into a one-shot
# voice companion that hits the Assist pipeline + 7 skills (Time, Date, Math,
# Weather, Timer, Reminder, Wikipedia) and optionally Home Assistant.
# Voice-Agent mode keeps its multi-hour realtime semantics — switch
# `default_mode` between "assist" / "voice_agent" / "dictate" to pick the
# wake-word target. See docs/voice-companion.md for the full design.

# [wakeword]
# enabled = true
# phrase_id = "hey_quby"      # Curated catalog: hey_quby / hey_computer /
#                              # hey_jarvis / hey_mira / hey_kombify
# default_mode = "assist"      # "assist" (Voice-Companion, one-shot),
#                              # "voice_agent" (Multi-Hour Companion-Live),
#                              # "dictate" (transcription only)
# backend = "livekit_openwakeword"  # default; bundled per-phrase ONNX

# [wakeword.auto_end]
# silence_cutoff_sec = 10       # Ends a wake-word session after this many
#                                # seconds of silence (default 10s).
# # exit_phrases = ["danke", "stop", ...]    # Optional override of the
# #                                            # framework default list.

# [assist]
# enabled_tools = [
#   # Legacy text-utilities:
#   "copy_last", "insert_last", "summarize", "quick_note",
#   # Voice-Companion skills (default Enabled=true once the package ships):
#   "time", "date", "math", "weather", "timer", "reminder", "wikipedia",
#   # Smart-Home (only useful when [assist.home_assistant] is configured):
#   # "home_assistant",
# ]
# # include_window_context controls whether the Device-Target captures the
# # foreground application name + window title and feeds them to the Assist
# # LLM as context ("Active application: Code", "Active window: main.go").
# # This lets answers adapt to where you are (an email client vs. an IDE).
# # Window titles can be sensitive (document names, chat partners, URLs),
# # so set this to false to opt out. Default: true. The Server-Target
# # ignores this flag — there the integrating client decides whether to
# # send the `app` / `window_title` request fields.
# include_window_context = true

# [assist.home_assistant]
# # Server-owned Smart-Home bridge. The local device-agent G0 path requires
# # this block and never sends the Home Assistant origin or token to a device,
# # MCP, Gateway, or federation surface. HTTP is loopback-only; LAN/DNS origins
# # require HTTPS. The token value is NEVER stored in TOML.
# url = "https://homeassistant.home.arpa:8123"
# token_env = "SPEECHKIT_HOME_ASSISTANT_TOKEN"
# agent_id = "conversation.home_assistant" # Optional HA Conversation agent.
# language = "de"                          # Optional server-side override.
#
# # G0 local satellite bridge. Every device has an independent secret and
# # non-recycled pairing epoch. The four routes are POST-only under
# # /v1/device-agent/{register,events,assist,tts}; /api/v1, MCP, Gateway, and
# # federation do not expose them. Before enabling, set the active [tts] block
# # above to enabled=true and strategy="local-only", and configure a ready local
# # provider. The TTS route accepts only request_id + format and synthesizes the
# # persisted HA speech/language from that pairing's completed durable claim;
# # caller-provided text/locale and cloud TTS are rejected. Zero claim settings
# # select safe defaults.
# [server.device_agent]
# enabled = true
# server_instance_id = "speechkit-home-01"
# claim_store_path = "/var/lib/speechkit/device-agent-claims.db"
# max_request_age_sec = 600
# future_skew_sec = 120
# claim_retention_sec = 86400
# max_claims = 10000
#
# [[server.device_agent.devices]]
# device_id = "speaker-kitchen-001"
# pairing_id = "pairing-kitchen-2026-07"
# room_id = "kitchen"
# token_env = "SPEECHKIT_DEVICE_KITCHEN_TOKEN"
# allowed_client_cidrs = ["192.168.10.42/32"]
#
# # Exact immutable G0 allowlist entry. This is not a Workbench approval or
# # Cloud standing grant. Only turn_on/turn_off for one light.* entity is
# # accepted, and the RFC3339 window must be positive and at most 31 days.
# [[server.device_agent.devices.local_rules]]
# rule_id = "kitchen-light-off"
# trigger_text = "turn off the kitchen light"
# locale = "en-US"
# action = "turn_off"
# entity_id = "light.kitchen"
# not_before = "2026-07-19T00:00:00Z" # Replace with a current approved window.
# expires_at = "2026-08-18T00:00:00Z"
#
# # Optional production lifecycle binding for the finite Box media endpoint.
# # This opens a SEPARATE TLS 1.3-only listener containing exactly
# # POST /v1/box-media/turn; it is never mounted on the general server mux.
# # [local] must be enabled with an absolute Whisper model_path and valid port.
# # The operator provisions all three certificate files and installs the CA on
# # the Box out-of-band. pinned_ca_sha256 is SHA-256 over the CA's DER bytes.
# # token_env must resolve to a separate credential from HA, general-server,
# # edge, smoke, and every four-route device-agent token.
# [server.device_agent.box_media]
# enabled = true
# listen_addr = "192.168.10.10:8444"
# certificate_file = "/etc/speechkit/box-media.crt"
# private_key_file = "/etc/speechkit/box-media.key"
# pinned_ca_file = "/etc/speechkit/box-media-ca.crt"
# pinned_ca_sha256 = "REPLACE_WITH_64_LOWERCASE_HEX_DER_SHA256"
# token_env = "SPEECHKIT_BOX_MEDIA_KITCHEN_TOKEN"
# device_id = "speaker-kitchen-001"
# pairing_id = "pairing-kitchen-2026-07"
# room_id = "kitchen"
# transcript = "turn off the kitchen light"
# command_id = "kitchen-light-off"
# locale = "en-US"

# [model_selection.tts]
# # Voice-Output model selection — pins which TTS provider Assist and
# # Voice-Agent use when speaking back to the user. Same shape as
# # [model_selection.assist] / .voice_agent / .dictate. v0.37.2 added
# # this so Thalia + Companion-Live deployments can pick a stable
# # voice ("Studio-O DE", "OpenAI Nova HD", "Piper Thorsten") without
# # editing the lower-level [tts.providers.*] blocks.
# #
# # Catalog IDs (see pkg/speechkit/catalog.go):
# #   tts.local.kokoro-82m                Local Built-in (Apache-2.0, ~50MB ONNX, EN, RECOMMENDED v0.37.3 default)
# #   tts.local.supertonic-3              Local Built-in (OpenRAIL, multilingual 32 langs incl. DE)
# #   tts.local.chatterbox-multilingual   Local Built-in (MIT, 24 langs, voice-clone)
# #   tts.local.piper                     Local Built-in (MIT, HA-compatible voice catalog)
# #   tts.openedai.kokoro                 Local Provider (OpenAI-compatible Kokoro container)
# #   tts.huggingface.parler-multilingual Cloud Provider (HF Inference Router)
# #   tts.google.studio-o-de              Direct Provider (Studio-O DE, default for installs with GOOGLE_AI_API_KEY)
# #   tts.openai.tts-1-hd                 Direct Provider (OpenAI TTS-1-HD, six voices)
# primary_profile_id = "tts.google.studio-o-de"
# fallback_profile_id = "tts.local.kokoro-82m"     # Local fallback when cloud is unavailable
# mode_source = "local"

# ── External Coding Agent Bridge (desktop-only, default OFF) ─────────────────
# Voice-driven local coding agents (AI-VOICE-SPEECHKIT-TARGET.md 2026-08-10).
# First implementation: the official OpenAI Codex CLI via `codex app-server` /
# `codex exec`. The bridge only DETECTS the CLI's own sign-in (ChatGPT
# subscription or API key) — it never stores or refreshes credentials itself.
# Fail-closed: both enable flags are required, the agent may only start inside
# the project allowlist below, and the sandbox ceiling defaults to read-only.
# "danger-full-access" is not accepted anywhere.
#
# [agent_bridge]
# enabled = false
#
# [agent_bridge.codex]
# enabled = false
# binary_path = ""                    # empty = PATH lookup; set to pin an absolute path
# mode = "auto"                       # auto | app_server | exec
# sandbox = "read-only"               # global ceiling: read-only | workspace-write
# approval_timeout_sec = 120          # unanswered approval card => deny
# narration = "summary"               # off | summary | verbose
# max_concurrent_turns = 1
#
# [[agent_bridge.codex.projects]]     # allowlist: Codex may ONLY start in these dirs
# alias = "speechkit"                 # spoken-friendly, unique
# path = 'D:\Github\kombify\kombify-SpeechKit'
# sandbox = "read-only"               # effective = min(global, project)
