[general]
language = "de"                    # Default transcription language
dictate_hotkey = "ctrl+win"        # Dictation hotkey (hold-to-talk, speech-to-text only)
assist_hotkey = "win+alt"          # Assist hotkey (one-shot utility mode). Blank disables the mode.
voice_agent_hotkey = "ctrl+shift"  # Voice Agent hotkey (realtime dialogue mode). Blank disables the mode.
# Hotkey behaviour: "hold_to_talk" (hold to capture, release to end) or "toggle"
# (press to start, press again to stop). Legacy configs may still set
# "push_to_talk" — the loader normalises it to "hold_to_talk" automatically.
dictate_hotkey_behavior = "hold_to_talk"
assist_hotkey_behavior = "hold_to_talk"
voice_agent_hotkey_behavior = "hold_to_talk"
dictate_enabled = true
assist_enabled = false
voice_agent_enabled = false
eager_warmup = false                 # Optional: call mode Warmup before Start when a runtime implements it.
active_mode = "none"               # none, dictate, assist, voice_agent
agent_hotkey = "win+alt"           # Deprecated compatibility alias. SpeechKit now persists assist_hotkey + voice_agent_hotkey separately.
agent_mode = "assist"              # Deprecated compatibility alias for legacy agent_hotkey readers.
hotkey = "ctrl+win"                # Legacy alias for dictate_hotkey
hotkey_mode = "hold_to_talk"
auto_stop_silence_ms = 1500
fast_mode_silence_ms = 1500
dictate_silence_timeout_sec = 15  # Seconds of silence before toggle dictation auto-stops. 0 disables.
model_download_dir = ""            # Blank = %LOCALAPPDATA%/SpeechKit/models. Set a dedicated folder for local model downloads.

# [output] tunes how the Device-Target injects transcribed text into the
# focused application. "auto" picks a per-app paste shortcut from built-in
# profiles (browsers and Windows Terminal use Ctrl+V, Termius/Hyper/Alacritty
# Ctrl+Shift+V, PuTTY/mintty Shift+Insert) and waits for hotkey modifiers to
# be physically released before pasting. "clipboard" always pastes with plain
# Ctrl+V; "type" simulates Unicode typing and never touches the clipboard.
[output]
default_strategy = "auto"   # auto | clipboard | type
modifier_wait_ms = 1000     # Max wait for held hotkey modifiers before injecting.
focus_verify_ms = 300       # Max wait for the target window to reach the foreground.
restore_clipboard = true    # Restore the previous clipboard content after paste.
restore_delay_ms = 300      # Pause between paste and clipboard restore.
# Per-app overrides force a strategy and/or paste chord for one executable
# (base name without .exe, case-insensitive). Examples:
# [[output.app_overrides]]
# process_name = "someterminal"
# paste_combo = "ctrl+shift+v"   # ctrl+v | ctrl+shift+v | shift+insert
#
# [[output.app_overrides]]
# process_name = "legacyapp"
# strategy = "type"              # clipboard | type

[speech]
language = "de"          # Canonical cross-provider speech language. general.language remains a compatibility alias.
detect_language = false  # When supported, omit/fill provider-native auto language detection.
punctuation = true
smart_format = true
vocabulary_bias = true   # Use SpeechKit Words/Replacements as provider-native hints where available.
timestamps = false
endpointing_ms = 0       # Provider endpointing/turn silence where supported. 0 = provider/SpeechKit default.
turn_detection = true
voice = ""
speed = 1.0
audio_format = "mp3"

[ui]
overlay_enabled = true    # Show the top-center overlay
overlay_position = "top"  # top, bottom, left, right
overlay_movable = false   # When true, the pill can be dragged away from its anchored side
overlay_free_x = 0        # Center point in screen coordinates when overlay_movable = true
overlay_free_y = 0        # Center point in screen coordinates when overlay_movable = true
# overlay_monitor_positions stores per-monitor movable overlay positions automatically.
# Example:
# [ui.overlay_monitor_positions."0,0,2560,1440"]
# x = 1280
# y = 180
visualizer = "pill"       # pill or circle
design = "default"        # default or kombify

[local]
enabled = true
model = "ggml-small.bin"
model_path = ""           # Auto: ./models/ first, then %LOCALAPPDATA%/SpeechKit/models/
port = 9000               # whisper-server port
gpu = "auto"              # auto, cuda, vulkan, cpu

[local_llm]
enabled = false
base_url = "http://127.0.0.1:8082/v1" # SpeechKit-managed OpenAI-compatible local LLM runtime endpoint
model = "gemma4:e4b"
model_path = ""                      # Downloaded GGUF model path; blank = managed model directory
port = 8082
gpu = "auto"                         # auto, cuda, vulkan, cpu
utility_model = "gemma4:e4b"
assist_model = "gemma4:e4b"
agent_model = "gemma4:e4b"

[vps]
enabled = false
url = ""                  # Example: https://voice.example.com
api_key_env = "SPEECHKIT_SELF_HOSTED_API_KEY"  # Environment variable name

[huggingface]
enabled = false           # Legacy STT toggle for HF routed inference; dedicated HF Endpoints are modeled separately in the profile catalog
model = "openai/whisper-large-v3" # Routed/shared provider model, not a dedicated endpoint deployment
token_env = "HF_TOKEN"    # Fallback env var when no stored host token exists
# utility_model = "Qwen/Qwen3.5-9B"
# assist_model = "Qwen/Qwen3.5-27B"
# agent_model = "Qwen/Qwen3.5-27B" # Voice Agent pipeline fallback / legacy agent flow

[routing]
strategy = "local-only"   # dynamic, local-only, cloud-only
prefer_local_under_seconds = 10
parallel_cloud = false    # Start cloud parallel to local
replace_on_better = false # Silently replace with better result

[logging]
# General application log (transcription events, mode switches, wake-word
# triggers). Shown live in the dashboard's "Logs" tab when enabled.
# Default "off" — privacy-first. Turn on to "info" or "debug" if you want
# to see what SpeechKit is doing.
#
# The 900ms desktop overlay sync loop emits a few log lines per tick; at
# "debug" the file fills with ~10k entries/hour and burns CPU on slower
# machines. "info" is the recommended setting for live troubleshooting.
# "off" short-circuits the writer before any I/O syscall.
#
# SPEECHKIT_LOG_LEVEL overrides this field at startup — useful for
# one-session debug toggles without editing config.toml.
level = "off"                # debug | info | warn | error | off
max_file_size_mb = 50         # rotate when speechkit.log grows past this
max_files = 30                # keep at most N rotated logs (older are pruned)

[audit]
# Structured compliance trail (SOC2 / ISO27001 evidence). No transcript
# content — only event metadata (timestamp, mode, model, outcome).
# Independent from [logging]. Default false — opt-in. Enable this only if
# your deployment has a compliance obligation; otherwise leave off so
# nothing is written to disk by default.
enabled = false
retention_days = 90           # 0 disables automatic pruning
event_log_enabled = false      # mirror to Windows Event Log
# otlp_endpoint = "..."        # OTLP exporter target; blank disables OTLP

[feedback]
save_audio = true         # Legacy compat only; [store] is the preferred config surface
audio_retention_days = 7  # Mirrored from [store] while legacy readers still exist
db_path = ""              # Auto: %APPDATA%/SpeechKit/feedback.db
max_audio_storage_mb = 500

[store]
backend = "sqlite"        # Local mode default
sqlite_path = ""          # Auto: %APPDATA%/SpeechKit/feedback.db (audio files live in sibling audio/)
postgres_dsn = ""         # Required when backend = "postgres"
save_audio = true         # Persist raw WAV files locally
audio_retention_days = 7  # 0 disables automatic deletion
max_audio_storage_mb = 500

[vocabulary]
dictionary = ""           # Migration/compat only. One entry per line; mapped into Words plus substitution Replacements.

[customization]
active_template_ids = ["standard-punctuation-de-en"] # Native Words/Replacements templates. Add "developer-de-en" for developer dictation.

# ──────────────────────────────────────────────
# Mode Model Selection — same per-mode provider settings exposed by /api/v1/modes/{mode}/settings
# Every mode supports the four V23 provider groups: local built-in, local provider, cloud provider, direct provider.
# Use GET /api/v1/providers/profiles and GET /api/v1/providers/readiness for host-managed setup flows.
#
# Each mode also has an optional `mode_source` field:
#   "local"  — run the mode against the in-process Framework kernel (default).
#   "server" — route the mode through [server_connection] to a remote
#              speechkit-server. The mode source is the runtime routing gate;
#              server_connection.enabled is kept as a compatibility mirror.
# Empty / missing is treated as "local" so existing configs keep their
# pre-0.26 behaviour.
# ──────────────────────────────────────────────

[model_selection.dictate]
primary_profile_id = "stt.local.whispercpp"    # Default local built-in primary. Alternatives: stt.ollama.gemma4-e4b-transcribe, stt.routed.whisper-large-v3, stt.openai.whisper-1
fallback_profile_id = ""
mode_source = "local"  # "local" | "server"

[model_selection.assist]
primary_profile_id = "assist.builtin.gemma4-e4b"    # Default local built-in Assist LLM. Alternatives: assist.ollama.gemma4-e4b, assist.openai.gpt-5.4
fallback_profile_id = ""
mode_source = "local"

[model_selection.voice_agent]
primary_profile_id = "realtime.builtin.pipeline" # Default local Voice Agent pipeline. Enable Gemini / Google AI to use realtime.google.gemini-native-audio.
fallback_profile_id = ""
mode_source = "local"

# ──────────────────────────────────────────────
# SpeechKit Server — standalone Linux HTTP/WebSocket target
# Defaults fail closed: protected routes require a bearer token from the
# configured environment variable. auth_mode = "none" is only for loopback
# development/test binds; public no-auth binds are rejected at startup.
# ──────────────────────────────────────────────

[server]
listen_addr = ":8080"                         # Bind address for speechkit-server. Use "127.0.0.1:8080" for local-only no-auth tests.
public_url = ""                               # External API base for generated WS URLs, e.g. "https://speechkit.example.com/api".
modes = ["dictation", "assist", "voiceagent"] # Empty/missing enables all three modes.
auth_mode = "bearer"                          # bearer, edge_hmac, bearer_or_edge, none
bearer_token_env = "SPEECHKIT_SERVER_TOKEN"   # Env var name only; token value must not be committed.
bearer_role = ""                              # Optional static role for bearer callers, e.g. "admin" for trusted single-operator installs.
edge_auth_secret_env = "EDGE_AUTH_SECRET"     # Env var name for edge_hmac mode.
cors_allowed_origins = []                     # Set explicit origins for browser/WS clients; empty disables browser-origin access.
rate_limit_rps = 10
rate_limit_burst = 20
# Per-endpoint token costs. Keys: "METHOD PATH" (preferred) or bare PATH.
# Default 1.0 for entries not listed. Audit S-4: ensure expensive
# handlers drain the global bucket proportionally to their cost.
rate_limit_endpoint_costs = { "POST /v1/dictation/transcribe" = 5.0, "POST /v1/assist/process" = 3.0, "POST /v1/voiceagent/sessions" = 10.0 }
# Hard daily ceiling for Plan="demo" identities (smoke-token surface).
# Keyed by UserID + client IP. Zero disables the quota. Audit S-5.
demo_daily_quota = 100
max_upload_mb = 25
read_header_timeout_sec = 15
read_timeout_sec = 120
idle_timeout_sec = 120
max_header_bytes = 1048576
max_decoded_audio_seconds = 600
trusted_proxy_cidrs = []                      # CIDRs allowed to supply X-Forwarded-* headers; loopback is always trusted.
max_voice_agent_sessions = 100
max_sessions_per_user = 3
ticket_ttl_sec = 90
voice_agent_idle_timeout_sec = 900
# Optional hard cap for a single Voice Agent WebSocket session. Zero disables
# the cap for normal self-hosted installs; public beta origins should set it.
voiceagent_max_session_sec = 0
# Per-frame size cap on the Voice Agent WebSocket. Defaults to 65536
# (64 KiB) when unset or non-positive. Tightened from the historical
# 1 MiB default in audit S-12 because raw PCM chunks are well under
# 4 KB in practice. Raise only for non-standard payloads.
ws_read_limit_bytes = 65536
whisper_binary = "/usr/local/bin/whisper-server"
whisper_port = 8180
model_dir = "/var/lib/speechkit/models"
log_format = "json"
log_level = "info"

[server.features]
catalog = true
storage_reads = true
vocabulary = true
tts_direct = true

# ──────────────────────────────────────────────
# Server Connection — points the desktop app at a remote speechkit-server.
# Only consulted when at least one mode has mode_source = "server".
# The server itself ignores this section; this is a device/local-target
# concern only.
# ──────────────────────────────────────────────

[server_connection]
enabled = false                              # Master switch. When false, every mode forces back to local.
url = ""                                      # Optional remote target. Local mode is still the startup default.
bearer_token_env = "SPEECHKIT_SERVER_TOKEN"  # Env var name. The token value is never read from this file.
auth_mode = "bearer"                         # bearer = Authorization header, api_key = X-Api-Key, edge_beta = anonymous managed-beta edge broker.
fallback_to_local = true                     # If a server call fails, retry against the in-process kernel.
request_timeout_sec = 30                     # Caps non-streaming HTTP calls. WebSocket sessions are unaffected.
# Only used by auth_mode = "edge_beta". Values are generated locally on first
# use and stored via the host secret store; these are per-install beta IDs, not
# shared server/provider credentials.
beta_install_id_env = "SPEECHKIT_BETA_INSTALL_ID"
beta_install_secret_env = "SPEECHKIT_BETA_INSTALL_SECRET"

# ──────────────────────────────────────────────
# Shortcuts — additive command aliases per locale
# Extends the built-in OSS lexicon without patching Go code.
# Use quoted locale keys for region-specific overrides like "de-at" or "en-us".
# ──────────────────────────────────────────────

# [shortcuts.locale.de]
# leading_fillers = ["bitte", "hey speechkit"]
# summarize = ["kurzfassung", "briefing"]
# copy_last = ["kopier den letzten block"]
# insert_last = ["setz das ein"]
# quick_note = ["merkzettel"]

# [shortcuts.locale.en]
# leading_fillers = ["please", "hey speechkit"]
# summarize = ["brief me", "tl dr"]

# ──────────────────────────────────────────────
# TTS — Text-to-Speech (Assist Mode)
# Assist can return text plus optional audio. The host decides whether to play the result aloud.
# ──────────────────────────────────────────────

[tts]
enabled = true
strategy = "cloud-first"      # cloud-first, local-first, cloud-only, local-only
speed = 1.0                   # 0.25 - 4.0
format = "mp3"                # mp3, wav, opus, pcm

[tts.openai]
enabled = true
model = "tts-1"               # tts-1 or tts-1-hd
voice = "nova"                # alloy, echo, fable, onyx, nova, shimmer

[tts.google]
enabled = false
voice = "de-DE-Neural2-B"     # Google Cloud TTS voice name

[tts.deepgram]
enabled = false
model = "aura-2-thalia-en"    # Deepgram Aura-2 voice id; reuses DEEPGRAM_API_KEY from [providers.deepgram]
voice = ""                    # optional explicit voice override (alias of model)

[tts.huggingface]
enabled = false
model = "parler-tts/parler-tts-mini-multilingual-v1.1"  # Multilingual TTS via HF Inference API

[tts.local]
enabled = false
model = "hexgrad/Kokoro-82M"
model_path = ""
port = 8081

[tts.piper]
# Offline Piper subprocess TTS — Home-Assistant compatible voices, MIT licensed.
# Pair with Ollama + whisper.cpp for a fully offline Voice-Companion stack.
# Voice models are NOT bundled. Run scripts/prepare-piper-voices.{ps1,sh} once
# to download en_US-amy-medium + de_DE-thorsten-medium into voice_dir.
enabled = false
binary = ""                              # piper executable; empty => "piper" on PATH
voice_dir = ""                           # directory holding *.onnx voice files (e.g. %LOCALAPPDATA%/SpeechKit/piper-voices)
timeout_sec = 30                         # subprocess timeout
# [tts.piper.default_voices]             # per-locale voice override
# en = "en_US-amy-medium.onnx"
# de = "de_DE-thorsten-medium.onnx"

# ──────────────────────────────────────────────
# Voice Agent — realtime live session
# Gemini Live is the canonical Voice Agent runtime. The Voice Agent contract is realtime-first and separate from Assist.
# ──────────────────────────────────────────────

[voice_agent]
enabled = true
provider = "gemini"                        # Realtime backend: "gemini" (default), "openai", "deepgram"; Server-Target also accepts "cascaded"/"moshi"
model = "gemini-2.5-flash-native-audio-preview-12-2025" # Recommended Voice Agent default
fallback_model = "gpt-realtime-mini"       # Fallback if primary unavailable
voice = "Kore"                             # Voice for real-time model
agent_profile_id = "default"               # default, brainstorming_companion, humor_companion, support_companion
agent_sequence_id = ""                     # Optional workflow sequence override. Empty = selected profile/persona default.
framework_prompt = ""                      # Durable host/framework prompt. Empty = SpeechKit default Voice Agent framework behavior.
refinement_prompt = ""                     # Optional personal refinement prompt layered on top of the framework prompt.
barge_in = "auto"                          # Interrupt the agent mid-answer: "auto" (full duplex on headsets), "always", "never"
reminder_after_idle_sec = 300              # Remind user after 5 min silence
deactivate_after_idle_sec = 900            # Auto-deactivate after 15 min silence
hold_release_grace_sec = 10                # Hold-to-talk: how long a release waits for the final answer to START. An in-flight answer always finishes playing (capped at 30s total). 0 -> default (10).
warm_session_linger_sec = 60               # Hold-to-talk resume window: keep the realtime connection warm this long after an answer so the next press resumes the dialog without a new handshake (~700ms). Session summary + panel close only run when the window expires. 0 -> deactivate immediately (legacy). Clamped to 120s.
pause_tolerance_ms = 800                   # Short silences up to this tolerance are filtered from the mic stream so the agent does not answer during brief thinking pauses. Effective answer delay = tolerance + provider endpointing. 0 -> provider default. Clamped to 3000ms.
pipeline_fallback = false                  # Uses STT -> Agent LLM -> optional TTS for non-realtime Voice Agent profiles.
show_prompter = true                       # Show live transcript window during voice agent
enable_session_summary = true              # Generate a structured dialogue summary when a session ends
enable_input_transcript = true             # Server-side transcript of the user's speech
enable_output_transcript = true            # Server-side transcript of the model's speech
enable_affective_dialog = false            # Uses Gemini Live v1alpha; not supported on Gemini 3.1 Flash Live
thinking_enabled = false                   # Enable Gemini thinking for harder tasks
include_thoughts = false                   # Include thought traces when the model supports them
thinking_budget = 0                        # Optional token budget for thinking
thinking_level = "medium"                  # off, low, medium, high
context_compression_enabled = true         # Keep long sessions healthy with server-side compression
context_compression_trigger_tokens = 12000
context_compression_target_tokens = 6000
automatic_activity_detection = true        # Gemini Live server-side VAD / turn detection
activity_handling = "start_of_activity_interrupts" # start_of_activity_interrupts, no_interrupt
turn_coverage = "turn_includes_only_activity"      # turn_includes_only_activity, turn_includes_all_input, turn_includes_audio_activity
vad_start_sensitivity = "low"              # low or high
vad_end_sensitivity = "low"                # low or high
vad_prefix_padding_ms = 100
vad_silence_duration_ms = 700

