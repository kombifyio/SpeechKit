* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  font-size: 14px;
  color: var(--page-text);
  background:
    radial-gradient(ellipse at 20% 0%, rgba(56, 189, 248, 0.08), transparent 45%),
    radial-gradient(ellipse at 90% 100%, rgba(129, 140, 248, 0.07), transparent 50%),
    var(--page-bg);
}
.shell {
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.kicker {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--page-text-muted);
}
.topbar h1 { margin: 0; font-size: 18px; }
.topbar-actions { display: flex; gap: 8px; }
button {
  font: inherit;
  color: var(--page-text);
  background: var(--page-panel);
  border: 1px solid var(--page-border);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
button:hover { border-color: rgba(242, 245, 247, 0.3); }
button.primary {
  background: color-mix(in srgb, var(--page-accent) 24%, transparent);
  border-color: color-mix(in srgb, var(--page-accent) 45%, transparent);
}
button:disabled { opacity: 0.5; cursor: default; }
button.subtle { border: 0; background: transparent; color: var(--page-text-muted); padding: 4px 8px; }
.appearance-panel {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  border: 1px solid var(--page-border);
  border-radius: 16px;
  background: var(--page-panel);
  padding: 10px 14px;
}
.field { display: flex; align-items: center; gap: 8px; }
.field-label, .token-row span {
  font-size: 11px;
  color: var(--page-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.chip-row { display: flex; gap: 6px; }
.chip-row button { padding: 4px 10px; font-size: 12px; }
.chip-row button[data-active="true"] {
  border-color: color-mix(in srgb, var(--page-accent) 60%, transparent);
  background: color-mix(in srgb, var(--page-accent) 18%, transparent);
}
.field-inline { font-size: 13px; gap: 6px; }
.assistant-host {
  flex: 1;
  min-height: 0;
  border: 1px solid var(--page-border);
  border-radius: 20px;
  background: var(--page-panel);
  overflow: hidden;
}
.assistant-host speechkit-voice-assistant { display: block; height: 100%; }
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--page-text-muted);
}
.token-row { display: flex; align-items: center; gap: 8px; }
.token-row input {
  font: inherit;
  color: var(--page-text);
  background: var(--page-panel);
  border: 1px solid var(--page-border);
  border-radius: 10px;
  padding: 5px 9px;
  min-width: 220px;
}

    --page-border: rgba(16, 20, 24, 0.12);

.ind {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: var(--sk-indicator-height, 14px);
  flex: none;
  color: var(--sk-accent, oklch(0.65 0.13 210));
}
.ind-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: var(--sk-radius-pill, 999px);
  background: currentColor;
  transition: background-color var(--sk-motion-base, 180ms) ease;
}
.ind-bars {
  display: none;
  align-items: center;
  gap: var(--sk-indicator-bar-gap, 2px);
  height: 100%;
}
.ind-bar {
  width: var(--sk-indicator-bar-width, 3px);
  height: 100%;
  border-radius: var(--sk-radius-pill, 999px);
  background: currentColor;
  transform: scaleY(var(--h, 0.18));
  transition: transform var(--sk-motion-level, 90ms) linear;
}
.ind[data-state="requesting"] .ind-dot {
  background: var(--sk-pending, #d97706);
  animation: sk-ind-pulse 1.2s ease-in-out infinite;
}
.ind[data-state="listening"] { color: var(--sk-live, #dc2626); }
.ind[data-state="listening"] .ind-dot { background: var(--sk-live, #dc2626); }
.ind:is([data-state="listening"], [data-state="processing"], [data-state="speaking"]) .ind-bars {
  display: inline-flex;
}
.ind:is([data-state="processing"], [data-state="speaking"]) .ind-dot { display: none; }
/* Error is a hollow ring so it never reads as the solid "recording" dot. */
.ind[data-state="error"] .ind-dot {
  box-sizing: border-box;
  background: transparent;
  border: 2px solid var(--sk-danger, #dc2626);
}
.ind[data-state="processing"] .ind-bar {
  animation: sk-ind-sweep 900ms ease-in-out infinite;
}
.ind:not([data-levels]):is([data-state="listening"], [data-state="speaking"]) .ind-bar {
  animation: sk-ind-wave 1100ms ease-in-out infinite;
}
.ind-bar:nth-child(2) { animation-delay: 90ms; }
.ind-bar:nth-child(3) { animation-delay: 180ms; }
.ind-bar:nth-child(4) { animation-delay: 270ms; }
.ind-bar:nth-child(5) { animation-delay: 360ms; }
@keyframes sk-ind-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@keyframes sk-ind-sweep {
  0%, 100% { transform: scaleY(0.25); opacity: 0.5; }
  40% { transform: scaleY(0.75); opacity: 1; }
}
@keyframes sk-ind-wave {
  0%, 100% { transform: scaleY(0.3); }
  50% { transform: scaleY(0.85); }
}
@media (prefers-reduced-motion: reduce) {
  .ind-dot, .ind-bar { animation: none !important; transition: none !important; }
  .ind-bar { transform: scaleY(0.45) !important; }
  .ind-bar:nth-child(2), .ind-bar:nth-child(4) { transform: scaleY(0.7) !important; }
  .ind-bar:nth-child(3) { transform: scaleY(1) !important; }

:host {

:host([data-empty]) { display: none; }
.wrap { display: grid; gap: 4px; max-width: 100%; }
.notice {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  max-width: 100%;
  min-height: var(--sk-chip-height, 30px);

  padding: 0 4px 0 10px;

.mark {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: var(--sk-radius-pill, 999px);
  background: var(--sk-danger, #dc2626);
}
:host([tone="warning"]) .mark { background: var(--sk-pending, #d97706); }
:host([tone="info"]) .mark { background: var(--sk-accent, oklch(0.65 0.13 210)); }
.msg {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-weight: 600;
}
button {
  flex: none;
  border: 0;
  border-radius: var(--sk-radius-pill, 999px);
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  padding: 4px 8px;
  white-space: nowrap;
  transition: background-color var(--sk-motion-base, 180ms) ease;
}
button:hover { background: color-mix(in srgb, currentColor 8%, transparent); }

.retry { color: var(--sk-accent, oklch(0.65 0.13 210)); }
.close {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  padding: 0;
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
}
.details {
  display: grid;
  gap: 2px;
  margin: 0;
  padding: 0 12px;
  font-size: var(--sk-font-size-small, 11px);
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.details[hidden] { display: none; }
.details p { margin: 0; }
.meta { font-variant-numeric: tabular-nums; opacity: 0.85; }
@keyframes sk-notice-in {
  from { opacity: 0; transform: translateY(2px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .notice { animation: none; }
}

}
.overlay {

.transcript:empty { display: none; }

  display: grid;
  gap: 2px;
  margin: 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;

.role {
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.turn .text {
  font-weight: 600;
}
.turn[data-role="user"] .text {
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: calc(var(--sk-font-size, 13px) - 1px);
  font-weight: 500;
}
.turn[data-draft] .text {
  opacity: 0.55;

.turn[data-interrupted] .text::after {
  content: " \\2026";
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));

.jump {
  position: absolute;
  bottom: 8px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  border: 1px solid var(--sk-border, color-mix(in srgb, currentColor 12%, transparent));
  border-radius: var(--sk-radius-pill, 999px);
  background: var(--sk-surface-strong, color-mix(in srgb, #ffffff 92%, transparent));
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: var(--sk-font-size-small, 11px);
  font-weight: 600;
  padding: 4px 10px;
}
:host(:dir(rtl)) .jump {
  transform: translateX(50%);
}
.stage {
  display: grid;
  flex: 0 0 auto;
  justify-items: center;
  gap: 6px;
  padding: 12px 14px 12px;
}
.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--sk-font-size-small, 11px);
  font-weight: 700;
}
.status[data-state="listening"] { color: var(--sk-live, #dc2626); }
.hint {
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: var(--sk-font-size-small, 11px);
}
.ended {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: var(--sk-font-size-small, 11px);
}
.reconnect {

  font-weight: 600;

  padding: 0;
}
.exit:hover { background: color-mix(in srgb, currentColor 10%, transparent); color: var(--sk-text, inherit); }
.orb {
  border: 0;

  cursor: pointer;
  padding: 0;
}
.consent-wrap {
  padding: 16px 14px;

.sr-only {

  white-space: nowrap;
}

:host {
  display: block;
  min-width: 0;
  color: var(--sk-text, inherit);
  font-size: var(--sk-font-size, 13px);
  --sk-transcript-line: 1.4em;
}
:host([data-empty]) { display: none; }
.view {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  max-height: calc(var(--sk-transcript-line) * var(--sk-transcript-lines, 2));
  overflow: hidden;
  line-height: var(--sk-transcript-line);
  mask-image: linear-gradient(to bottom, transparent 0, #000 0.9em);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 0.9em);

  --sk-transcript-lines: 1;

:host([lines="1"]:dir(rtl)) .view {
  mask-image: linear-gradient(to left, transparent 0, #000 2.5em);

  overflow-wrap: anywhere;
  transition: opacity var(--sk-motion-base, 180ms) var(--sk-motion-ease, ease);
}
:host([lines="1"]) .text {
  flex: none;
  white-space: nowrap;
}
.text[data-draft] { opacity: 0.62; }
.text[data-role="agent"] { font-weight: 500; }
.placeholder { color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent)); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .text { transition: none; }
}

:host {
  display: none;
  color: var(--sk-text, inherit);
  font-size: var(--sk-font-size, 13px);
  z-index: 2147482000;
}
:host([open]) { display: block; }
:host([anchor]) { position: absolute; }
:host([anchor="above"]) { bottom: calc(100% + 8px); inset-inline-start: 0; }
:host([anchor="below"]) { top: calc(100% + 8px); inset-inline-start: 0; }
:host([anchor="start"]) { inset-inline-end: calc(100% + 8px); bottom: 0; }
:host([anchor="end"]) { inset-inline-start: calc(100% + 8px); bottom: 0; }
.card {
  display: flex;
  flex-direction: column;
  width: min(92vw, var(--sk-dialog-width, 340px));
  max-height: var(--sk-dialog-max-height, 260px);
  box-sizing: border-box;
  border: 0;
  border-radius: var(--sk-dialog-radius, 18px);
  background: var(--sk-dialog-surface, color-mix(in srgb, #ffffff 58%, transparent));
  backdrop-filter: blur(var(--sk-dialog-blur, 22px)) saturate(1.2);
  -webkit-backdrop-filter: blur(var(--sk-dialog-blur, 22px)) saturate(1.2);
  box-shadow: var(--sk-dialog-shadow, 0 18px 48px -20px rgba(16, 20, 24, 0.35));
  overflow: hidden;
  animation: sk-dialog-in var(--sk-motion-base, 180ms) var(--sk-motion-ease, ease-out);
}
.turns {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
  padding: 12px 14px 4px;
  scrollbar-width: none;
  mask-image: linear-gradient(to bottom, transparent 0, #000 var(--sk-dialog-fade, 28px));
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--sk-dialog-fade, 28px));
}
.turns::-webkit-scrollbar { display: none; }
.turns:empty { display: none; }
.turn {
  max-width: 88%;
  margin: 0;
  line-height: 1.4;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.turn[data-role="agent"] { align-self: flex-start; }
.turn[data-role="user"] {
  align-self: flex-end;
  text-align: end;
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: calc(var(--sk-font-size, 13px) - 1px);
}
.turn[data-draft] { opacity: 0.62; }
.turn[data-interrupted]::after {
  content: " \\2026";
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 4px 6px 4px 12px;
}
.status {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  font-size: var(--sk-font-size-small, 11px);
  font-weight: 600;
}
.bar[data-state="listening"] .status { color: var(--sk-live, #dc2626); }
.notice-slot { flex: 1 1 auto; min-width: 0; }
.notice-slot:empty { display: none; }
.icon {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  flex: none;
  border: 0;
  border-radius: var(--sk-radius-pill, 999px);
  background: transparent;
  color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent));
  cursor: pointer;
  padding: 0;
  transition: background-color var(--sk-motion-base, 180ms) ease, color var(--sk-motion-base, 180ms) ease;
}
.icon:hover { background: color-mix(in srgb, currentColor 10%, transparent); color: var(--sk-text, inherit); }
.icon.end:hover { color: var(--sk-danger, #dc2626); }
.icon:focus-visible { outline: 2px solid var(--sk-accent, oklch(0.65 0.13 210)); outline-offset: 1px; }
.icon[hidden], .ind[hidden], .status[hidden] { display: none; }
.bar[data-state="error"] .icon { align-self: flex-start; margin-top: 3px; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}
@keyframes sk-dialog-in {
  from { opacity: 0; transform: translateY(4px) scale(0.985); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
}

:host {
  display: block;
  color: var(--sk-text, inherit);
  font-size: var(--sk-font-size, 13px);
  height: 100%;
}
:host([size="orb"]) {
  display: inline-grid;
  place-items: center;
  height: auto;
}
.va {
  height: 100%;
  display: flex;
  --level: 0;
  --aura-a: var(--sk-aura-inactive-a, 156, 163, 184);
  --aura-b: var(--sk-aura-inactive-b, 100, 116, 139);
  --tone: rgb(var(--aura-a));
  --tone-soft: rgba(var(--aura-a), 0.22);
}
.va[data-aura="connecting"] { --aura-a: var(--sk-aura-connecting-a, 56, 189, 248); --aura-b: var(--sk-aura-connecting-b, 129, 140, 248); }
.va[data-aura="listening"] { --aura-a: var(--sk-aura-listening-a, 52, 211, 153); --aura-b: var(--sk-aura-listening-b, 56, 189, 248); }
.va[data-aura="processing"] { --aura-a: var(--sk-aura-processing-a, 251, 191, 36); --aura-b: var(--sk-aura-processing-b, 244, 114, 182); }
.va[data-aura="speaking"] { --aura-a: var(--sk-aura-speaking-a, 129, 140, 248); --aura-b: var(--sk-aura-speaking-b, 167, 139, 250); }
.va[data-aura="recovering"] { --aura-a: var(--sk-aura-recovering-a, 34, 211, 238); --aura-b: var(--sk-aura-recovering-b, 129, 140, 248); }
.va[data-aura="settling"] { --aura-a: var(--sk-aura-settling-a, 52, 211, 153); --aura-b: var(--sk-aura-settling-b, 129, 140, 248); }
.va[data-aura="error"] { --aura-a: var(--sk-aura-error-a, 248, 113, 113); --aura-b: var(--sk-aura-error-b, 251, 113, 133); }

/* \u2500\u2500 Orb \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Layer stack (outward \u2192 inward): breathing glow, aurora sweep,
   counter-rotating inner sweep, level-reactive halo ring, glassy
   core, centre spark, brand mark. Identical geometry and timings in
   the Compose and LVGL ports (tokens.json \u2192 assistant). */
.orb {
  position: relative;
  width: var(--sk-assistant-orb, 30px);
  height: var(--sk-assistant-orb, 30px);
  aspect-ratio: 1;
  flex: none;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: default;
  font: inherit;
  color: inherit;
}
.va[data-status="speaking"] .orb { cursor: pointer; }
.orb:focus-visible { outline: 2px solid var(--sk-accent, oklch(0.65 0.13 210)); outline-offset: 2px; border-radius: 50%; }
.orb > * { position: absolute; border-radius: 50%; }
.orb .glow {
  inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(var(--aura-a), 0.38), rgba(var(--aura-a), 0.08) 55%, rgba(var(--aura-a), 0) 72%);
  animation: sk-aura-breathe 4.5s ease-in-out infinite;
}
.orb .sweep {
  inset: 6%;
  overflow: hidden;
  opacity: 0.9;
  background: conic-gradient(from 0deg, rgba(var(--aura-a), 0) 0deg, rgba(var(--aura-a), 0.55) 90deg, rgba(var(--aura-b), 0) 200deg, rgba(var(--aura-b), 0.45) 300deg, rgba(var(--aura-a), 0) 360deg);
  filter: blur(6px);
  animation: sk-aura-spin 9s linear infinite;
}
.orb .sweep-inner {
  inset: 16%;
  overflow: hidden;
  opacity: 0.8;
  background: conic-gradient(from 180deg, rgba(var(--aura-b), 0) 0deg, rgba(var(--aura-b), 0.4) 120deg, rgba(var(--aura-a), 0) 260deg);
  filter: blur(4px);
  animation: sk-aura-spin-reverse 13s linear infinite;
}
.orb .halo {
  inset: 10%;
  border: 1px solid rgba(var(--aura-a), 0.5);
  box-shadow: 0 0 18px rgba(var(--aura-a), 0.35) inset, 0 0 12px rgba(var(--aura-b), 0.28);
  transform: scale(calc(0.82 + var(--level) * 0.3));
  opacity: calc(0.35 + var(--level) * 0.5);
  transition: transform 120ms ease-out, opacity 200ms ease-out;
}
.orb .core {
  inset: 26%;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  background: radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.06) 46%, rgba(255, 255, 255, 0.02) 70%);
  border: 1px solid rgba(255, 255, 255, 0.14);
  animation: sk-aura-core 3.2s ease-in-out infinite;
}
/* Centre spark \u2014 backlight for the brand mark. */
.orb .spark {
  left: 50%;
  top: 50%;
  width: 12%;
  height: 12%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(var(--aura-a), 0.95), rgba(var(--aura-a), 0.2) 70%, rgba(var(--aura-a), 0) 100%);
  opacity: 0.85;
}
/* Resting states: no motion, thinned effects. */
.va:is([data-aura="inactive"], [data-aura="error"]) .orb :is(.glow, .sweep, .sweep-inner, .core) { animation: none; }
.va:is([data-aura="inactive"], [data-aura="error"]) .orb .halo { opacity: 0.18; box-shadow: 0 0 18px rgba(var(--aura-a), 0.12) inset, 0 0 12px rgba(var(--aura-b), 0.08); }
.va:is([data-aura="inactive"], [data-aura="error"]) .orb .spark { opacity: 0.4; }

@keyframes sk-aura-spin { to { transform: rotate(360deg); } }
@keyframes sk-aura-spin-reverse { to { transform: rotate(-360deg); } }
@keyframes sk-aura-breathe {
  0%, 100% { transform: scale(0.92); opacity: 0.55; }
  50% { transform: scale(1.06); opacity: 0.9; }
}
@keyframes sk-aura-core {
  0%, 100% { opacity: 0.78; }
  50% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .orb > *, .mark img { animation: none !important; transition: none !important; }
  .orb .halo, .mark img { transform: none; }
  .orb .spark { transform: translate(-50%, -50%); }
}

/* \u2500\u2500 Brand mark (host-provided via mark-src) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   Part of the motion system, not a sticker: greyscale ghost while
   resting, full colour plus level-driven glow and scale when live. */
.mark {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}
.mark img {
  width: var(--sk-assistant-mark-ratio, 34%);
  height: var(--sk-assistant-mark-ratio, 34%);
  object-fit: contain;
  filter: saturate(1.15) drop-shadow(0 0 calc(4px + var(--level) * 12px) rgba(var(--aura-a), calc(0.35 + var(--level) * 0.4)));
  opacity: 1;
  transform: scale(calc(1 + var(--level) * 0.08));
  transition: filter 420ms ease, opacity 420ms ease, transform 420ms ease;
}
.va:is([data-aura="inactive"], [data-aura="error"]) .mark img {
  filter: grayscale(1) brightness(0.95);
  opacity: 0.5;
  transform: none;
}

/* \u2500\u2500 Waveform variant (variant="waveform") \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   The dual-hue level-history motif in the orb's slot; drawing spec
   in tokens.json \u2192 assistant-variants.waveform. */
.wave-visual {
  position: relative;
  flex: none;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: default;
  font: inherit;
  color: inherit;
}
.va[data-status="speaking"] .wave-visual { cursor: pointer; }
.wave-visual:focus-visible { outline: 2px solid var(--sk-accent, oklch(0.65 0.13 210)); outline-offset: 2px; border-radius: 8px; }
.wave-visual canvas { display: block; width: 100%; height: 100%; }
.wave-visual[data-layout="radial"] {
  width: var(--sk-assistant-orb, 30px);
  height: var(--sk-assistant-orb, 30px);
  border-radius: 50%;
}
.wave-visual[data-layout="linear"] {
  width: var(--sk-assistant-wave-compact-w, 72px);
  height: var(--sk-assistant-wave-compact-h, 22px);
  border-radius: 6px;
}
.va[data-frame="keyboard"] .wave-visual[data-layout="linear"] { flex: 1; width: auto; }

/* \u2500\u2500 Compact: pill (overlay/phone/panel) / bar (keyboard) \u2500\u2500\u2500\u2500\u2500\u2500 */
.compact-shell {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 9px;
  border-radius: var(--sk-radius-pill, 999px);
  background: var(--sk-surface, color-mix(in srgb, #ffffff 72%, transparent));
  border: 1px solid var(--sk-border, color-mix(in srgb, currentColor 12%, transparent));
  backdrop-filter: blur(var(--sk-blur, 16px));
  -webkit-backdrop-filter: blur(var(--sk-blur, 16px));
  box-shadow: var(--sk-shadow, 0 12px 40px -12px rgba(16, 20, 24, 0.25));
  min-width: 0; max-width: 100%;
  margin: auto;
}
.va[data-frame="keyboard"] .compact-shell { width: 100%; border-radius: var(--sk-radius, 14px); margin: 0; }
.compact-line { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compact-line .who { color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent)); font-size: var(--sk-font-size-small, 11px); margin-right: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); flex: none; }
.va:is([data-status="capturing"], [data-status="speaking"]) .status-dot { animation: sk-aura-pulse 1.2s ease-in-out infinite; }
@keyframes sk-aura-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .status-dot { animation: none; } }

/* \u2500\u2500 Compact: watch face \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.watch-shell { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 12px; max-width: 100%; }
.watch-shell :is(.orb, .wave-visual) { --sk-assistant-orb: var(--sk-assistant-orb-watch, 84px); }
.watch-line { font-size: 13px; line-height: 1.35; max-height: 3.9em; overflow: hidden; color: var(--sk-text, inherit); }
.watch-status { font-size: var(--sk-font-size-small, 11px); color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent)); text-transform: uppercase; letter-spacing: 0.14em; }

/* \u2500\u2500 Expanded: hero + turn list \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
.expanded-shell { display: flex; flex-direction: column; height: 100%; width: 100%; background: var(--sk-surface, color-mix(in srgb, #ffffff 72%, transparent)); backdrop-filter: blur(var(--sk-blur, 16px)); -webkit-backdrop-filter: blur(var(--sk-blur, 16px)); }
.hero { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 16px 18px; }
.hero :is(.orb, .wave-visual) { --sk-assistant-orb: var(--sk-assistant-orb-hero, 92px); }
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 12px; border-radius: var(--sk-radius-pill, 999px);
  border: 1px solid var(--sk-border, color-mix(in srgb, currentColor 12%, transparent));
  background: var(--sk-surface-strong, color-mix(in srgb, #ffffff 92%, transparent));
  font-size: var(--sk-font-size-small, 11px);
}
.turns-wrap { position: relative; display: flex; flex: 1; min-height: 0; }
.turns { flex: 1; overflow-y: auto; padding: 4px 18px 14px; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; }
.turn { padding: 9px 0; border-top: 1px solid var(--sk-border, color-mix(in srgb, currentColor 12%, transparent)); }
.turn:first-child { border-top: none; }
.turn-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.turn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sk-assistant-user-dot, #8fa9ff); }
.turn[data-role="agent"] .turn-dot { background: var(--sk-assistant-agent-dot, #47e3c1); }
.turn-role { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent)); }
.turn-flag { font-size: 10px; color: var(--sk-live, #dc2626); border: 1px solid color-mix(in srgb, var(--sk-live, #dc2626) 40%, transparent); border-radius: var(--sk-radius-pill, 999px); padding: 0 6px; }
.turn-text { margin: 0; line-height: 1.45; overflow-wrap: anywhere; }
.turn[data-draft] .turn-text { color: var(--sk-text-muted, color-mix(in srgb, currentColor 55%, transparent)); }
.turn[data-draft] .turn-text::after { content: "\\258d"; color: var(--tone); animation: sk-aura-pulse 1s ease-in-out infinite; }
.jump {
  position: absolute;
  bottom: 8px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  border: 1px solid var(--sk-border, color-mix(in srgb, currentColor 12%, transparent));
  border-radius: var(--sk-radius-pill, 999px);
  background: var(--sk-surface-strong, color-mix(in srgb, #ffffff 92%, transparent));
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: var(--sk-font-size-small, 11px);
  font-weight: 600;
  padding: 4px 10px;
}
:host(:dir(rtl)) .jump { transform: translateX(50%); }
