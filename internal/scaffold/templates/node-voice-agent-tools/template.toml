name = "node-voice-agent-tools"
description = "Node.js + TypeScript script that opens a SpeechKit Voice Agent WebSocket, registers a host-side tool the agent can call, and prints agent transcripts as the conversation unfolds."
min_server_version = "0.30"

[[vars]]
name = "APP_NAME"
description = "Project name (also used as package name)"

[[vars]]
name = "SPEECHKIT_SERVER_URL"
description = "SpeechKit Server base URL"
default = "http://localhost:8080"
env_hint = "SPEECHKIT_SERVER_URL"

[[vars]]
name = "SPEECHKIT_TOKEN"
description = "Bearer token (leave blank if server has auth_mode = none)"
default = ""
env_hint = "SPEECHKIT_TOKEN"
optional = true

[[vars]]
name = "PERSONA_ID"
description = "Voice Agent persona ID to bind the session to"
default = "default"

[[post_init]]
description = "Install npm dependencies"
cmd = "npm install"
