name = "go-server-embed"
description = "Go HTTP service that embeds the SpeechKit Go client and exposes a thin /transcribe + /assist proxy. Includes an agentkit-based voice agent stub."
min_server_version = "0.30"

[[vars]]
name = "APP_NAME"
description = "Project name (also used as Go module path tail)"

[[vars]]
name = "GO_MODULE"
description = "Full Go module path (e.g. github.com/example/my-service)"
default = "example.com/{{.APP_NAME}}"

[[vars]]
name = "SPEECHKIT_SERVER_URL"
description = "SpeechKit Server base URL"
default = "http://localhost:8080"
env_hint = "SPEECHKIT_SERVER_URL"

[[vars]]
name = "SPEECHKIT_TOKEN"
description = "Bearer token (leave blank if server has auth_mode = none)"
default = ""
env_hint = "SPEECHKIT_TOKEN"
optional = true

[[post_init]]
description = "Pull Go dependencies"
cmd = "go mod tidy"
